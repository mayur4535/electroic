<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px;width:100%}
.row input,.row select,.unit-box{height:var(--h);border:1px solid #ccc;border-radius:8px;padding:8px;font-size:var(--f);font-weight:bold;display:flex;align-items:center}
.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px;min-width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{width:100%;height:var(--h);margin-top:var(--g);background:#008000;color:#fff;border:0;border-radius:10px;font-size:var(--f);font-weight:bold;cursor:pointer}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold;color:#333;line-height:1.6}
@media(max-width:600px){
body{padding:10px}
.box{padding:16px}
.row select,.unit-box{width:72px;min-width:72px;padding:6px;font-size:15px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Material</div>
<div class="row">
<select id="mat">
<option>Select</option>
<option>Copper</option>
<option>Silver</option>
<option>Gold</option>
<option>Aluminium</option>
<option>Tungsten</option>
<option>Platinum</option>
<option>Lead</option>
<option>Graphite</option>
</select>
<div class="unit-box">Type</div>
</div>
</div>

<div>
<div class="label">Gauge</div>
<div class="row">
<input id="awg" placeholder="ex: 10 or 4/0">
<div class="unit-box">AWG</div>
</div>
</div>

<div>
<div class="label">Resistivity</div>
<div class="row">
<input id="res" readonly>
<div class="unit-box">Ω·m</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<div class="result">

<div>
<div class="label">Diameter</div>
<div class="row">
<input id="din" readonly>
<div class="unit-box">in</div>
</div>
</div>

<div>
<div class="label">Diameter</div>
<div class="row">
<input id="dmm" readonly>
<div class="unit-box">mm</div>
</div>
</div>

<div>
<div class="label">Resistance</div>
<div class="row">
<input id="rft" readonly>
<div class="unit-box">Ω/kft</div>
</div>
</div>

<div>
<div class="label">kcmil</div>
<div class="row">
<input id="amil" readonly>
<div class="unit-box">kcmil</div>
</div>
</div>

<div>
<div class="label">Resistance</div>
<div class="row">
<input id="rm" readonly>
<div class="unit-box">Ω/km</div>
</div>
</div>

<div>
<div class="label">Area</div>
<div class="row">
<input id="ain" readonly>
<div class="unit-box">in²</div>
</div>
</div>

<div>
<div class="label">Area</div>
<div class="row">
<input id="amm" readonly>
<div class="unit-box">mm²</div>
</div>
</div>

</div>

<div class="formula">
d(in) = 0.005 × 92^((36 − n)/39)<br>
d(mm) = 0.127 × 92^((36 − n)/39)<br>
A = (π / 4) × d²<br>
R = ρ × Length / Area
</div>

</div>

<script>
const m=[
{r:1.72e-8,c:5.814e7},
{r:1.59e-8,c:6.289e7},
{r:2.40e-8,c:4.167e7},
{r:2.82e-8,c:3.546e7},
{r:5.60e-8,c:1.786e7},
{r:1.06e-7,c:9.434e6},
{r:1.90e-7,c:5.263e6},
{r:1.00e-5,c:1.000e5}
];

document.getElementById("mat").onchange=function(){
let i=this.selectedIndex, r=document.getElementById("res");
if(i<=0){r.value="";return}
r.value=m[i-1].r.toExponential(3);
};

document.getElementById("btn").onclick=function(){
let n=document.getElementById("awg").value.trim(),
r=parseFloat(document.getElementById("res").value),
o=["din","dmm","rft","amil","rm","ain","amm"].map(x=>document.getElementById(x));

if(n==="6/0"||n==="000000")n=-5;
else if(n==="5/0"||n==="00000")n=-4;
else if(n==="4/0"||n==="0000")n=-3;
else if(n==="3/0"||n==="000")n=-2;
else if(n==="2/0"||n==="00")n=-1;
else n=parseFloat(n);

if(isNaN(n)||isNaN(r)){o.forEach(x=>x.value="Enter values");return}

let din=0.005*Math.pow(92,((36-n)/39)),
dmm=0.127*Math.pow(92,((36-n)/39)),
amil=1000*din*din,
ain=Math.PI/4*din*din,
amm=Math.PI/4*dmm*dmm,
rft=0.3048e9*r/(25.4*25.4*ain),
rm=1e9*r/amm;

o[0].value=din.toFixed(4);
o[1].value=dmm.toFixed(4);
o[2].value=rft.toFixed(4);
o[3].value=amil.toFixed(4);
o[4].value=rm.toFixed(4);
o[5].value=ain.toFixed(4);
o[6].value=amm.toFixed(4);
};
</script>

</body>
</html>
