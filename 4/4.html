<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px}
.row input,.row select,.unit-box{
height:var(--h);border:1px solid #ccc;border-radius:8px;padding:8px;
font-size:var(--f);font-weight:bold;display:flex;align-items:center
}
.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{
width:100%;height:var(--h);margin-top:var(--g);
background:#008000;color:#fff;border:0;border-radius:10px;
font-size:var(--f);font-weight:bold
}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold}

@media(max-width:600px){
.row select,.unit-box{width:72px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Wire Diameter (d)</div>
<div class="row">
<input id="d"><select id="du">
<option value="0.001">mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Height Above Plane (h)</div>
<div class="row">
<input id="h"><select id="hu">
<option value="0.001">mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Length (l)</div>
<div class="row">
<input id="l"><select id="lu">
<option value="0.001">mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Relative Permeability</div>
<div class="row">
<input id="ur" value="1">
<div class="unit-box">-</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<div class="result">
<div>
<div class="label">Inductance</div>
<div class="row">
<input id="o" readonly>
<div class="unit-box">H</div>
</div>
</div>
</div>

<div class="formula">
L = (μ₀ μr / 2π) × l × acosh(2h / d)
</div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let d=parseFloat(document.getElementById("d").value),
h=parseFloat(document.getElementById("h").value),
l=parseFloat(document.getElementById("l").value),
ur=parseFloat(document.getElementById("ur").value),
du=parseFloat(document.getElementById("du").value),
hu=parseFloat(document.getElementById("hu").value),
lu=parseFloat(document.getElementById("lu").value),
o=document.getElementById("o");

if(isNaN(d)||isNaN(h)||isNaN(l)||isNaN(ur)){o.value="Enter values";return}

d*=du;h*=hu;l*=lu;

if(d<=0||h<=0||l<=0||ur<=0){o.value="Invalid";return}

let x=(2*h)/d;
if(x<=1){o.value="Invalid ratio";return}

let acosh=Math.log(x+Math.sqrt(x*x-1));

let L=(4*Math.PI*1e-7)*ur/(2*Math.PI)*l*acosh;

o.value=L.toExponential(3);

}
</script>

</body>
</html>
