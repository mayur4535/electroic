<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#swg-calc,
#swg-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:12px;
}

#swg-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:20px;
  border:1px solid #e5e7eb;
  border-radius:10px;
}

#swg-calc .calc-grid{
  display:grid;
  gap:15px;
}

#swg-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#swg-calc .calc-row{
  width:100%;
  display:flex;
  gap:8px;
  align-items:center;
}

#swg-calc input,
#swg-calc select{
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:15px;
  outline:none;
}

#swg-calc input,
#swg-calc select{
  flex:1;
  min-width:0;
  width:100%;
  padding:0 12px;
}

#swg-calc .unit-box{
  flex:0 0 82px;
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#swg-calc input:focus,
#swg-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#swg-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#swg-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#swg-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#swg-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#swg-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}
#swg-calc .result-card:nth-child(1) .result-label,
#swg-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#swg-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}
#swg-calc .result-card:nth-child(2) .result-label,
#swg-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#swg-calc .result-card:nth-child(3){
  background:#fff7ed;
  border:1px solid #fed7aa;
}
#swg-calc .result-card:nth-child(3) .result-label,
#swg-calc .result-card:nth-child(3) .result-value{
  color:#ea580c;
}

#swg-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#swg-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#swg-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  body{padding:10px}

  #swg-calc{
    padding:16px;
  }

  #swg-calc .calc-row{
    gap:7px;
  }

  #swg-calc .unit-box{
    flex:0 0 72px;
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }

  #swg-calc input,
  #swg-calc select{
    font-size:15px;
    padding:0 10px;
  }

  #swg-calc .result-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="swg-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Gauge</label>
      <div class="calc-row">
        <select id="g">
          <option value="">Select</option>
          <option>7/0</option><option>6/0</option><option>5/0</option><option>4/0</option>
          <option>3/0</option><option>2/0</option><option>0</option><option>1</option>
          <option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option>
          <option>10</option><option>11</option><option>12</option><option>13</option>
          <option>14</option><option>15</option><option>16</option><option>17</option>
          <option>18</option><option>19</option><option>20</option><option>21</option>
          <option>22</option><option>23</option><option>24</option><option>25</option>
          <option>26</option><option>27</option><option>28</option><option>29</option>
          <option>30</option><option>31</option><option>32</option><option>33</option>
          <option>34</option><option>35</option><option>36</option><option>37</option>
          <option>38</option><option>39</option><option>40</option><option>41</option>
          <option>42</option><option>43</option><option>44</option><option>45</option>
          <option>46</option><option>47</option><option>48</option><option>49</option>
          <option>50</option>
        </select>
        <div class="unit-box">SWG</div>
      </div>
    </div>

  </div>

  <button id="btn">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">
    <div class="result-card">
      <div class="result-label">Diameter</div>
      <div class="result-value"><span id="din">-</span> in</div>
    </div>

    <div class="result-card">
      <div class="result-label">Diameter</div>
      <div class="result-value"><span id="dmm">-</span> mm</div>
    </div>

    <div class="result-card">
      <div class="result-label">Cross Sectional Area</div>
      <div class="result-value"><span id="area">-</span> mm²</div>
    </div>
  </div>

  <div class="formula">
    Diameter(mm) = Diameter(in) × 25.4<br>
    Area = (π / 4) × d²
  </div>

</div>

<script>
document.getElementById("btn").onclick=function(){
let i=document.getElementById("g").selectedIndex,
o1=document.getElementById("din"),
o2=document.getElementById("dmm"),
o3=document.getElementById("area");

let dlook=[0.5,0.464,0.432,0.4,0.372,0.348,0.324,0.3,0.276,0.252,0.232,0.212,0.192,0.176,0.16,0.144,0.128,0.116,0.104,0.092,0.08,0.072,0.064,0.056,0.048,0.040,0.036,0.032,0.028,0.024,0.022,0.02,0.018,0.0164,0.0148,0.0136,0.0124,0.0116,0.0108,0.01,0.0092,0.0084,0.0076,0.0068,0.006,0.0052,0.0048,0.0044,0.004,0.0036,0.0032,0.0028,0.0024,0.002,0.0016,0.0012,0.001];

if(i<=0){
o1.innerText=o2.innerText=o3.innerText="Select";
return;
}

let a=dlook[i-1],b=25.4*a,c=Math.PI/4*b*b;

o1.innerText=a.toFixed(3);
o2.innerText=b.toFixed(3);
o3.innerText=c.toFixed(4);
}
</script>

</body>
</html>
