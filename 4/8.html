<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px;width:100%}
.row input,.row select,.unit-box{height:var(--h);border:1px solid #ccc;border-radius:8px;padding:8px;font-size:var(--f);font-weight:bold;display:flex;align-items:center}
.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px;min-width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{width:100%;height:var(--h);margin-top:var(--g);background:#008000;color:#fff;border:0;border-radius:10px;font-size:var(--f);font-weight:bold;cursor:pointer}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold;color:#333;line-height:1.6}
@media(max-width:600px){
body{padding:10px}
.box{padding:16px}
.row select,.unit-box{width:72px;min-width:72px;padding:6px;font-size:15px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">
<div>
<div class="label">Gauge</div>
<div class="row">
<select id="g">
<option value="">Select</option>
<option>7/0</option><option>6/0</option><option>5/0</option><option>4/0</option>
<option>3/0</option><option>2/0</option><option>0</option><option>1</option>
<option>2</option><option>3</option><option>4</option><option>5</option>
<option>6</option><option>7</option><option>8</option><option>9</option>
<option>10</option><option>11</option><option>12</option><option>13</option>
<option>14</option><option>15</option><option>16</option><option>17</option>
<option>18</option><option>19</option><option>20</option><option>21</option>
<option>22</option><option>23</option><option>24</option><option>25</option>
<option>26</option><option>27</option><option>28</option><option>29</option>
<option>30</option><option>31</option><option>32</option><option>33</option>
<option>34</option><option>35</option><option>36</option><option>37</option>
<option>38</option><option>39</option><option>40</option><option>41</option>
<option>42</option><option>43</option><option>44</option><option>45</option>
<option>46</option><option>47</option><option>48</option><option>49</option>
<option>50</option>
</select>
<div class="unit-box">SWG</div>
</div>
</div>
</div>

<button id="btn">Calculate</button>

<div class="result">

<div>
<div class="label">Diameter</div>
<div class="row">
<input id="din" readonly>
<div class="unit-box">in</div>
</div>
</div>

<div>
<div class="label">Diameter</div>
<div class="row">
<input id="dmm" readonly>
<div class="unit-box">mm</div>
</div>
</div>

<div>
<div class="label">Cross Sectional Area</div>
<div class="row">
<input id="area" readonly>
<div class="unit-box">mm²</div>
</div>
</div>

</div>

<div class="formula">
Diameter(mm) = Diameter(in) × 25.4<br>
Area = (π / 4) × d²
</div>

</div>

<script>
document.getElementById("btn").onclick=function(){
let i=document.getElementById("g").selectedIndex,
o1=document.getElementById("din"),
o2=document.getElementById("dmm"),
o3=document.getElementById("area");

let dlook=[0.5,0.464,0.432,0.4,0.372,0.348,0.324,0.3,0.276,0.252,0.232,0.212,0.192,0.176,0.16,0.144,0.128,0.116,0.104,0.092,0.08,0.072,0.064,0.056,0.048,0.040,0.036,0.032,0.028,0.024,0.022,0.02,0.018,0.0164,0.0148,0.0136,0.0124,0.0116,0.0108,0.01,0.0092,0.0084,0.0076,0.0068,0.006,0.0052,0.0048,0.0044,0.004,0.0036,0.0032,0.0028,0.0024,0.002,0.0016,0.0012,0.001];

if(i<=0){o1.value=o2.value=o3.value="Select";return}

let a=dlook[i-1],b=25.4*a,c=Math.PI/4*b*b;

o1.value=a.toFixed(3);
o2.value=b.toFixed(3);
o3.value=c.toFixed(4);
}
</script>

</body>
</html>
