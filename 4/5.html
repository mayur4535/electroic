<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#wire-self-calc,
#wire-self-calc *{
  box-sizing:border-box !important;
  font-family:Arial,sans-serif !important;
}

body{
  background:#f6f8fb;
  padding:12px;
}

#wire-self-calc{
  width:100% !important;
  max-width:620px !important;
  margin:0 auto !important;
  background:#fff !important;
  padding:20px !important;
  border:1px solid #e5e7eb !important;
  border-radius:10px !important;
}

#wire-self-calc .calc-grid{
  display:grid !important;
  grid-template-columns:1fr !important;
  gap:15px !important;
}

#wire-self-calc .calc-label{
  display:block !important;
  font-size:15px !important;
  font-weight:700 !important;
  color:#4b5563 !important;
  margin-bottom:7px !important;
}

#wire-self-calc .calc-row{
  width:100% !important;
  display:flex !important;
  gap:8px !important;
  align-items:center !important;
}

#wire-self-calc .calc-row input{
  flex:1 1 auto !important;
  width:100% !important;
  min-width:0 !important;
  max-width:none !important;
  height:43px !important;
  border:1px solid #cfd6df !important;
  border-radius:8px !important;
  padding:0 12px !important;
  font-size:15px !important;
  color:#111827 !important;
  background:#fff !important;
  outline:none !important;
}

#wire-self-calc .calc-row select,
#wire-self-calc .unit-box{
  flex:0 0 82px !important;
  width:82px !important;
  min-width:82px !important;
  max-width:82px !important;
  height:43px !important;
  border:1px solid #cfd6df !important;
  border-radius:8px !important;
  padding:0 8px !important;
  font-size:15px !important;
  color:#111827 !important;
  background:#fff !important;
  outline:none !important;
}

#wire-self-calc .unit-box{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  font-weight:700 !important;
  background:#fafafa !important;
}

#wire-self-calc input:focus,
#wire-self-calc select:focus{
  border-color:#ff6a00 !important;
  box-shadow:0 0 0 3px rgba(255,106,0,.12) !important;
}

#wire-self-calc button{
  width:100% !important;
  height:45px !important;
  margin-top:24px !important;
  border:0 !important;
  border-radius:9px !important;
  background:linear-gradient(90deg,#ff7a18,#ff3d00) !important;
  color:#fff !important;
  font-size:15px !important;
  font-weight:800 !important;
  cursor:pointer !important;
  box-shadow:0 7px 16px rgba(255,91,0,.22) !important;
}

#wire-self-calc .result-title{
  margin-top:30px !important;
  margin-bottom:14px !important;
  font-size:14px !important;
  font-weight:800 !important;
  color:#a7afbd !important;
  letter-spacing:.5px !important;
}

#wire-self-calc .result-card{
  min-height:64px !important;
  padding:14px !important;
  border-radius:9px !important;
  background:#eef5ff !important;
  border:1px solid #bcd7ff !important;
}

#wire-self-calc .result-label{
  font-size:12px !important;
  font-weight:900 !important;
  text-transform:uppercase !important;
  margin-bottom:7px !important;
  color:#2563eb !important;
}

#wire-self-calc .result-value{
  font-size:16px !important;
  font-weight:900 !important;
  color:#059669 !important;
}

#wire-self-calc .formula{
  margin-top:18px !important;
  padding:14px !important;
  border-radius:9px !important;
  background:#f9fafb !important;
  border:1px solid #e5e7eb !important;
  font-size:14px !important;
  line-height:1.6 !important;
  color:#667085 !important;
  font-weight:700 !important;
}

@media(max-width:600px){
  body{
    padding:10px !important;
  }

  #wire-self-calc{
    padding:16px !important;
  }

  #wire-self-calc .calc-row{
    gap:7px !important;
  }

  #wire-self-calc .calc-row input{
    height:43px !important;
    font-size:15px !important;
    padding:0 10px !important;
  }

  #wire-self-calc .calc-row select,
  #wire-self-calc .unit-box{
    flex:0 0 72px !important;
    width:72px !important;
    min-width:72px !important;
    max-width:72px !important;
    height:43px !important;
    font-size:15px !important;
    padding:0 6px !important;
  }
}
</style>
</head>

<body>

<div id="wire-self-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Wire Diameter (d)</label>
      <div class="calc-row">
        <input type="number" id="d">
        <select id="du">
          <option value="0.1">mm</option>
          <option value="1">cm</option>
          <option value="0.0001">um</option>
          <option value="2.54">inch</option>
          <option value="0.00254">mil</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Wire Length (l)</label>
      <div class="calc-row">
        <input type="number" id="l">
        <select id="lu">
          <option value="1" selected>cm</option>
          <option value="0.1">mm</option>
          <option value="0.0001">um</option>
          <option value="2.54">inch</option>
          <option value="0.00254">mil</option>
        </select>
      </div>
    </div>

  </div>

  <button id="btn">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-card">
    <div class="result-label">Inductance</div>
    <div class="result-value"><span id="o">-</span> nH</div>
  </div>

  <div class="formula">
    L = 2l [ ln( (2l/d)(1 + √(1 + (d/2l)²)) ) − √(1 + (d/2l)²) + 0.25 + (d/2l) ]
  </div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let d=parseFloat(document.getElementById("d").value),
l=parseFloat(document.getElementById("l").value),
du=parseFloat(document.getElementById("du").value),
lu=parseFloat(document.getElementById("lu").value),
o=document.getElementById("o");

if(isNaN(d)||isNaN(l)){o.innerText="Enter values";return}

// convert to cm (AAC requirement)
d*=du;
l*=lu;

if(d<=0||l<=0){o.innerText="Invalid";return}

let x=d/(2*l);

let L = 2*l*(Math.log((2*l/d)*(1+Math.sqrt(1+x*x))) - Math.sqrt(1+x*x) + 0.25 + x);

o.innerText=L.toFixed(3);

}
</script>

</body>
</html>
