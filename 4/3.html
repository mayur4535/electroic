<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px;width:100%}
.row input,.row select,.unit-box{
height:var(--h);
border:1px solid #ccc;
border-radius:8px;
padding:8px;
font-size:var(--f);
font-weight:bold;
display:flex;
align-items:center;
}
.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px;min-width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{
width:100%;
height:var(--h);
margin-top:var(--g);
background:#008000;
color:#fff;
border:0;
border-radius:10px;
font-size:var(--f);
font-weight:bold;
cursor:pointer
}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold;color:#333;line-height:1.6}

@media(max-width:600px){
.box{padding:16px}
.row select,.unit-box{width:72px;min-width:72px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<!-- INPUTS -->

<div>
<div class="label">Wire Diameter (d)</div>
<div class="row">
<input type="number" id="a">
<select id="b">
<option value="0.0000254">mil</option>
<option value="0.001" selected>mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Loop Diameter (D)</div>
<div class="row">
<input type="number" id="c">
<select id="d">
<option value="0.0000254">mil</option>
<option value="0.001" selected>mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Relative Permeability (μr)</div>
<div class="row">
<input type="number" id="e" value="1">
<div class="unit-box">-</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<!-- OUTPUT LIKE INPUT -->

<div class="result">
<div>
<div class="label">Inductance</div>
<div class="row">
<input id="o" readonly>
<div class="unit-box">H</div>
</div>
</div>
</div>

<div class="formula">
L = μ₀ μr (D / 2) [ ln(8D / d) − 2 ]
</div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let d=parseFloat(document.getElementById("a").value),
D=parseFloat(document.getElementById("c").value),
ur=parseFloat(document.getElementById("e").value),
du=parseFloat(document.getElementById("b").value),
Du=parseFloat(document.getElementById("d").value);

if(isNaN(d)||isNaN(D)||isNaN(ur)){
document.getElementById("o").value="Enter values";return;
}

d*=du;
D*=Du;

if(d<=0||D<=0||ur<=0){
document.getElementById("o").value="Invalid";return;
}

let mu0=4*Math.PI*1e-7;
let L=mu0*ur*(D/2)*(Math.log((8*D)/d)-2);

document.getElementById("o").value=L.toExponential(3);

}
</script>

</body>
</html>
