<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#f6f8fb;
  padding:24px;
  color:#1f2937;
}

.box{
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:28px;
  border-radius:8px;
  border:1px solid #e5e7eb;
}

.grid{
  display:grid;
  gap:14px;
}

.label{
  display:block;
  font-size:14px;
  font-weight:700;
  color:#566174;
  margin-bottom:7px;
}

.row{
  display:flex;
  gap:8px;
  width:100%;
}

.row input{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#374151;
  outline:none;
  background:#fff;
}

.row select,
.unit-box{
  flex:0 0 95px;
  width:95px;
  height:40px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 10px;
  font-size:15px;
  color:#374151;
  outline:none;
  background:#fff;
}

.unit-box{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  background:#fafafa;
}

.row input:focus,
.row select:focus{
  border-color:#ff7a1a;
  box-shadow:0 0 0 3px rgba(255,122,26,.12);
}

button{
  width:100%;
  height:43px;
  margin-top:26px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7819,#ff5b00);
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(255,91,0,.22);
}

.result-title{
  margin-top:30px;
  margin-bottom:16px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

.result{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.result-card{
  min-height:62px;
  padding:13px 14px;
  border-radius:8px;
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

.result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:6px;
  color:#2563eb;
}

.result-value{
  font-size:15px;
  font-weight:800;
  color:#2563eb;
  word-break:break-word;
}

.formula{
  margin-top:18px;
  padding:13px;
  border-radius:8px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){

  body{
    padding:12px;
  }

  .box{
    padding:18px;
  }

  .row{
    gap:7px;
  }

  .row input{
    height:40px;
    font-size:14px;
    padding:0 10px;
  }

  .row select,
  .unit-box{
    flex:0 0 78px;
    width:78px;
    height:40px;
    font-size:14px;
    padding:0 8px;
  }
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Wire Diameter (d)</div>
<div class="row">
<input type="number" id="a">
<select id="b">
<option value="0.0000254">mil</option>
<option value="0.001" selected>mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Loop Diameter (D)</div>
<div class="row">
<input type="number" id="c">
<select id="d">
<option value="0.0000254">mil</option>
<option value="0.001" selected>mm</option>
<option value="0.01">cm</option>
<option value="0.000001">um</option>
<option value="0.0254">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Relative Permeability (μr)</div>
<div class="row">
<input type="number" id="e" value="1">
<div class="unit-box">-</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<div class="result-title">RESULTS</div>

<div class="result">

<div class="result-card">
<div class="result-label">Inductance</div>
<div class="result-value">
<span id="o">-</span> H
</div>
</div>

</div>

<div class="formula">
L = μ₀ μr (D / 2) [ ln(8D / d) − 2 ]
</div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let d=parseFloat(document.getElementById("a").value),
D=parseFloat(document.getElementById("c").value),
ur=parseFloat(document.getElementById("e").value),
du=parseFloat(document.getElementById("b").value),
Du=parseFloat(document.getElementById("d").value);

if(isNaN(d)||isNaN(D)||isNaN(ur)){
document.getElementById("o").innerText="Enter values";
return;
}

d*=du;
D*=Du;

if(d<=0||D<=0||ur<=0){
document.getElementById("o").innerText="Invalid";
return;
}

let mu0=4*Math.PI*1e-7;
let L=mu0*ur*(D/2)*(Math.log((8*D)/d)-2);

document.getElementById("o").innerText=L.toExponential(3);

}
</script>

</body>
</html>
