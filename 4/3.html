<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#loop-inductance-calc,
#loop-inductance-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:10px;
}

#loop-inductance-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
  border-radius:0;
}

#loop-inductance-calc .ej-form{
  display:grid;
  gap:15px;
}

#loop-inductance-calc .ej-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#loop-inductance-calc .ej-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#loop-inductance-calc input,
#loop-inductance-calc select,
#loop-inductance-calc .unit-box{
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:15px;
  outline:none;
}

#loop-inductance-calc input{
  width:100%;
  min-width:0;
  padding:0 12px;
}

#loop-inductance-calc select,
#loop-inductance-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  padding:0 8px;
}

#loop-inductance-calc .unit-box{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  background:#fafafa;
}

#loop-inductance-calc input:focus,
#loop-inductance-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#loop-inductance-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#loop-inductance-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#loop-inductance-calc .result{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

#loop-inductance-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#loop-inductance-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
  color:#2563eb;
}

#loop-inductance-calc .result-value{
  font-size:16px;
  font-weight:900;
  color:#059669;
  word-break:break-word;
}

#loop-inductance-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #loop-inductance-calc{
    padding-top:12px;
  }

  #loop-inductance-calc .ej-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #loop-inductance-calc select,
  #loop-inductance-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
    padding:0 6px;
  }

  #loop-inductance-calc input{
    font-size:15px;
    padding:0 10px;
  }
}
</style>
</head>

<body>

<div id="loop-inductance-calc">

  <div class="ej-form">

    <div>
      <label class="ej-label">Wire Diameter (d)</label>
      <div class="ej-row">
        <input type="number" id="a">
        <select id="b">
          <option value="0.0000254">mil</option>
          <option value="0.001" selected>mm</option>
          <option value="0.01">cm</option>
          <option value="0.000001">um</option>
          <option value="0.0254">inch</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Loop Diameter (D)</label>
      <div class="ej-row">
        <input type="number" id="c">
        <select id="d">
          <option value="0.0000254">mil</option>
          <option value="0.001" selected>mm</option>
          <option value="0.01">cm</option>
          <option value="0.000001">um</option>
          <option value="0.0254">inch</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Relative Permeability (μr)</label>
      <div class="ej-row">
        <input type="number" id="e" value="1">
        <div class="unit-box">-</div>
      </div>
    </div>

  </div>

  <button id="btn">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result">
    <div class="result-card">
      <div class="result-label">Inductance</div>
      <div class="result-value"><span id="o">-</span> H</div>
    </div>
  </div>

  <div class="formula">
    L = μ₀ μr (D / 2) [ ln(8D / d) − 2 ]
  </div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let d=parseFloat(document.getElementById("a").value),
D=parseFloat(document.getElementById("c").value),
ur=parseFloat(document.getElementById("e").value),
du=parseFloat(document.getElementById("b").value),
Du=parseFloat(document.getElementById("d").value);

if(isNaN(d)||isNaN(D)||isNaN(ur)){
document.getElementById("o").innerText="Enter values";
return;
}

d*=du;
D*=Du;

if(d<=0||D<=0||ur<=0){
document.getElementById("o").innerText="Invalid";
return;
}

let mu0=4*Math.PI*1e-7;
let L=mu0*ur*(D/2)*(Math.log((8*D)/d)-2);

document.getElementById("o").innerText=L.toExponential(3);

}
</script>

</body>
</html>
