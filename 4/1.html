<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#parallel-wire-calc,
#parallel-wire-calc *{
  box-sizing:border-box !important;
  font-family:Arial,sans-serif !important;
}

body{
  background:#f6f8fb;
  padding:14px;
}

#parallel-wire-calc{
  width:100% !important;
  max-width:620px !important;
  margin:0 auto !important;
  background:#fff !important;
  padding:20px !important;
  border:1px solid #e5e7eb !important;
  border-radius:10px !important;
}

#parallel-wire-calc .ej-form{
  display:grid !important;
  gap:15px !important;
}

#parallel-wire-calc .ej-label{
  display:block !important;
  font-size:15px !important;
  font-weight:700 !important;
  color:#4b5563 !important;
  margin-bottom:7px !important;
}

#parallel-wire-calc .ej-row{
  width:100% !important;
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 72px !important;
  gap:8px !important;
  align-items:center !important;
}

#parallel-wire-calc input,
#parallel-wire-calc select{
  height:43px !important;
  border:1px solid #cfd6df !important;
  border-radius:8px !important;
  background:#fff !important;
  color:#111827 !important;
  font-size:15px !important;
  outline:none !important;
  box-shadow:none !important;
}

#parallel-wire-calc input{
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  padding:0 12px !important;
}

#parallel-wire-calc select{
  width:72px !important;
  min-width:72px !important;
  max-width:72px !important;
  padding:0 5px !important;
}

#parallel-wire-calc input:focus,
#parallel-wire-calc select:focus{
  border-color:#ff6a00 !important;
  box-shadow:0 0 0 3px rgba(255,106,0,.12) !important;
}

#parallel-wire-calc button{
  width:100% !important;
  height:45px !important;
  margin-top:24px !important;
  border:0 !important;
  border-radius:9px !important;
  background:linear-gradient(90deg,#ff7a18,#ff3d00) !important;
  color:#fff !important;
  font-size:15px !important;
  font-weight:800 !important;
  cursor:pointer !important;
  box-shadow:0 7px 16px rgba(255,91,0,.22) !important;
}

#parallel-wire-calc .result-title{
  margin-top:30px !important;
  margin-bottom:14px !important;
  font-size:14px !important;
  font-weight:800 !important;
  color:#a7afbd !important;
  letter-spacing:.5px !important;
}

#parallel-wire-calc .result-card{
  background:#eef5ff !important;
  border:1px solid #bcd7ff !important;
  border-radius:9px !important;
  padding:15px !important;
}

#parallel-wire-calc .result-label{
  font-size:13px !important;
  font-weight:900 !important;
  color:#2563eb !important;
  text-transform:uppercase !important;
  margin-bottom:8px !important;
}

#parallel-wire-calc .result-value{
  font-size:17px !important;
  font-weight:900 !important;
  color:#059669 !important;
}

#parallel-wire-calc .formula{
  margin-top:18px !important;
  padding:14px !important;
  border-radius:9px !important;
  background:#f9fafb !important;
  border:1px solid #e5e7eb !important;
  font-size:14px !important;
  line-height:1.6 !important;
  color:#667085 !important;
}

@media(max-width:600px){
  body{
    padding:10px !important;
  }

  #parallel-wire-calc{
    padding:16px !important;
  }

  #parallel-wire-calc .ej-row{
    grid-template-columns:minmax(0,1fr) 60px !important;
    gap:7px !important;
  }

  #parallel-wire-calc select{
    width:60px !important;
    min-width:60px !important;
    max-width:60px !important;
    font-size:14px !important;
    padding:0 3px !important;
  }

  #parallel-wire-calc input{
    font-size:14px !important;
    padding:0 10px !important;
  }
}
</style>
</head>

<body>

<div id="parallel-wire-calc">

  <div class="ej-form">

    <div>
      <label class="ej-label">Wire Diameter (D)</label>
      <div class="ej-row">
        <input type="number" id="diameter" placeholder="12">
        <select id="diameterUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1">m</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Center Spacing (S)</label>
      <div class="ej-row">
        <input type="number" id="spacing" placeholder="12">
        <select id="spacingUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1">m</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Wire Length (l)</label>
      <div class="ej-row">
        <input type="number" id="length" placeholder="12">
        <select id="lengthUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1" selected>m</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Relative Permeability (μr)</label>
      <div class="ej-row">
        <input type="number" id="ur" value="1">
        <select disabled>
          <option>-</option>
        </select>
      </div>
    </div>

  </div>

  <button onclick="calculate()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-card">
    <div class="result-label">Inductance</div>
    <div class="result-value" id="result">-</div>
  </div>

  <div class="formula">
    Formula: L = (μ₀ × μr × l / π) × acosh(S / D)
  </div>

</div>

<script>
function calculate(){

  let D = parseFloat(document.getElementById("diameter").value);
  let S = parseFloat(document.getElementById("spacing").value);
  let l = parseFloat(document.getElementById("length").value);
  let ur = parseFloat(document.getElementById("ur").value);

  let DUnit = parseFloat(document.getElementById("diameterUnit").value);
  let SUnit = parseFloat(document.getElementById("spacingUnit").value);
  let lUnit = parseFloat(document.getElementById("lengthUnit").value);

  if(isNaN(D) || isNaN(S) || isNaN(l) || isNaN(ur)){
    alert("Enter all values");
    return;
  }

  D *= DUnit;
  S *= SUnit;
  l *= lUnit;

  if(S <= D){
    alert("Spacing must be greater than diameter");
    return;
  }

  const mu0 = 4 * Math.PI * 1e-7;
  let x = S / D;
  let acosh = Math.log(x + Math.sqrt(x*x - 1));
  let L = (mu0 * ur * l / Math.PI) * acosh;

  let output;

  if(L < 1e-6){
    output = (L * 1e9).toFixed(4) + " nH";
  }else if(L < 1e-3){
    output = (L * 1e6).toFixed(4) + " µH";
  }else if(L < 1){
    output = (L * 1e3).toFixed(4) + " mH";
  }else{
    output = L.toFixed(6) + " H";
  }

  document.getElementById("result").innerText = output;
}
</script>

</body>
</html>
