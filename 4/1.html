<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#f6f8fb;
  padding:16px;
  color:#1f2937;
}

.calculator-box{
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:8px;
  border:1px solid #e5e7eb;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.form-group label{
  display:block;
  font-size:14px;
  font-weight:700;
  color:#566174;
  margin-bottom:7px;
}

.input-row{
  display:flex;
  gap:8px;
  width:100%;
}

.input-row input{
  flex:1 1 auto;
  min-width:0;
  width:100%;
  height:42px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#374151;
  outline:none;
  background:#fff;
}

.input-row select{
  flex:0 0 82px;
  width:82px;
  max-width:82px;
  height:42px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 8px;
  font-size:15px;
  color:#374151;
  outline:none;
  background:#fff;
}

.input-row input:focus,
.input-row select:focus{
  border-color:#ff7a1a;
  box-shadow:0 0 0 3px rgba(255,122,26,.12);
}

button{
  width:100%;
  height:43px;
  margin-top:26px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7819,#ff5b00);
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(255,91,0,.22);
}

.result-title{
  margin-top:30px;
  margin-bottom:16px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

.result-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.result-card{
  min-height:58px;
  padding:13px 14px;
  border-radius:8px;
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

.result-label{
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:6px;
  color:#2563eb;
}

.result-value{
  font-size:15px;
  font-weight:800;
  color:#2563eb;
}

.formula{
  margin-top:18px;
  padding:13px;
  border-radius:8px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:13px;
  line-height:1.6;
  color:#667085;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .calculator-box{
    padding:16px;
  }

  .input-row{
    gap:7px;
  }

  .input-row input{
    height:42px;
    font-size:14px;
    padding:0 10px;
  }

  .input-row select{
    flex:0 0 70px;
    width:70px;
    max-width:70px;
    height:42px;
    font-size:14px;
    padding:0 6px;
  }
}
</style>
</head>

<body>

<div class="calculator-box">

  <div class="form-grid">

    <div class="form-group">
      <label>Wire Diameter (D)</label>
      <div class="input-row">
        <input type="number" id="diameter" placeholder="12">
        <select id="diameterUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1">m</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Center Spacing (S)</label>
      <div class="input-row">
        <input type="number" id="spacing" placeholder="12">
        <select id="spacingUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1">m</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Wire Length (l)</label>
      <div class="input-row">
        <input type="number" id="length" placeholder="12">
        <select id="lengthUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1" selected>m</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Relative Permeability (μr)</label>
      <div class="input-row">
        <input type="number" id="ur" value="1">
        <select disabled>
          <option>-</option>
        </select>
      </div>
    </div>

  </div>

  <button onclick="calculate()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">
    <div class="result-card">
      <div class="result-label">Inductance</div>
      <div class="result-value" id="result">-</div>
    </div>
  </div>

  <div class="formula">
    Formula: L = (μ₀ × μr × l / π) × acosh(S / D)
  </div>

</div>

<script>
function calculate(){

  let D = parseFloat(document.getElementById("diameter").value);
  let S = parseFloat(document.getElementById("spacing").value);
  let l = parseFloat(document.getElementById("length").value);
  let ur = parseFloat(document.getElementById("ur").value);

  let DUnit = parseFloat(document.getElementById("diameterUnit").value);
  let SUnit = parseFloat(document.getElementById("spacingUnit").value);
  let lUnit = parseFloat(document.getElementById("lengthUnit").value);

  if(isNaN(D) || isNaN(S) || isNaN(l) || isNaN(ur)){
    alert("Enter all values");
    return;
  }

  D *= DUnit;
  S *= SUnit;
  l *= lUnit;

  if(S <= D){
    alert("Spacing must be greater than diameter");
    return;
  }

  const mu0 = 4 * Math.PI * 1e-7;
  let x = S / D;
  let acosh = Math.log(x + Math.sqrt(x*x - 1));
  let L = (mu0 * ur * l / Math.PI) * acosh;

  let output;

  if(L < 1e-6){
    output = (L * 1e9).toFixed(4) + " nH";
  }else if(L < 1e-3){
    output = (L * 1e6).toFixed(4) + " µH";
  }else if(L < 1){
    output = (L * 1e3).toFixed(4) + " mH";
  }else{
    output = L.toFixed(6) + " H";
  }

  document.getElementById("result").innerText = output;
}
</script>

</body>
</html>
