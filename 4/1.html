<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#parallel-wire-calc,
#parallel-wire-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:10px;
}

#parallel-wire-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  background:transparent;
  padding:0;
  border:none;
  border-radius:0;
}

#parallel-wire-calc .ej-form{
  display:grid;
  gap:15px;
}

#parallel-wire-calc .ej-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#parallel-wire-calc .ej-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#parallel-wire-calc input,
#parallel-wire-calc select{
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:15px;
  outline:none;
}

#parallel-wire-calc input{
  width:100%;
  min-width:0;
  padding:0 12px;
}

#parallel-wire-calc select{
  width:82px;
  min-width:82px;
  max-width:82px;
  padding:0 8px;
}

#parallel-wire-calc input:focus,
#parallel-wire-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#parallel-wire-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#parallel-wire-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#parallel-wire-calc .result-card{
  background:#eef5ff;
  border:1px solid #bcd7ff;
  border-radius:9px;
  padding:15px;
}

#parallel-wire-calc .result-label{
  font-size:13px;
  font-weight:900;
  color:#2563eb;
  text-transform:uppercase;
  margin-bottom:8px;
}

#parallel-wire-calc .result-value{
  font-size:17px;
  font-weight:900;
  color:#059669;
}

#parallel-wire-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #parallel-wire-calc .ej-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #parallel-wire-calc select{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
    padding:0 6px;
  }

  #parallel-wire-calc input{
    font-size:15px;
    padding:0 10px;
  }
}
</style>
</head>

<body>

<div id="parallel-wire-calc">

  <div class="ej-form">

    <div>
      <label class="ej-label">Wire Diameter (D)</label>
      <div class="ej-row">
        <input type="number" id="diameter" placeholder="12">
        <select id="diameterUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1">m</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Center Spacing (S)</label>
      <div class="ej-row">
        <input type="number" id="spacing" placeholder="12">
        <select id="spacingUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1">m</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Wire Length (l)</label>
      <div class="ej-row">
        <input type="number" id="length" placeholder="12">
        <select id="lengthUnit">
          <option value="0.001">mm</option>
          <option value="0.01">cm</option>
          <option value="1" selected>m</option>
        </select>
      </div>
    </div>

    <div>
      <label class="ej-label">Relative Permeability (μr)</label>
      <div class="ej-row">
        <input type="number" id="ur" value="1">
        <select disabled>
          <option>-</option>
        </select>
      </div>
    </div>

  </div>

  <button onclick="calculate()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-card">
    <div class="result-label">Inductance</div>
    <div class="result-value" id="result">-</div>
  </div>

  <div class="formula">
    Formula: L = (μ₀ × μr × l / π) × acosh(S / D)
  </div>

</div>

<script>
function calculate(){

  let D = parseFloat(document.getElementById("diameter").value);
  let S = parseFloat(document.getElementById("spacing").value);
  let l = parseFloat(document.getElementById("length").value);
  let ur = parseFloat(document.getElementById("ur").value);

  let DUnit = parseFloat(document.getElementById("diameterUnit").value);
  let SUnit = parseFloat(document.getElementById("spacingUnit").value);
  let lUnit = parseFloat(document.getElementById("lengthUnit").value);

  if(isNaN(D) || isNaN(S) || isNaN(l) || isNaN(ur)){
    alert("Enter all values");
    return;
  }

  D *= DUnit;
  S *= SUnit;
  l *= lUnit;

  if(S <= D){
    alert("Spacing must be greater than diameter");
    return;
  }

  const mu0 = 4 * Math.PI * 1e-7;

  let x = S / D;
  let acosh = Math.log(x + Math.sqrt(x*x - 1));

  let L = (mu0 * ur * l / Math.PI) * acosh;

  let output;

  if(L < 1e-6){
    output = (L * 1e9).toFixed(4) + " nH";
  }else if(L < 1e-3){
    output = (L * 1e6).toFixed(4) + " µH";
  }else if(L < 1){
    output = (L * 1e3).toFixed(4) + " mH";
  }else{
    output = L.toFixed(6) + " H";
  }

  document.getElementById("result").innerText = output;
}
</script>

</body>
</html>
