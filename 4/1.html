<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f6f8fb;
  color:#111827;
}

#borderimg{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:18px;
  border:0;
}

#tool{
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

legend h3{
  font-size:28px;
  margin:0 0 18px;
}

.form-group{
  margin-bottom:18px;
}

.control-label{
  display:block;
  font-size:15px;
  font-weight:700;
  margin-bottom:8px;
}

.intro{
  width:100% !important;
  height:46px !important;
  font-size:15px !important;
  padding:10px 12px !important;
  border:1px solid #d1d5db !important;
  border-radius:10px !important;
  outline:none;
  position:static !important;
  right:auto !important;
  margin:0 !important;
}

.intro:focus{
  border-color:#16a34a !important;
  box-shadow:0 0 0 3px rgba(22,163,74,.15);
}

.input-line{
  display:grid;
  grid-template-columns:1fr 95px;
  gap:10px;
}

button,
input[type="button"],
input[type="submit"]{
  width:100%;
  height:52px;
  border:0;
  border-radius:10px;
  background:#008000;
  color:#fff;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

button:hover,
input[type="button"]:hover,
input[type="submit"]:hover{
  background:#006b00;
}

@media (min-width:768px){
  .calculator-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
  }
}

@media (min-width:1100px){
  .calculator-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media (max-width:600px){
  #borderimg{
    padding:12px;
  }

  #tool{
    padding:18px;
    border-radius:14px;
  }

  legend h3{
    font-size:24px;
  }

  .input-line{
    grid-template-columns:1fr 78px;
  }

  .intro{
    height:44px !important;
    font-size:14px !important;
  }
}
</style>
