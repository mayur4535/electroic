<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f4f7fb;
  padding:20px;
  color:#111827;
}

.calculator-box{
  max-width:600px; /* better for single column */
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h2{
  margin-bottom:10px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:20px;
}

/* ALWAYS SINGLE COLUMN */
.form-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.form-group label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
}

/* Input row */
.input-row{
  display:flex;
  gap:8px;
}

.input-row input,
.input-row select{
  height:46px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:10px;
  font-size:15px;
}

.input-row input{
  flex:1;
}

.input-row select{
  width:80px;
}

/* Button */
button{
  width:100%;
  height:50px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#008000;
  color:white;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:#006b00;
}

/* Result */
.result-box{
  margin-top:18px;
  padding:16px;
  border-radius:12px;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
}

.result-box input{
  width:100%;
  height:45px;
  border:1px solid #86efac;
  border-radius:10px;
  padding:10px;
  font-weight:700;
}

.formula{
  margin-top:15px;
  font-size:14px;
  color:#4b5563;
}

/* Mobile small tweak */
@media(max-width:600px){
  body{
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="calculator-box">



<div class="form-grid">

<!-- Diameter -->
<div class="form-group">
<label>Wire Diameter (D)</label>
<div class="input-row">
<input type="number" id="diameter">
<select id="diameterUnit">
<option value="0.001">mm</option>
<option value="0.01">cm</option>
<option value="1">m</option>
</select>
</div>
</div>

<!-- Spacing -->
<div class="form-group">
<label>Center Spacing (S)</label>
<div class="input-row">
<input type="number" id="spacing">
<select id="spacingUnit">
<option value="0.001">mm</option>
<option value="0.01">cm</option>
<option value="1">m</option>
</select>
</div>
</div>

<!-- Length -->
<div class="form-group">
<label>Wire Length (l)</label>
<div class="input-row">
<input type="number" id="length">
<select id="lengthUnit">
<option value="0.001">mm</option>
<option value="0.01">cm</option>
<option value="1" selected>m</option>
</select>
</div>
</div>

<!-- μr -->
<div class="form-group">
<label>Relative Permeability (μr)</label>
<div class="input-row">
<input type="number" id="ur" value="1">
<select disabled>
<option>-</option>
</select>
</div>
</div>

</div>

<button onclick="calculate()">Calculate</button>

<div class="result-box">
<input type="text" id="result" readonly placeholder="Result will appear here">
</div>

<div class="formula">
Formula: L = (μ₀ × μr × l / π) × acosh(S / D)
</div>

</div>

<script>
function calculate(){

  let D = parseFloat(document.getElementById("diameter").value);
  let S = parseFloat(document.getElementById("spacing").value);
  let l = parseFloat(document.getElementById("length").value);
  let ur = parseFloat(document.getElementById("ur").value);

  let DUnit = parseFloat(document.getElementById("diameterUnit").value);
  let SUnit = parseFloat(document.getElementById("spacingUnit").value);
  let lUnit = parseFloat(document.getElementById("lengthUnit").value);

  if(isNaN(D) || isNaN(S) || isNaN(l)){
    alert("Enter all values");
    return;
  }

  // Convert to meters
  D *= DUnit;
  S *= SUnit;
  l *= lUnit;

  if(S <= D){
    alert("Spacing must be greater than diameter");
    return;
  }

  const mu0 = 4 * Math.PI * 1e-7;

  // acosh(x)
  let x = S / D;
  let acosh = Math.log(x + Math.sqrt(x*x - 1));

  let L = (mu0 * ur * l / Math.PI) * acosh;

  let output;

  if(L < 1e-6){
    output = (L * 1e9).toFixed(4) + " nH";
  }else if(L < 1e-3){
    output = (L * 1e6).toFixed(4) + " µH";
  }else if(L < 1){
    output = (L * 1e3).toFixed(4) + " mH";
  }else{
    output = L.toFixed(6) + " H";
  }

  document.getElementById("result").value = output;
}
</script>

</body>
</html>
