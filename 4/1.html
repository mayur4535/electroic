<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parallel Wire Inductance Calculator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f5f7fb;
  padding:20px;
}

/* Container */
.calculator{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* Title */
h2{
  margin-bottom:20px;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
}

/* Desktop layout */
@media(min-width:768px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(min-width:1100px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

/* Input group */
.group label{
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
  display:block;
}

.input-row{
  display:flex;
  gap:8px;
}

.input-row input{
  flex:1;
  height:45px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

.input-row select{
  width:80px;
  border-radius:8px;
}

/* Button */
button{
  margin-top:20px;
  width:100%;
  height:50px;
  border:none;
  border-radius:10px;
  background:#008000;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#006b00;
}

/* Output */
.output{
  margin-top:20px;
}

.output input{
  width:100%;
  height:45px;
  border-radius:8px;
  border:1px solid #ccc;
  padding:10px;
}
</style>
</head>

<body>

<div class="calculator">

<h2>Parallel Wire Inductance Calculator</h2>

<div class="grid">

<div class="group">
<label>Wire Radius (r)</label>
<div class="input-row">
<input type="number" id="r">
<select><option>mm</option></select>
</div>
</div>

<div class="group">
<label>Wire Spacing (D)</label>
<div class="input-row">
<input type="number" id="d">
<select><option>mm</option></select>
</div>
</div>

<div class="group">
<label>Wire Length (l)</label>
<div class="input-row">
<input type="number" id="l">
<select><option>mm</option></select>
</div>
</div>

<div class="group">
<label>Relative Permeability (μr)</label>
<div class="input-row">
<input type="number" id="ur" value="1">
<select><option>-</option></select>
</div>
</div>

</div>

<button onclick="calculate()">Calculate</button>

<div class="output">
<label>Inductance (L)</label>
<input type="text" id="result" readonly>
</div>

</div>

<script>
function calculate(){
  let r = parseFloat(document.getElementById("r").value);
  let d = parseFloat(document.getElementById("d").value);
  let l = parseFloat(document.getElementById("l").value);
  let ur = parseFloat(document.getElementById("ur").value);

  if(!r || !d || !l){
    alert("Enter all values");
    return;
  }

  // Simple inductance formula (approx)
  let mu0 = 4 * Math.PI * 1e-7;
  let L = (mu0 * ur * l * Math.log(d/r));

  document.getElementById("result").value = L.toExponential(4) + " H";
}
</script>

</body>
</html>
