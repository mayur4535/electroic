<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#cutoff-frequency-calc,
#cutoff-frequency-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:10px;
}

#cutoff-frequency-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
  border-radius:0;
}

#cutoff-frequency-calc .calc-grid{
  display:grid;
  gap:15px;
}

#cutoff-frequency-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#cutoff-frequency-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#cutoff-frequency-calc input{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#cutoff-frequency-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#cutoff-frequency-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#cutoff-frequency-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#cutoff-frequency-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#cutoff-frequency-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#cutoff-frequency-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
  color:#2563eb;
}

#cutoff-frequency-calc .result-value{
  font-size:16px;
  font-weight:900;
  color:#059669;
  word-break:break-word;
}

#cutoff-frequency-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #cutoff-frequency-calc{
    padding-top:12px;
  }

  #cutoff-frequency-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #cutoff-frequency-calc input{
    font-size:15px;
    padding:0 10px;
  }

  #cutoff-frequency-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="cutoff-frequency-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Capacitance per meter</label>
      <div class="calc-row">
        <input type="number" id="c">
        <div class="unit-box">pF/m</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Cable Length</label>
      <div class="calc-row">
        <input type="number" id="d">
        <div class="unit-box">m</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Source Impedance</label>
      <div class="calc-row">
        <input type="number" id="r">
        <div class="unit-box">Ω</div>
      </div>
    </div>

  </div>

  <button id="btn">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-card">
    <div class="result-label">Cutoff Frequency</div>
    <div class="result-value"><span id="o">-</span> Hz</div>
  </div>

  <div class="formula">
    f = 1 / (2π × R × C × D)
  </div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let R=parseFloat(document.getElementById("r").value),
C=parseFloat(document.getElementById("c").value),
D=parseFloat(document.getElementById("d").value),
o=document.getElementById("o");

if(isNaN(R)||isNaN(C)||isNaN(D)){
o.innerText="Enter values";
return;
}

if(R<=0||C<=0||D<=0){
o.innerText="Invalid";
return;
}

let F = 1/(2*3.141592654*R*C*1e-12*D);

o.innerText=Math.round(F);
}
</script>

</body>
</html>
