<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial;
}

:root{
  --font-main:16px;
  --box-height:48px;
  --gap:12px;
}

body{
  background:#f4f7fb;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.grid{
  display:grid;
  gap:var(--gap);
}

.label{
  font-size:14px;
  font-weight:bold;
  margin-bottom:5px;
}

.row{
  display:flex;
  gap:8px;
}

.row input,
.row select,
.unit-box{
  height:var(--box-height);
  border:1px solid #ccc;
  border-radius:8px;
  padding:8px;
  font-size:var(--font-main);
  font-weight:bold;
  display:flex;
  align-items:center;
}

.row input{
  flex:1;
}

.row select{
  width:90px;
}

.unit-box{
  width:90px;
  justify-content:center;
  background:#fafafa;
}

button{
  width:100%;
  height:var(--box-height);
  margin-top:var(--gap);
  background:#008000;
  color:#fff;
  border:0;
  border-radius:10px;
  font-size:var(--font-main);
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:var(--gap);
  display:grid;
  gap:var(--gap);
}

/* Formula */
.formula{
  margin-top:15px;
  font-size:14px;
  font-weight:bold;
  color:#333;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<!-- Diameter -->
<div>
<div class="label">Wire Diameter</div>
<div class="row">
<input type="number" id="d">
<select id="d_unit">
<option value="0.001">mil</option>
<option value="0.03937008">mm</option>
<option value="0.3937008">cm</option>
<option value="0.00003937008">um</option>
<option value="1">inch</option>
</select>
</div>
</div>

<!-- Spacing -->
<div>
<div class="label">Spacing</div>
<div class="row">
<input type="number" id="s">
<select id="s_unit">
<option value="0.001">mil</option>
<option value="0.03937008">mm</option>
<option value="0.3937008">cm</option>
<option value="0.00003937008">um</option>
<option value="1">inch</option>
</select>
</div>
</div>

<!-- Dielectric -->
<div>
<div class="label">Dielectric (εr)</div>
<div class="row">
<input type="number" id="er" value="1">
<div class="unit-box">-</div>
</div>
</div>

</div>

<button onclick="calc()">Calculate</button>

<div class="result">

<div class="row">
<input id="zo" readonly>
<div class="unit-box">Ω</div>
</div>

<div class="row">
<input id="delay" readonly>
<div class="unit-box">ns/in</div>
</div>

<div class="row">
<input id="ind" readonly>
<div class="unit-box">nH/in</div>
</div>

<div class="row">
<input id="cap" readonly>
<div class="unit-box">pF/in</div>
</div>

</div>

<!-- FORMULA -->
<div class="formula">
Zo = (120 / √εr) × ln(2S / D) <br>
Delay = 8.472 × √εr (ns/in) <br>
Inductance = 10.16 × ln(2S / D) (nH/in) <br>
Capacitance = (0.7065 × εr) / ln(2S / D) (pF/in)
</div>

</div>

<script>
function calc(){

  let d = parseFloat(document.getElementById("d").value);
  let s = parseFloat(document.getElementById("s").value);
  let er = parseFloat(document.getElementById("er").value);

  let dUnit = parseFloat(document.getElementById("d_unit").value);
  let sUnit = parseFloat(document.getElementById("s_unit").value);

  if(isNaN(d) || isNaN(s) || isNaN(er)){
    alert("Enter all values");
    return;
  }

  d *= dUnit;
  s *= sUnit;

  if(d <= 0 || s <= 0 || er <= 0){
    alert("Values must be greater than 0");
    return;
  }

  let ratio = (2 * s) / d;

  if(ratio <= 1){
    alert("Spacing must be greater than diameter");
    return;
  }

  let logValue = Math.log(ratio);

  let zo = (120 / Math.sqrt(er)) * logValue;
  let delay = (8.472e-11 * Math.sqrt(er)) / 1e-9;
  let ind = (1.016e-8 * logValue) / 1e-9;
  let cap = ((7.065e-13 / logValue) * er) / 1e-12;

  document.getElementById("zo").value = zo.toFixed(3);
  document.getElementById("delay").value = delay.toFixed(3);
  document.getElementById("ind").value = ind.toFixed(3);
  document.getElementById("cap").value = cap.toFixed(3);
}
</script>

</body>
</html>
