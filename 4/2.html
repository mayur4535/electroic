<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#f6f8fb;
  padding:24px;
  color:#1f2937;
}

.box{
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:28px;
  border-radius:8px;
  border:1px solid #e5e7eb;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.label{
  display:block;
  font-size:14px;
  font-weight:700;
  color:#566174;
  margin-bottom:7px;
}

.row{
  display:flex;
  gap:8px;
  width:100%;
}

.row input{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#374151;
  outline:none;
  background:#fff;
}

.row select,
.unit-box{
  flex:0 0 95px;
  width:95px;
  height:40px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 10px;
  font-size:15px;
  color:#374151;
  outline:none;
  background:#fff;
}

.unit-box{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  background:#fafafa;
}

.row input:focus,
.row select:focus{
  border-color:#ff7a1a;
  box-shadow:0 0 0 3px rgba(255,122,26,.12);
}

button{
  width:100%;
  height:43px;
  margin-top:26px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7819,#ff5b00);
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(255,91,0,.22);
}

.result-title{
  margin-top:30px;
  margin-bottom:16px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

.result{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.result-card{
  min-height:62px;
  padding:13px 14px;
  border-radius:8px;
}

.result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:6px;
}

.result-value{
  font-size:15px;
  font-weight:800;
}

.blue{
  background:#eef5ff;
  border:1px solid #bcd7ff;
}
.blue .result-label,.blue .result-value{color:#2563eb}

.green{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}
.green .result-label,.green .result-value{color:#059669}

.purple{
  background:#f5f3ff;
  border:1px solid #ddd6fe;
}
.purple .result-label,.purple .result-value{color:#7c3aed}

.orange{
  background:#fff7ed;
  border:1px solid #fed7aa;
}
.orange .result-label,.orange .result-value{color:#ea580c}

.formula{
  margin-top:18px;
  padding:13px;
  border-radius:8px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  body{padding:12px}
  .box{padding:18px}

  .row{gap:7px}

  .row input{
    height:40px;
    font-size:14px;
    padding:0 10px;
  }

  .row select,
  .unit-box{
    flex:0 0 78px;
    width:78px;
    height:40px;
    font-size:14px;
    padding:0 8px;
  }

  .result{
    grid-template-columns:1fr;
    gap:12px;
  }
}
</style>
</head>

<body>

<div class="box">

  <div class="grid">

    <div>
      <div class="label">Wire Diameter</div>
      <div class="row">
        <input type="number" id="a">
        <select id="b">
          <option value="0.001">mil</option>
          <option value="0.03937008">mm</option>
          <option value="0.3937008">cm</option>
          <option value="0.00003937008">um</option>
          <option value="1">inch</option>
        </select>
      </div>
    </div>

    <div>
      <div class="label">Spacing</div>
      <div class="row">
        <input type="number" id="c">
        <select id="d">
          <option value="0.001">mil</option>
          <option value="0.03937008">mm</option>
          <option value="0.3937008">cm</option>
          <option value="0.00003937008">um</option>
          <option value="1">inch</option>
        </select>
      </div>
    </div>

    <div>
      <div class="label">Dielectric (εr)</div>
      <div class="row">
        <input type="number" id="e" value="1">
        <div class="unit-box">-</div>
      </div>
    </div>

  </div>

  <button onclick="q()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result">
    <div class="result-card blue">
      <div class="result-label">Zo</div>
      <div class="result-value"><span id="r1">-</span> Ω</div>
    </div>

    <div class="result-card green">
      <div class="result-label">Delay</div>
      <div class="result-value"><span id="r2">-</span> ns/in</div>
    </div>

    <div class="result-card purple">
      <div class="result-label">Inductance</div>
      <div class="result-value"><span id="r3">-</span> nH/in</div>
    </div>

    <div class="result-card orange">
      <div class="result-label">Capacitance</div>
      <div class="result-value"><span id="r4">-</span> pF/in</div>
    </div>
  </div>

  <div class="formula">
    Zo = (120 / √εr) × ln(2S / D)<br>
    Delay = 84.72 × 10⁻³ × √εr<br>
    L = 10.16 × ln(2S / D)<br>
    C = (0.7065 × εr) / ln(2S / D)
  </div>

</div>

<script>
function q(){
  let x=parseFloat(a.value),
      y=parseFloat(c.value),
      z=parseFloat(e.value),
      u=parseFloat(b.value),
      v=parseFloat(d.value);

  if(isNaN(x)||isNaN(y)||isNaN(z))return alert("Enter all values");

  x*=u;
  y*=v;

  if(x<=0||y<=0||z<=0)return alert("Invalid value");

  let n=2*y/x;

  if(n<=1)return alert("Spacing must be greater than diameter");

  let m=Math.log(n);

  r1.innerText=(120/Math.sqrt(z)*m).toFixed(3);
  r2.innerText=(.08472*Math.sqrt(z)).toFixed(3);
  r3.innerText=(10.16*m).toFixed(3);
  r4.innerText=(.7065*z/m).toFixed(3);
}
</script>

</body>
</html>
