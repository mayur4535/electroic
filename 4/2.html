<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;grid-template-columns:1fr;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px;width:100%}
.row input,.row select,.unit-box{height:var(--h);border:1px solid #ccc;border-radius:8px;padding:8px;font-size:var(--f);font-weight:bold;display:flex;align-items:center}
.row input{flex:1;width:100%;min-width:0}
.row select,.unit-box{width:90px;min-width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{width:100%;height:var(--h);margin-top:var(--g);background:#008000;color:#fff;border:0;border-radius:10px;font-size:var(--f);font-weight:bold;cursor:pointer}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold;color:#333;line-height:1.6}
@media(max-width:600px){
body{padding:10px}
.box{padding:16px;max-width:100%;overflow:hidden}
.row select,.unit-box{width:72px;min-width:72px;padding:6px;font-size:15px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Wire Diameter</div>
<div class="row">
<input type="number" id="a">
<select id="b">
<option value="0.001">mil</option>
<option value="0.03937008">mm</option>
<option value="0.3937008">cm</option>
<option value="0.00003937008">um</option>
<option value="1">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Spacing</div>
<div class="row">
<input type="number" id="c">
<select id="d">
<option value="0.001">mil</option>
<option value="0.03937008">mm</option>
<option value="0.3937008">cm</option>
<option value="0.00003937008">um</option>
<option value="1">inch</option>
</select>
</div>
</div>

<div>
<div class="label">Dielectric (εr)</div>
<div class="row">
<input type="number" id="e" value="1">
<div class="unit-box">-</div>
</div>
</div>

</div>

<button onclick="q()">Calculate</button>

<div class="result">
<div class="row"><input id="r1" readonly><div class="unit-box">Ω</div></div>
<div class="row"><input id="r2" readonly><div class="unit-box">ns/in</div></div>
<div class="row"><input id="r3" readonly><div class="unit-box">nH/in</div></div>
<div class="row"><input id="r4" readonly><div class="unit-box">pF/in</div></div>
</div>

<div class="formula">
Zo = (120 / √εr) × ln(2S / D)<br>
Delay = 84.72 × 10⁻³ × √εr<br>
L = 10.16 × ln(2S / D)<br>
C = (0.7065 × εr) / ln(2S / D)
</div>

</div>

<script>
function q(){let x=parseFloat(a.value),y=parseFloat(c.value),z=parseFloat(e.value),u=parseFloat(b.value),v=parseFloat(d.value);if(isNaN(x)||isNaN(y)||isNaN(z))return alert("Enter all values");x*=u;y*=v;if(x<=0||y<=0||z<=0)return alert("Invalid value");let n=2*y/x;if(n<=1)return alert("Spacing must be greater than diameter");let m=Math.log(n);r1.value=(120/Math.sqrt(z)*m).toFixed(3);r2.value=(.08472*Math.sqrt(z)).toFixed(3);r3.value=(10.16*m).toFixed(3);r4.value=(.7065*z/m).toFixed(3)}
</script>

</body>
</html>
