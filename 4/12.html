<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px;width:100%}
.row input,.row select,.unit-box{height:var(--h);border:1px solid #ccc;border-radius:8px;padding:8px;font-size:var(--f);font-weight:bold;display:flex;align-items:center}
.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px;min-width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{width:100%;height:var(--h);margin-top:var(--g);background:#008000;color:#fff;border:0;border-radius:10px;font-size:var(--f);font-weight:bold;cursor:pointer}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold;color:#333;line-height:1.6}
@media(max-width:600px){
body{padding:10px}
.box{padding:16px}
.row select,.unit-box{width:72px;min-width:72px;padding:6px;font-size:15px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Material</div>
<div class="row">
<select id="mat">
<option>Select</option>
<option>Copper</option>
<option>Silver</option>
<option>Gold</option>
<option>Aluminium</option>
<option>Tungsten</option>
<option>Platinum</option>
<option>Lead</option>
<option>Graphite</option>
<option>Nichrome</option>
<option>Nickel</option>
</select>
<div class="unit-box">Type</div>
</div>
</div>

<div>
<div class="label">Resistivity</div>
<div class="row">
<input id="res" readonly>
<div class="unit-box">Ω·m</div>
</div>
</div>

<div>
<div class="label">Wire Diameter</div>
<div class="row">
<input id="s" placeholder="ex: 10 or 4/0">
<select id="ssel">
<option>AWG</option>
<option>inch</option>
<option>mm</option>
</select>
</div>
</div>

<div>
<div class="label">Wire Length One Way</div>
<div class="row">
<input type="number" id="len">
<select id="lsel">
<option>feet</option>
<option>meters</option>
</select>
</div>
</div>

<div>
<div class="label">Current Type</div>
<div class="row">
<select id="phase">
<option>DC</option>
<option>AC Single Ø</option>
<option selected>AC Three Ø</option>
</select>
<div class="unit-box">Type</div>
</div>
</div>

<div>
<div class="label">Voltage</div>
<div class="row">
<input type="number" id="v">
<div class="unit-box">V</div>
</div>
</div>

<div>
<div class="label">Current</div>
<div class="row">
<input type="number" id="i">
<div class="unit-box">A</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<div class="result">

<div>
<div class="label">Voltage Drop</div>
<div class="row">
<input id="vd" readonly>
<div class="unit-box">V</div>
</div>
</div>

<div>
<div class="label">Voltage Drop</div>
<div class="row">
<input id="vdp" readonly>
<div class="unit-box">%</div>
</div>
</div>

<div>
<div class="label">Resistance</div>
<div class="row">
<input id="r" readonly>
<div class="unit-box">Ω</div>
</div>
</div>

</div>

<div class="formula">
A = πd² / 4<br>
R = 2 × ρ × Length / A<br>
Vdrop = Current × R<br>
For 3 Phase: Vdrop × 1.732 / 2
</div>

</div>

<script>
const matData=[
1.72e-8,
1.59e-8,
2.40e-8,
2.82e-8,
5.60e-8,
1.06e-7,
1.90e-7,
1.00e-5,
1.10e-6,
6.99e-8
];

document.getElementById("mat").onchange=function(){
let x=this.selectedIndex;
let r=document.getElementById("res");

if(x<=0){
r.value="";
return;
}

r.value=matData[x-1].toExponential(3);
};

document.getElementById("btn").onclick=function(){

let n=document.getElementById("s").value.trim();
let len=parseFloat(document.getElementById("len").value);
let v=parseFloat(document.getElementById("v").value);
let i=parseFloat(document.getElementById("i").value);
let res=parseFloat(document.getElementById("res").value);

let ssel=document.getElementById("ssel").selectedIndex;
let lsel=document.getElementById("lsel").selectedIndex;
let phase=document.getElementById("phase").selectedIndex;

let o1=document.getElementById("vd");
let o2=document.getElementById("vdp");
let o3=document.getElementById("r");

if(n===""||isNaN(len)||isNaN(v)||isNaN(i)||isNaN(res)){
o1.value=o2.value=o3.value="Enter values";
return;
}

let d;

if(ssel==0){
if(n==="000000"||n==="6/0")n=-5;
else if(n==="00000"||n==="5/0")n=-4;
else if(n==="0000"||n==="4/0")n=-3;
else if(n==="000"||n==="3/0")n=-2;
else if(n==="00"||n==="2/0")n=-1;
else n=parseFloat(n);

if(isNaN(n)||n>40){
o1.value=o2.value=o3.value="Invalid AWG";
return;
}

d=0.127e-3*Math.pow(92,((36-n)/39));
}
else if(ssel==1){
d=25.4*parseFloat(n)/1000;
}
else{
d=parseFloat(n)/1000;
}

if(lsel==0){
len*=0.3048;
}

if(d<=0||len<=0||v<=0||i<=0){
o1.value=o2.value=o3.value="Invalid";
return;
}

let a=Math.PI*d*d/4.0;
let r=2*res*len/a;
let vd=i*r;

if(phase==2){
vd*=(1.732/2);
}

let vdp=vd/v*100;

o1.value=vd.toPrecision(6);
o2.value=vdp.toPrecision(6);
o3.value=r.toPrecision(6);

};
</script>

</body>
</html>
