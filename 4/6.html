<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#cable-length-calc,
#cable-length-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:12px;
}

#cable-length-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:20px;
  border:1px solid #e5e7eb;
  border-radius:10px;
}

#cable-length-calc .calc-grid{
  display:grid;
  gap:15px;
}

#cable-length-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#cable-length-calc .calc-row{
  width:100%;
  display:flex;
  gap:8px;
  align-items:center;
}

#cable-length-calc .calc-row input{
  flex:1;
  min-width:0;
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#cable-length-calc .unit-box{
  flex:0 0 82px;
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#cable-length-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#cable-length-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#cable-length-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#cable-length-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#cable-length-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
  color:#2563eb;
}

#cable-length-calc .result-value{
  font-size:16px;
  font-weight:900;
  color:#059669;
  word-break:break-word;
}

#cable-length-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  #cable-length-calc{
    padding:16px;
  }

  #cable-length-calc .calc-row{
    gap:7px;
  }

  #cable-length-calc .calc-row input{
    font-size:15px;
    padding:0 10px;
  }

  #cable-length-calc .unit-box{
    flex:0 0 72px;
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="cable-length-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Capacitance (C)</label>
      <div class="calc-row">
        <input type="number" id="c">
        <div class="unit-box">pF/m</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Cutoff Frequency (f)</label>
      <div class="calc-row">
        <input type="number" id="f">
        <div class="unit-box">Hz</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Impedance (Z)</label>
      <div class="calc-row">
        <input type="number" id="z">
        <div class="unit-box">Ω</div>
      </div>
    </div>

  </div>

  <button id="btn">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-card">
    <div class="result-label">Cable Length</div>
    <div class="result-value"><span id="o">-</span> m</div>
  </div>

  <div class="formula">
    d = 1 / (2π × Z × C × f)
  </div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let c=parseFloat(document.getElementById("c").value),
f=parseFloat(document.getElementById("f").value),
z=parseFloat(document.getElementById("z").value),
o=document.getElementById("o");

if(isNaN(c)||isNaN(f)||isNaN(z)){
o.innerText="Enter values";
return;
}

if(c<=0||f<=0||z<=0){
o.innerText="Invalid";
return;
}

// convert pF → F
c = c * 1e-12;

let d = 1 / (2 * Math.PI * z * c * f);

o.innerText = d.toFixed(3);

}
</script>

</body>
</html>
