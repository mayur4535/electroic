<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px}
.row input,.unit-box{
height:var(--h);border:1px solid #ccc;border-radius:8px;padding:8px;
font-size:var(--f);font-weight:bold;display:flex;align-items:center}
.row input{flex:1}
.unit-box{width:90px;justify-content:center;background:#fafafa}
button{
width:100%;height:var(--h);margin-top:var(--g);
background:#008000;color:#fff;border:0;border-radius:10px;
font-size:var(--f);font-weight:bold}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold}

@media(max-width:600px){
.unit-box{width:72px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Capacitance (C)</div>
<div class="row">
<input id="c">
<div class="unit-box">pF/m</div>
</div>
</div>

<div>
<div class="label">Cutoff Frequency (f)</div>
<div class="row">
<input id="f">
<div class="unit-box">Hz</div>
</div>
</div>

<div>
<div class="label">Impedance (Z)</div>
<div class="row">
<input id="z">
<div class="unit-box">Ω</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<div class="result">
<div>
<div class="label">Cable Length</div>
<div class="row">
<input id="o" readonly>
<div class="unit-box">m</div>
</div>
</div>
</div>

<div class="formula">
d = 1 / (2π × Z × C × f)
</div>

</div>

<script>
document.getElementById("btn").onclick=function(){

let c=parseFloat(document.getElementById("c").value),
f=parseFloat(document.getElementById("f").value),
z=parseFloat(document.getElementById("z").value),
o=document.getElementById("o");

if(isNaN(c)||isNaN(f)||isNaN(z)){o.value="Enter values";return}

if(c<=0||f<=0||z<=0){o.value="Invalid";return}

// convert pF → F
c = c * 1e-12;

let d = 1 / (2 * Math.PI * z * c * f);

o.value = d.toFixed(3);

}
</script>

</body>
</html>
