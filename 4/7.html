<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#voltage-drop-calc,
#voltage-drop-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:12px;
}

#voltage-drop-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:20px;
  border:1px solid #e5e7eb;
  border-radius:10px;
}

#voltage-drop-calc .calc-grid{
  display:grid;
  gap:15px;
}

#voltage-drop-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#voltage-drop-calc .calc-row{
  width:100%;
  display:flex;
  gap:8px;
  align-items:center;
}

#voltage-drop-calc input,
#voltage-drop-calc select{
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:15px;
  outline:none;
}

#voltage-drop-calc .calc-row input,
#voltage-drop-calc .calc-row select{
  flex:1;
  min-width:0;
  width:100%;
  padding:0 12px;
}

#voltage-drop-calc .unit-box{
  flex:0 0 82px;
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#voltage-drop-calc .vd-row{
  display:grid;
  grid-template-columns:82px minmax(0,1fr);
  gap:8px;
}

#voltage-drop-calc .vd-row select{
  width:82px;
  min-width:82px;
  max-width:82px;
  padding:0 8px;
}

#voltage-drop-calc .vd-row input{
  width:100%;
  min-width:0;
  padding:0 12px;
}

#voltage-drop-calc input:focus,
#voltage-drop-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#voltage-drop-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#voltage-drop-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#voltage-drop-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#voltage-drop-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#voltage-drop-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#voltage-drop-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#voltage-drop-calc .blue{
  background:#eef5ff;
  border:1px solid #bcd7ff;
}
#voltage-drop-calc .blue .result-label,
#voltage-drop-calc .blue .result-value{
  color:#2563eb;
}

#voltage-drop-calc .green{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}
#voltage-drop-calc .green .result-label,
#voltage-drop-calc .green .result-value{
  color:#059669;
}

#voltage-drop-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  body{padding:10px}

  #voltage-drop-calc{
    padding:16px;
  }

  #voltage-drop-calc .calc-row{
    gap:7px;
  }

  #voltage-drop-calc .unit-box{
    flex:0 0 72px;
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }

  #voltage-drop-calc .vd-row{
    grid-template-columns:72px minmax(0,1fr);
    gap:7px;
  }

  #voltage-drop-calc .vd-row select{
    width:72px;
    min-width:72px;
    max-width:72px;
    padding:0 6px;
  }

  #voltage-drop-calc .vd-row input{
    width:100%;
    min-width:0;
    padding:0 10px;
  }

  #voltage-drop-calc input,
  #voltage-drop-calc select{
    font-size:15px;
  }

  #voltage-drop-calc .result-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="voltage-drop-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Source Voltage</label>
      <div class="calc-row">
        <select id="v">
          <option value="110">110</option>
          <option value="120">120</option>
          <option value="208">208</option>
          <option value="220">220</option>
          <option value="230">230</option>
          <option value="240">240</option>
          <option value="277">277</option>
          <option value="440">440</option>
          <option value="480">480</option>
        </select>
        <div class="unit-box">V</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Phase</label>
      <div class="calc-row">
        <select id="ph">
          <option value="1">Single</option>
          <option value="1.732">Three</option>
        </select>
        <div class="unit-box">Ø</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Current</label>
      <div class="calc-row">
        <input type="number" id="amp">
        <div class="unit-box">A</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Distance</label>
      <div class="calc-row">
        <input type="number" id="dist">
        <div class="unit-box">ft</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Voltage Drop</label>
      <div class="calc-row vd-row">
        <select id="dropType">
          <option value="0.03">3%</option>
          <option value="0.05">5%</option>
          <option value="custom">Custom</option>
        </select>
        <input type="number" id="customDrop" placeholder="V">
      </div>
    </div>

  </div>

  <button id="btn">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">
    <div class="result-card blue">
      <div class="result-label">Copper</div>
      <div class="result-value"><span id="cu">-</span> AWG</div>
    </div>

    <div class="result-card green">
      <div class="result-label">Aluminium</div>
      <div class="result-value"><span id="al">-</span> AWG</div>
    </div>
  </div>

  <div class="formula">
    CM = (K × 2 × A × Distance ÷ (Source Voltage × Voltage Drop)) × Phase Multiplier
  </div>

</div>

<script>
const type = document.getElementById("dropType");
const box = document.getElementById("customDrop");

function toggleVD(){
  if(type.value === "custom"){
    box.disabled = false;
  }else{
    box.disabled = true;
    box.value = "";
  }
}
type.addEventListener("change", toggleVD);
toggleVD();

document.getElementById("btn").onclick=function(){

let V=parseFloat(document.getElementById("v").value),
P=parseFloat(document.getElementById("ph").value),
A=parseFloat(document.getElementById("amp").value),
D=parseFloat(document.getElementById("dist").value),
T=document.getElementById("dropType").value,
X=parseFloat(document.getElementById("customDrop").value),
cu=document.getElementById("cu"),
al=document.getElementById("al");

if(isNaN(A)||isNaN(D)){
cu.innerText=al.innerText="Enter values";
return;
}

let vd=(T==="custom")?(X/V):parseFloat(T);

if(isNaN(vd)||vd<=0||V<=0||A<=0||D<=0){
cu.innerText=al.innerText="Invalid";
return;
}

let circ=[1620,2580,4110,6530,10380,15510,26240,41740,52620,66360,83690,105600,133100,167800,211600,250000,300000,350000,400000,500000,600000,700000,750000,800000,900000,1000000,1250000,1500000,1750000,2000000],
size=["18 AWG","16 AWG","14 AWG","12 AWG","10 AWG","8 AWG","6 AWG","4 AWG","3 AWG","2 AWG","1 AWG","1/0 AWG","2/0 AWG","3/0 AWG","4/0 AWG","250 MCM","300 MCM","350 MCM","400 MCM","500 MCM","600 MCM","700 MCM","750 MCM","800 MCM","900 MCM","1000 MCM","1250 MCM","1500 MCM","1750 MCM","2000 MCM"],
amax=[0,0,0,20,25,30,40,55,65,75,85,100,135,155,180,205,230,250,270,310,340,375,385,395,425,445,485,520,545,560],
cmax=[14,18,20,25,30,40,55,70,85,95,110,125,175,200,230,255,285,310,335,380,420,460,475,490,520,545,590,625,650,665];

function get(k,mx){
let cm=((k*2*A*D)/(V*vd))*P, r=size[0];
for(let i=0;i<size.length;i++){
if((cm>circ[i])||(A>mx[i])) r=size[i+1]||"Out of Range";
}
return r;
}

cu.innerText=get(11.2,cmax);
al.innerText=get(17.4,amax);

}
</script>

</body>
</html>
