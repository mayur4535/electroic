<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}
body{background:#f4f7fb;padding:20px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.grid{display:grid;gap:var(--g)}
.label{font-size:14px;font-weight:bold;margin-bottom:5px}
.row{display:flex;gap:8px;width:100%}
.row input,.row select,.unit-box{
height:var(--h);
border:1px solid #ccc;
border-radius:8px;
padding:8px;
font-size:var(--f);
font-weight:bold;
display:flex;
align-items:center;
}
.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px;min-width:90px}
.unit-box{justify-content:center;background:#fafafa}
button{
width:100%;
height:var(--h);
margin-top:var(--g);
background:#008000;
color:#fff;
border:0;
border-radius:10px;
font-size:var(--f);
font-weight:bold;
cursor:pointer
}
.result{margin-top:var(--g);display:grid;gap:var(--g)}
.formula{margin-top:15px;font-size:14px;font-weight:bold;color:#333;line-height:1.6}

@media(max-width:600px){
body{padding:10px}
.box{padding:16px}
.row select,.unit-box{width:72px;min-width:72px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<div>
<div class="label">Source Voltage</div>
<div class="row">
<select id="v">
<option value="110">110</option>
<option value="120">120</option>
<option value="208">208</option>
<option value="220">220</option>
<option value="230">230</option>
<option value="240">240</option>
<option value="277">277</option>
<option value="440">440</option>
<option value="480">480</option>
</select>
<div class="unit-box">V</div>
</div>
</div>

<div>
<div class="label">Phase</div>
<div class="row">
<select id="ph">
<option value="1">Single</option>
<option value="1.732">Three</option>
</select>
<div class="unit-box">Ø</div>
</div>
</div>

<div>
<div class="label">Current</div>
<div class="row">
<input type="number" id="amp">
<div class="unit-box">A</div>
</div>
</div>

<div>
<div class="label">Distance</div>
<div class="row">
<input type="number" id="dist">
<div class="unit-box">ft</div>
</div>
</div>

<div>
<div class="label">Voltage Drop</div>
<div class="row">
<select id="dropType">
<option value="0.03">3%</option>
<option value="0.05">5%</option>
<option value="custom">Custom</option>
</select>
<input type="number" id="customDrop" placeholder="V">
</div>
</div>

</div>

<button id="btn">Calculate</button>

<div class="result">

<div>
<div class="label">Copper</div>
<div class="row">
<input id="cu" readonly>
<div class="unit-box">AWG</div>
</div>
</div>

<div>
<div class="label">Aluminium</div>
<div class="row">
<input id="al" readonly>
<div class="unit-box">AWG</div>
</div>
</div>

</div>

<div class="formula">
CM = (K × 2 × A × Distance ÷ (Source Voltage × Voltage Drop)) × Phase Multiplier
</div>

</div>

<script>

// toggle custom input
const type = document.getElementById("dropType");
const box = document.getElementById("customDrop");

function toggleVD(){
  if(type.value === "custom"){
    box.disabled = false;
  }else{
    box.disabled = true;
    box.value = "";
  }
}
type.addEventListener("change", toggleVD);
toggleVD();

// calculation
document.getElementById("btn").onclick=function(){

let V=parseFloat(document.getElementById("v").value),
P=parseFloat(document.getElementById("ph").value),
A=parseFloat(document.getElementById("amp").value),
D=parseFloat(document.getElementById("dist").value),
T=document.getElementById("dropType").value,
X=parseFloat(document.getElementById("customDrop").value),
cu=document.getElementById("cu"),
al=document.getElementById("al");

if(isNaN(A)||isNaN(D)){cu.value=al.value="Enter values";return}

let vd=(T==="custom")?(X/V):parseFloat(T);

if(isNaN(vd)||vd<=0||V<=0||A<=0||D<=0){cu.value=al.value="Invalid";return}

// ORIGINAL LOGIC
let circ=[1620,2580,4110,6530,10380,15510,26240,41740,52620,66360,83690,105600,133100,167800,211600,250000,300000,350000,400000,500000,600000,700000,750000,800000,900000,1000000,1250000,1500000,1750000,2000000],
size=["18 AWG","16 AWG","14 AWG","12 AWG","10 AWG","8 AWG","6 AWG","4 AWG","3 AWG","2 AWG","1 AWG","1/0 AWG","2/0 AWG","3/0 AWG","4/0 AWG","250 MCM","300 MCM","350 MCM","400 MCM","500 MCM","600 MCM","700 MCM","750 MCM","800 MCM","900 MCM","1000 MCM","1250 MCM","1500 MCM","1750 MCM","2000 MCM"],
amax=[0,0,0,20,25,30,40,55,65,75,85,100,135,155,180,205,230,250,270,310,340,375,385,395,425,445,485,520,545,560],
cmax=[14,18,20,25,30,40,55,70,85,95,110,125,175,200,230,255,285,310,335,380,420,460,475,490,520,545,590,625,650,665];

function get(k,mx){
let cm=((k*2*A*D)/(V*vd))*P, r=size[0];
for(let i=0;i<size.length;i++){
if((cm>circ[i])||(A>mx[i])) r=size[i+1]||"Out of Range";
}
return r;
}

cu.value=get(11.2,cmax);
al.value=get(17.4,amax);

}
</script>

</body>
</html>
