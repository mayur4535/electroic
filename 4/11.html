<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
:root{--f:16px;--h:48px;--g:12px}

body{background:#f4f7fb;padding:20px}

.box{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.08)
}

.grid{display:grid;gap:var(--g)}

.label{
font-size:14px;
font-weight:bold;
margin-bottom:5px
}

.row{
display:flex;
gap:8px;
width:100%
}

.row input,.row select,.unit-box{
height:var(--h);
border:1px solid #ccc;
border-radius:8px;
padding:8px;
font-size:var(--f);
font-weight:bold;
display:flex;
align-items:center
}

.row input{flex:1;min-width:0}
.row select,.unit-box{width:90px}
.unit-box{justify-content:center;background:#fafafa}

button{
width:100%;
height:var(--h);
margin-top:var(--g);
background:#008000;
color:#fff;
border:0;
border-radius:10px;
font-size:var(--f);
font-weight:bold;
cursor:pointer
}

.result{
margin-top:var(--g);
display:grid;
gap:var(--g)
}

.formula{
margin-top:15px;
font-size:14px;
font-weight:bold;
color:#333
}

@media(max-width:600px){
body{padding:10px}
.box{padding:16px}
.row select,.unit-box{width:72px}
}
</style>
</head>

<body>

<div class="box">

<div class="grid">

<!-- Voltage -->
<div>
<div class="label">Source Voltage</div>
<div class="row">
<select id="vd">
<option value="3.6">120</option>
<option value="6.2">208</option>
<option value="6.6">220</option>
<option value="6.9">230</option>
<option value="7.2">240</option>
<option value="8.3">277</option>
<option value="13.2">440</option>
<option value="14.4">480</option>
</select>
<div class="unit-box">V</div>
</div>
</div>

<!-- Phase -->
<div>
<div class="label">Phase</div>
<div class="row">
<select id="phs">
<option value="2">Single</option>
<option value="1.732">Three</option>
</select>
<div class="unit-box">Ø</div>
</div>
</div>

<!-- Material -->
<div>
<div class="label">Material</div>
<div class="row">
<select id="mat">
<option value="12.9">Copper</option>
<option value="21.2">Aluminium</option>
</select>
<div class="unit-box">Type</div>
</div>
</div>

<!-- Current -->
<div>
<div class="label">Current</div>
<div class="row">
<input type="number" id="amps">
<div class="unit-box">A</div>
</div>
</div>

<!-- Distance -->
<div>
<div class="label">Distance</div>
<div class="row">
<input type="number" id="dist">
<div class="unit-box">ft</div>
</div>
</div>

</div>

<button id="btn">Calculate</button>

<!-- Output -->
<div class="result">
<div>
<div class="label">Wire Size</div>
<div class="row">
<input id="wire" readonly>
<div class="unit-box">AWG</div>
</div>
</div>
</div>

<div class="formula">
CM = (Phase × K × Distance × Current) / Voltage Drop
</div>

</div>

<script>

document.getElementById("btn").onclick=function(){

let vp=parseFloat(document.getElementById("vd").value),
phase=parseFloat(document.getElementById("phs").value),
k=parseFloat(document.getElementById("mat").value),
l=parseFloat(document.getElementById("dist").value),
i=parseFloat(document.getElementById("amps").value),
out=document.getElementById("wire");

// validation
if(isNaN(l)||isNaN(i)){
out.value="Enter values";return;
}

if(l<=0||i<=0){
out.value="Invalid";return;
}

// calculation
let Cm=(phase*k*l*i)/vp;

// tables (original logic)
let L=[2580,4110,6530,10380,16510,26240,41740,52620,66360,83690,105600,133100,167800,211600,250000,300000,350000,400000,500000,600000,700000,750000,800000,900000,1000000,1250000,1500000,1750000];

let H=[4110,6530,10380,16510,26240,41740,52620,66360,83690,105600,133100,167800,211600,250000,300000,350000,400000,500000,600000,700000,750000,800000,900000,1000000,1250000,1500000,1750000,2000000];

let S=["14","12","10","8","6","4","3","2","1","1/0","2/0","3/0","4/0","250 MCM","300 MCM","350 MCM","400 MCM","500 MCM","600 MCM","700 MCM","750 MCM","800 MCM","900 MCM","1000 MCM","1250 MCM","1500 MCM","1750 MCM","2000 MCM"];

// result logic
if(Cm<=L[0]){
out.value=S[0];
return;
}

for(let x=0;x<L.length;x++){
if(Cm>L[x] && Cm<=H[x]){
out.value=S[x];
return;
}
}

out.value="Out of Range";

};

</script>

</body>
</html>
