<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#f6f8fb;
  padding:0;
}

.calc{
  max-width:620px;
  margin:auto;
  padding:14px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

.unitBox{
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:800;
  color:#555;
}

input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

.resultTitle{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#7b8794;
  margin-top:22px;
  margin-bottom:12px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  padding:16px;
  border-radius:12px;
  min-height:82px;
}

.cardLabel{
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  margin-bottom:10px;
}

.cardValue{
  font-size:18px;
  font-weight:900;
  min-height:22px;
  word-break:break-word;
}

.blue{
  background:#eef5ff;
  border:1px solid #bfd3ff;
}

.blue .cardLabel,
.blue .cardValue{
  color:#2359e8;
}

.green{
  background:#edfdf3;
  border:1px solid #bff0d0;
}

.green .cardLabel,
.green .cardValue{
  color:#019863;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  .calc{padding:14px}
  .row{grid-template-columns:minmax(0,1fr) 72px}
  .resultGrid{grid-template-columns:1fr 1fr}
  .card{padding:14px}
  .cardValue{font-size:16px}
}
</style>
</head>

<body>

<div class="calc">

<label>Input Impedance</label>
<div class="row">
  <input id="zi" type="number" step="any">
  <div class="unitBox">Ω</div>
</div>

<label>Output Impedance</label>
<div class="row">
  <input id="zl" type="number" step="any">
  <div class="unitBox">Ω</div>
</div>

<button class="btn" onclick="calc()">CALCULATE</button>

<div id="errorBox">Please enter valid values.</div>

<div class="resultTitle">RESULTS</div>

<div class="resultGrid">

  <div class="card blue">
    <div class="cardLabel">NP TO NS</div>
    <div class="cardValue" id="npToNs"></div>
  </div>

  <div class="card green">
    <div class="cardLabel">NS TO NP</div>
    <div class="cardValue" id="nsToNp"></div>
  </div>

</div>

<div class="formula">
Original formula preserved:<br><br>
NS / NP = 1 / √(Input Impedance / Output Impedance)<br>
NP / NS = √(Input Impedance / Output Impedance)
</div>

</div>

<script>
function clearResults(){
  document.getElementById("npToNs").innerHTML = "";
  document.getElementById("nsToNp").innerHTML = "";
}

function calc(){
  var zi = Number(document.getElementById("zi").value);
  var zl = Number(document.getElementById("zl").value);

  if(
    document.getElementById("zi").value === "" ||
    document.getElementById("zl").value === "" ||
    isNaN(zi) ||
    isNaN(zl) ||
    zi <= 0 ||
    zl <= 0
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  /* ORIGINAL FORMULA */
  var c1 = zi / zl;
  var c2 = Math.pow(c1, 0.5);
  c2 = 1 / c2;

  var c3 = zl / zi;
  var c4 = Math.pow(c3, 0.5);
  c4 = 1 / c2;

  document.getElementById("npToNs").innerHTML = c4.toFixed(7);
  document.getElementById("nsToNp").innerHTML = c2.toFixed(7);
}

clearResults();
</script>

</body>
</html>
