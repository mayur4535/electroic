<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
margin:0;
background:#f6f8fb;
padding:0;
}

.calc{
max-width:620px;
margin:auto;
padding:14px;
}

label{
display:block;
font-size:15px;
font-weight:700;
color:#555;
margin-bottom:6px;
}

.row{
display:grid;
grid-template-columns:minmax(0,1fr) 82px;
gap:8px;
margin-bottom:16px;
}

input,select{
width:100%;
height:43px;
border:1px solid #cfd6df;
border-radius:8px;
padding:0 12px;
font-size:15px;
background:#fff;
outline:none;
}

select{
font-weight:800;
text-align:center;
}

input:focus,
select:focus{
border-color:#ff6a00;
box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
width:100%;
height:48px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#ff7a18,#ff4b00);
color:#fff;
font-size:16px;
font-weight:800;
cursor:pointer;
}

#errorBox{
display:none;
margin-top:12px;
color:#dc2626;
font-size:14px;
font-weight:800;
}

.resultTitle{
font-size:13px;
font-weight:800;
letter-spacing:1px;
color:#7b8794;
margin-top:22px;
margin-bottom:12px;
}

.resultGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
padding:16px;
border-radius:12px;
min-height:82px;
}

.cardLabel{
font-size:12px;
font-weight:900;
margin-bottom:10px;
}

.cardLine{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.cardValue{
font-size:18px;
font-weight:900;
min-height:22px;
}

.cardUnit{
font-size:18px;
font-weight:900;
}

.blue{
background:#eef5ff;
border:1px solid #bfd3ff;
}

.blue .cardLabel,
.blue .cardValue,
.blue .cardUnit{
color:#2359e8;
}

.green{
background:#edfdf3;
border:1px solid #bff0d0;
}

.green .cardLabel,
.green .cardValue,
.green .cardUnit{
color:#019863;
}

.formula{
margin-top:16px;
padding:14px;
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
font-size:13px;
line-height:1.6;
color:#667085;
font-weight:700;
}

@media(max-width:600px){

.row{
grid-template-columns:minmax(0,1fr) 72px;
}

.resultGrid{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>

<body>

<div class="calc">

<label>Frequency Oscillator</label>

<div class="row">

<input
id="frequency"
type="number">

<select
id="frequencyUnit">

<option value="khz">
kHz
</option>

<option value="mhz" selected>
MHz
</option>

<option value="ghz">
GHz
</option>

</select>

</div>


<label>Phase Noise Integrated</label>

<div class="row">

<input
id="phaseNoise"
type="number">

<select>

<option>
dBc
</option>

</select>

</div>


<button
class="btn"
onclick="calc()">

CALCULATE

</button>


<div id="errorBox">

Please enter valid values

</div>



<div class="resultTitle">

RESULTS

</div>


<div class="resultGrid">


<div class="card blue">

<div class="cardLabel">

RMS PHASE JITTER IN MICRO SECONDS

</div>

<div class="cardLine">

<span
class="cardValue"
id="jitterResult">
</span>

<span
class="cardUnit"
id="jitterUnit">
</span>

</div>

</div>


<div class="card green">

<div class="cardLabel">

RMS PHASE JITTER IN RADIANS

</div>

<div class="cardLine">

<span
class="cardValue"
id="phaseJitterResult">
</span>

<span
class="cardUnit"
id="phaseUnit">
</span>

</div>

</div>

</div>


<div class="formula">

Formula Used:<br><br>

RMS Phase Jitter (Rad)
=
√(2 × 10^(PN/10))

<br><br>

RMS Phase Jitter (uS)
=
PhaseJitter
÷
(2πf)
× 10⁶

</div>


</div>



<script>

function clearResults(){

jitterResult.innerHTML="";
phaseJitterResult.innerHTML="";
jitterUnit.innerHTML="";
phaseUnit.innerHTML="";

}

function getFrequencyForWebsite(v,u){

if(u==="khz")
return v/1000;

if(u==="mhz")
return v;

if(u==="ghz")
return v*1000000;

return v;

}

function calc(){

let freq=
Number(
frequency.value
);

let pn=
Number(
phaseNoise.value
);

if(
frequency.value===""||
phaseNoise.value===""||
isNaN(freq)||
isNaN(pn)||
freq<=0
){

errorBox.style.display=
"block";

clearResults();

return;

}

errorBox.style.display=
"none";


let f=
getFrequencyForWebsite(
freq,
frequencyUnit.value
);


let phaseJitter=

Math.sqrt(

2*

Math.pow(

10,

pn/10

)

);



let jitterUS=

(

phaseJitter

/

(

2*

Math.PI*

f

)

)

*

1000000;



phaseJitterResult.innerHTML=

phaseJitter.toFixed(7);

phaseUnit.innerHTML=

"Rad";



jitterResult.innerHTML=

jitterUS.toFixed(8);

jitterUnit.innerHTML=

"uS";

}

clearResults();

</script>

</body>
</html>
