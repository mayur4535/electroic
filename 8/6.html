<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:0}
.calc{max-width:620px;margin:auto;padding:14px}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input,select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

input:disabled,
select:disabled{
  background:#eef1f5;
  color:#999;
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.resultTitle{
  margin-top:26px;
  font-size:13px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:1px;
}

.bigResult{
  margin-top:12px;
  padding:18px;
  border-radius:12px;
  background:#eef5ff;
  border:1px solid #c8dbff;
  text-align:center;
}

.bigLabel{
  font-size:12px;
  font-weight:900;
  color:#2563eb;
  text-transform:uppercase;
}

.bigValue{
  margin-top:8px;
  font-size:30px;
  font-weight:900;
  color:#2563eb;
  min-height:38px;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  .calc{padding:14px}
  .row{grid-template-columns:minmax(0,1fr) 72px}
  .bigValue{font-size:24px}
}
</style>
</head>

<body>

<div class="calc">

<label>RCS (Radar Cross Section)</label>
<div class="row">
  <input id="rcs" type="number" step="any">
  <select id="rcsUnit">
    <option value="m2">m²</option>
    <option value="dbsm">dBsm</option>
  </select>
</div>

<label>Input Type</label>
<div class="row">
  <select id="inputType" onchange="toggleInputType()">
    <option value="wavelength">Wavelength</option>
    <option value="frequency">Frequency</option>
  </select>
  <div style="height:43px;border:1px solid #cfd6df;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">TYPE</div>
</div>

<label>Wavelength</label>
<div class="row">
  <input id="wavelength" type="number" step="any">
  <select id="waveUnit">
    <option value="angstrom">Angstron</option>
    <option value="nm">nm</option>
    <option value="um">µm</option>
    <option value="mm">mm</option>
    <option value="m">m</option>
  </select>
</div>

<label>Frequency</label>
<div class="row">
  <input id="frequency" type="number" step="any" disabled>
  <select id="freqUnit" disabled>
    <option value="hz">Hz</option>
    <option value="khz">kHz</option>
    <option value="mhz" selected>MHz</option>
    <option value="ghz">GHz</option>
  </select>
</div>

<button class="btn" onclick="calc()">CALCULATE</button>

<div id="errorBox">Please enter valid values.</div>

<div class="resultTitle">RESULTS</div>

<div class="bigResult">
  <div class="bigLabel">TGF (Gσ) Target Gain Factor</div>
  <div class="bigValue" id="tgfResult"></div>
</div>

<div class="formula">
MATCH ELITERF formula behavior:<br><br>
TGF = 10 × log10(4π × RCS / λ²)<br><br>
wavelength mapping used:<br>
Angstron × 10⁻⁶, nm × 10⁻⁵, µm × 10⁻², mm × 10¹, m × 10⁴
</div>

</div>

<script>
function clearResults(){
  document.getElementById("tgfResult").innerHTML = "";
}

function toggleInputType(){
  var type = document.getElementById("inputType").value;

  document.getElementById("wavelength").disabled = type !== "wavelength";
  document.getElementById("waveUnit").disabled = type !== "wavelength";

  document.getElementById("frequency").disabled = type !== "frequency";
  document.getElementById("freqUnit").disabled = type !== "frequency";

  document.getElementById("wavelength").value = "";
  document.getElementById("frequency").value = "";

  document.getElementById("errorBox").style.display = "none";
  clearResults();
}

function getRcsM2(value,unit){
  if(unit === "dbsm"){
    return Math.pow(10,value / 10);
  }
  return value;
}

function getWavelengthMeter_EliteRF(value,unit){
  if(unit === "angstrom") return value * 1e-6;
  if(unit === "nm")       return value * 1e-5;
  if(unit === "um")       return value * 1e-2;
  if(unit === "mm")       return value * 1e1;
  if(unit === "m")        return value * 1e4;
  return value;
}

function getFrequencyHz(value,unit){
  if(unit === "hz") return value;
  if(unit === "khz") return value * 1000;
  if(unit === "mhz") return value * 1000000;
  if(unit === "ghz") return value * 1000000000;
  return value;
}

function calc(){

  var rcsVal = Number(document.getElementById("rcs").value);
  var rcsUnit = document.getElementById("rcsUnit").value;
  var inputType = document.getElementById("inputType").value;

  if(
    document.getElementById("rcs").value === "" ||
    isNaN(rcsVal)
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  var RCS = getRcsM2(rcsVal,rcsUnit);
  var lambda;

  if(inputType === "wavelength"){

    var waveVal = Number(document.getElementById("wavelength").value);
    var waveUnit = document.getElementById("waveUnit").value;

    if(
      document.getElementById("wavelength").value === "" ||
      isNaN(waveVal)
    ){
      document.getElementById("errorBox").style.display = "block";
      clearResults();
      return;
    }

    lambda = getWavelengthMeter_EliteRF(waveVal,waveUnit);

  }else{

    var freqVal = Number(document.getElementById("frequency").value);
    var freqUnit = document.getElementById("freqUnit").value;

    if(
      document.getElementById("frequency").value === "" ||
      isNaN(freqVal)
    ){
      document.getElementById("errorBox").style.display = "block";
      clearResults();
      return;
    }

    lambda = 299792458 / getFrequencyHz(freqVal,freqUnit);
  }

  if(RCS <= 0 || lambda <= 0){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  var tgf = 10 * Math.log10((4 * Math.PI * RCS) / (lambda * lambda));

  document.getElementById("tgfResult").innerHTML = tgf.toFixed(6) + " dB";
}

toggleInputType();
</script>

</body>
</html>
