<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:0;
}

.calc{
  max-width:620px;
  margin:auto;
  padding:14px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

.valueBox,
input,
select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

.valueBox{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#374151;
}

select{
  text-align:center;
  font-weight:800;
  padding:0 6px;
}

input:focus,
select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

.resultTitle{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#7b8794;
  margin-top:22px;
  margin-bottom:12px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  padding:16px;
  border-radius:12px;
  min-height:82px;
}

.cardLabel{
  font-size:12px;
  font-weight:900;
  margin-bottom:10px;
}

.cardLine{
  display:flex;
  align-items:baseline;
  gap:6px;
  flex-wrap:wrap;
}

.cardValue,
.cardUnit{
  font-size:18px;
  font-weight:900;
}

.blue{
  background:#eef5ff;
  border:1px solid #bfd3ff;
}

.blue *{
  color:#2359e8;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  .row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  .resultGrid{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:14px;
  }

  .cardValue,
  .cardUnit{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="calc">

<label>Attenuation</label>
<div class="row">
  <input id="att" type="number" step="any">
  <div class="valueBox">dB</div>
</div>

<label>Impedance</label>
<div class="row">
  <input id="imp" type="number" step="any">
  <div class="valueBox">Ω</div>
</div>

<button class="btn" onclick="calc()">CALCULATE</button>

<div id="errorBox">Please enter valid values.</div>

<div class="resultTitle">RESULTS</div>

<div class="resultGrid">

  <div class="card blue">
    <div class="cardLabel">R1 RESISTOR</div>
    <div class="cardLine">
      <span class="cardValue" id="r1"></span>
      <span class="cardUnit" id="r1Unit"></span>
    </div>
  </div>

</div>

<div class="formula">
Formula:<br><br>
R1 = Impedance × (1 / (10<sup>Attenuation / 20</sup> − 1))
</div>

</div>

<script>
function clearResults(){
  document.getElementById("r1").innerHTML="";
  document.getElementById("r1Unit").innerHTML="";
}

function calc(){
  var att = Number(document.getElementById("att").value);
  var imp = Number(document.getElementById("imp").value);

  if(
    document.getElementById("att").value==="" ||
    document.getElementById("imp").value==="" ||
    isNaN(att) ||
    isNaN(imp)
  ){
    document.getElementById("errorBox").style.display="block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display="none";

  /* ORIGINAL FORMULA */
  var c1 = att / 20;
  c1 = Math.pow(10,c1) - 1;

  var r1 = imp * (1 / c1);

  document.getElementById("r1").innerHTML = r1.toFixed(4);
  document.getElementById("r1Unit").innerHTML = "Ω";
}

clearResults();
</script>

</body>
</html>
