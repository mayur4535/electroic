<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#f6f8fb;
  padding:0;
}

.calc{
  max-width:620px;
  margin:auto;
  padding:14px;
}

.section-title{
  margin:16px 0 12px;
  font-size:14px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:.5px;
  text-transform:uppercase;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 72px;
  gap:8px;
  margin-bottom:16px;
}

input{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.unit{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid #cfd6df;
  border-radius:8px;
  font-weight:700;
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

.error{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

.resultTitle{
  margin-top:26px;
  font-size:13px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:1px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.card{
  border-radius:10px;
  padding:16px;
  min-height:75px;
}

.card:nth-child(1){
  background:#eef5ff;
  border:1px solid #c8dbff;
}

.card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

.cardLabel{
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
}

.card:nth-child(1) .cardLabel,
.card:nth-child(1) .cardValue{
  color:#2563eb;
}

.card:nth-child(2) .cardLabel,
.card:nth-child(2) .cardValue{
  color:#059669;
}

.cardValue{
  margin-top:6px;
  font-size:20px;
  font-weight:800;
  min-height:24px;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  .resultGrid{
    grid-template-columns:1fr 1fr;
  }

  .cardValue{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="calc">

  <div class="section-title">Receiver Location</div>

  <label>Longitude (+ = E)</label>
  <div class="row">
    <input id="rx_lon" type="number" placeholder="Receiver longitude">
    <div class="unit">°</div>
  </div>

  <label>Latitude (+ = N)</label>
  <div class="row">
    <input id="rx_lat" type="number" placeholder="Receiver latitude">
    <div class="unit">°</div>
  </div>

  <div class="section-title">Satellite Location</div>

  <label>Satellite Longitude (+ = E)</label>
  <div class="row">
    <input id="sat_lon" type="number" placeholder="Satellite longitude">
    <div class="unit">°</div>
  </div>

  <button class="btn" onclick="cmd_calculate()">CALCULATE</button>

  <div id="errorBox" class="error">Please enter valid values.</div>

  <div class="resultTitle">RESULTS</div>

  <div class="resultGrid">
    <div class="card">
      <div class="cardLabel">Azimuth</div>
      <div class="cardValue"><span id="rx_az"></span></div>
    </div>

    <div class="card">
      <div class="cardLabel">Elevation</div>
      <div class="cardValue"><span id="rx_el"></span></div>
    </div>
  </div>

  <div class="formula">
    Original formula preserved:<br>
    Earth radius R0 = 6370 km<br>
    Satellite height h = 35800 km
  </div>

</div>

<script>
function cmd_calculate(){

  var rx_lon, rx_lat, sat_lon, rx_az, rx_el;
  var delta_lon, num, den;
  var R0 = 6370;
  var h = 35800;

  rx_lon = parseFloat(document.getElementById('rx_lon').value);

  if(isNaN(rx_lon) || (rx_lon < -180) || (rx_lon > 180)){
    document.getElementById('rx_lon').value = "";
    showError();
    return 1;
  }

  rx_lat = parseFloat(document.getElementById('rx_lat').value);

  if(isNaN(rx_lat) || (rx_lat < -90) || (rx_lat > 90)){
    document.getElementById('rx_lat').value = "";
    showError();
    return 1;
  }

  sat_lon = parseFloat(document.getElementById('sat_lon').value);

  if(isNaN(sat_lon) || (sat_lon < -180) || (sat_lon > 180)){
    document.getElementById('sat_lon').value = "";
    showError();
    return 1;
  }

  hideError();

  delta_lon = rx_lon - sat_lon;

  rx_az =
    Math.atan(
      Math.tan((Math.PI / 180) * delta_lon) /
      Math.sin((Math.PI / 180) * rx_lat)
    ) * (180 / Math.PI) + 180;

  num =
    Math.cos(rx_lat * (Math.PI / 180)) *
    Math.cos(delta_lon * (Math.PI / 180)) -
    R0 / (R0 + h);

  den =
    Math.sqrt(
      1 -
      Math.pow(
        Math.cos(rx_lat * (Math.PI / 180)) *
        Math.cos(delta_lon * (Math.PI / 180)),
        2
      )
    );

  rx_el = (180 / Math.PI) * Math.atan(num / den);

  document.getElementById('rx_az').innerText =
    rx_az.toPrecision(4) + "°";

  document.getElementById('rx_el').innerText =
    rx_el.toPrecision(3) + "°";

  return 0;
}

function showError(){
  document.getElementById("errorBox").style.display = "block";
  document.getElementById("rx_az").innerText = "";
  document.getElementById("rx_el").innerText = "";
}

function hideError(){
  document.getElementById("errorBox").style.display = "none";
}
</script>

</body>
</html>
