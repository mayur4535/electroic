<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:0;
}

.calc{
  max-width:620px;
  margin:auto;
  padding:14px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input,
select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

input:focus,
select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.resultTitle{
  margin-top:26px;
  font-size:13px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:1px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.card{
  border-radius:10px;
  padding:16px;
  min-height:76px;
}

.card:nth-child(1){
  background:#eef5ff;
  border:1px solid #c8dbff;
}

.cardLabel{
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  color:#2563eb;
}

.cardValue{
  margin-top:6px;
  font-size:18px;
  font-weight:800;
  min-height:24px;
  color:#2563eb;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  .row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  .resultGrid{
    grid-template-columns:1fr 1fr;
  }

  .cardValue{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="calc">

  <label>Bandwidth</label>
  <div class="row">
    <input id="bandwidth" type="number" step="any">
    <select id="bandwidthUnit">
      <option value="1">Hz</option>
      <option value="1000">kHz</option>
      <option value="1000000">MHz</option>
      <option value="1000000000">GHz</option>
    </select>
  </div>

  <label>Noise Figure</label>
  <div class="row">
    <input id="noiseFigure" type="number" step="any">
    <div style="
      height:43px;
      border:1px solid #cfd6df;
      border-radius:8px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
    ">dB</div>
  </div>

  <button class="btn" onclick="calc()">CALCULATE</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="resultTitle">RESULTS</div>

  <div class="resultGrid">

    <div class="card">
      <div class="cardLabel">MDS</div>
      <div class="cardValue" id="mdsResult"></div>
    </div>

  </div>

  <div class="formula">
    Original formula preserved:<br><br>
    MDS = -174 + 10 × log10(Bandwidth in Hz) + Noise Figure<br><br>
    -174 dBm/Hz is thermal noise floor at 290K with 1Hz bandwidth.
  </div>

</div>

<script>
function clearResults(){
  document.getElementById("mdsResult").innerHTML = "";
}

function calc(){

  var bandwidthValue = Number(document.getElementById("bandwidth").value);
  var bandwidthUnit = Number(document.getElementById("bandwidthUnit").value);
  var NF = Number(document.getElementById("noiseFigure").value);

  if(
    document.getElementById("bandwidth").value === "" ||
    document.getElementById("noiseFigure").value === "" ||
    isNaN(bandwidthValue) ||
    isNaN(NF) ||
    bandwidthValue <= 0
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  /* ORIGINAL FORMULA */
  var B = bandwidthValue * bandwidthUnit;
  var c1 = (-174 + (10 * Math.log10(B)) + NF);

  document.getElementById("mdsResult").innerHTML = c1.toFixed(4) + " dBm";
}
</script>

</body>
</html>
