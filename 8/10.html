<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#f6f8fb;
  padding:0;
}

.calc{
  max-width:620px;
  margin:auto;
  padding:14px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input,select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

input:focus,select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

.resultTitle{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#7b8794;
  margin-top:22px;
  margin-bottom:12px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  padding:16px;
  border-radius:12px;
  min-height:82px;
}

.cardLabel{
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  margin-bottom:10px;
}

.cardLine{
  display:flex;
  align-items:baseline;
  gap:6px;
  flex-wrap:wrap;
}

.cardValue{
  font-size:18px;
  font-weight:900;
  line-height:1;
  min-height:22px;
}

.cardUnit{
  font-size:18px;
  font-weight:900;
}

.blue{
  background:#eef5ff;
  border:1px solid #bfd3ff;
}

.blue .cardLabel,
.blue .cardValue,
.blue .cardUnit{
  color:#2359e8;
}

.green{
  background:#edfdf3;
  border:1px solid #bff0d0;
}

.green .cardLabel,
.green .cardValue,
.green .cardUnit{
  color:#019863;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  .calc{
    padding:14px;
  }

  .row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  .resultGrid{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:14px;
  }

  .cardValue,
  .cardUnit{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="calc">

<label>Effective Height of Transmitting Antenna</label>
<div class="row">
  <input id="ht" type="number" step="any">
  <select id="htUnit">
    <option value="1">m</option>
    <option value="0.01">cm</option>
    <option value="0.001">mm</option>
    <option value="0.3048">ft</option>
  </select>
</div>

<label>Effective Height of Receiving Antenna</label>
<div class="row">
  <input id="hr" type="number" step="any">
  <select id="hrUnit">
    <option value="1">m</option>
    <option value="0.01">cm</option>
    <option value="0.001">mm</option>
    <option value="0.3048">ft</option>
  </select>
</div>

<label>Antenna Current</label>
<div class="row">
  <input id="current" type="number" step="any">
  <select id="currentUnit">
    <option value="1">A</option>
    <option value="0.001">mA</option>
  </select>
</div>

<label>Distance from Transmitting Antenna</label>
<div class="row">
  <input id="distance" type="number" step="any">
  <select id="distanceUnit">
    <option value="1">m</option>
    <option value="1000">km</option>
    <option value="0.3048">ft</option>
  </select>
</div>

<label>Operating Frequency</label>
<div class="row">
  <input id="frequency" type="number" step="any">
  <select id="frequencyUnit">
    <option value="hz">Hz</option>
    <option value="khz" selected>kHz</option>
    <option value="mhz">MHz</option>
    <option value="ghz">GHz</option>
  </select>
</div>

<button class="btn" onclick="calc()">CALCULATE</button>

<div id="errorBox">Please enter valid values.</div>

<div class="resultTitle">RESULTS</div>

<div class="resultGrid">

  <div class="card blue">
    <div class="cardLabel">WAVELENGTH</div>
    <div class="cardLine">
      <span class="cardValue" id="waveResult"></span>
      <span class="cardUnit">m</span>
    </div>
  </div>

  <div class="card green">
    <div class="cardLabel">RF FIELD STRENGTH</div>
    <div class="cardLine">
      <span class="cardValue" id="fieldResult"></span>
      <span class="cardUnit">A/m</span>
    </div>
  </div>

</div>

<div class="formula">
Original formula preserved:<br><br>
λ = 3 × 10⁸ / f<br>
RF Field Strength = (120 × π × Ht × Hr × I) / (λ × d)
</div>

</div>

<script>
function clearResults(){
  document.getElementById("waveResult").innerHTML = "";
  document.getElementById("fieldResult").innerHTML = "";
}

function getFrequencyHz(value,unit){
  if(unit === "hz") return value;
  if(unit === "khz") return value * 1000;
  if(unit === "mhz") return value * 1000000;
  if(unit === "ghz") return value * 1000000000;
  return value;
}

function calc(){

  var htVal = Number(document.getElementById("ht").value);
  var hrVal = Number(document.getElementById("hr").value);
  var currentVal = Number(document.getElementById("current").value);
  var distanceVal = Number(document.getElementById("distance").value);
  var frequencyVal = Number(document.getElementById("frequency").value);

  if(
    document.getElementById("ht").value === "" ||
    document.getElementById("hr").value === "" ||
    document.getElementById("current").value === "" ||
    document.getElementById("distance").value === "" ||
    document.getElementById("frequency").value === "" ||
    isNaN(htVal) ||
    isNaN(hrVal) ||
    isNaN(currentVal) ||
    isNaN(distanceVal) ||
    isNaN(frequencyVal)
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  var ht = htVal * Number(document.getElementById("htUnit").value);
  var hr = hrVal * Number(document.getElementById("hrUnit").value);
  var current = currentVal * Number(document.getElementById("currentUnit").value);
  var d = distanceVal * Number(document.getElementById("distanceUnit").value);
  var f = getFrequencyHz(frequencyVal, document.getElementById("frequencyUnit").value);

  if(ht <= 0 || hr <= 0 || current <= 0 || d <= 0 || f <= 0){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  /* ORIGINAL FORMULA */
  var lambda = (3 * Math.pow(10,8)) / f;

  var field = (
    (120 * Math.PI * ht * hr * current) /
    (lambda * d)
  );

  document.getElementById("waveResult").innerHTML =
    lambda % 1 === 0 ? lambda.toFixed(0) : lambda.toFixed(7);

  document.getElementById("fieldResult").innerHTML =
    field.toFixed(7);
}

clearResults();
</script>

</body>
</html>
