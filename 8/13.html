<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:0}
.calc{max-width:620px;margin:auto;padding:14px}
label{display:block;font-size:15px;font-weight:700;color:#555;margin-bottom:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;margin-bottom:16px}
input,select{width:100%;height:43px;border:1px solid #cfd6df;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;outline:none}
select{text-align:center;font-weight:800;padding:0 6px}
input:focus,select:focus{border-color:#ff6a00;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.btn{width:100%;height:48px;border:none;border-radius:10px;background:linear-gradient(90deg,#ff7a18,#ff4b00);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
#errorBox{display:none;margin-top:12px;color:#dc2626;font-size:14px;font-weight:800}
.resultTitle{font-size:13px;font-weight:800;letter-spacing:1px;color:#7b8794;margin-top:22px;margin-bottom:12px}
.resultGrid{display:grid;grid-template-columns:1fr;gap:12px}
.card{padding:16px;border-radius:12px;min-height:82px}
.cardLabel{font-size:12px;font-weight:900;letter-spacing:.5px;margin-bottom:10px}
.cardLine{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cardValue{font-size:18px;font-weight:900;min-height:22px;word-break:break-word}
.cardUnit{font-size:18px;font-weight:900}
.blue{background:#eef5ff;border:1px solid #bfd3ff}
.blue .cardLabel,.blue .cardValue,.blue .cardUnit{color:#2359e8}
.formula{margin-top:16px;padding:14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;line-height:1.6;color:#667085;font-weight:700}
@media(max-width:600px){
.calc{padding:14px}
.row{grid-template-columns:minmax(0,1fr) 72px}
.cardValue,.cardUnit{font-size:16px}
}
</style>
</head>

<body>
<div class="calc">

<label>IIP3</label>
<div class="row">
  <input id="iip3" type="number" step="any">
  <select id="iip3Unit">
    <option value="dbm" selected>dBm</option>
    <option value="w">W</option>
  </select>
</div>

<label>MDS</label>
<div class="row">
  <input id="mds" type="number" step="any">
  <select>
    <option>dBm</option>
  </select>
</div>

<button class="btn" onclick="calc()">CALCULATE</button>

<div id="errorBox">Please enter valid values.</div>

<div class="resultTitle">RESULTS</div>

<div class="resultGrid">
  <div class="card blue">
    <div class="cardLabel">SPURIOUS FREE DYNAMIC RANGE</div>
    <div class="cardLine">
      <span class="cardValue" id="sfdrResult"></span>
      <span class="cardUnit" id="sfdrUnit"></span>
    </div>
  </div>
</div>

<div class="formula">
Formula Used:<br><br>
If IIP3 is in Watt:<br>
IIP3(dBm) = 10 × log10(W × 1000)<br><br>
SFDR = 2 / 3 × (IIP3(dBm) − MDS(dBm))
</div>

</div>

<script>
function clearResults(){
  document.getElementById("sfdrResult").innerHTML = "";
  document.getElementById("sfdrUnit").innerHTML = "";
}

function wattToDbm(w){
  return 10 * Math.log10(w * 1000);
}

function calc(){
  var iip3Val = Number(document.getElementById("iip3").value);
  var mds = Number(document.getElementById("mds").value);
  var unit = document.getElementById("iip3Unit").value;

  if(
    document.getElementById("iip3").value === "" ||
    document.getElementById("mds").value === "" ||
    isNaN(iip3Val) ||
    isNaN(mds) ||
    (unit === "w" && iip3Val <= 0)
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  var iip3Dbm = unit === "w" ? wattToDbm(iip3Val) : iip3Val;

  var sfdr = (2 / 3) * (iip3Dbm - mds);

  document.getElementById("sfdrResult").innerHTML = sfdr.toFixed(7);
  document.getElementById("sfdrUnit").innerHTML = "dB";
}

clearResults();
</script>

</body>
</html>
