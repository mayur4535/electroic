<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:0}
.calc{max-width:620px;margin:auto;padding:14px}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input,select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

input:focus,select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.resultTitle{
  margin-top:26px;
  font-size:13px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:1px;
}

.bigResult{
  margin-top:12px;
  padding:18px;
  border-radius:12px;
  background:#eef5ff;
  border:1px solid #c8dbff;
  text-align:center;
}

.bigLabel{
  font-size:12px;
  font-weight:900;
  color:#2563eb;
  text-transform:uppercase;
}

.bigValue{
  margin-top:8px;
  font-size:30px;
  font-weight:900;
  color:#2563eb;
  min-height:38px;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  .calc{padding:14px}
  .row{grid-template-columns:minmax(0,1fr) 72px}
  .bigValue{font-size:24px}
}
</style>
</head>

<body>

<div class="calc">

  <label>TOI (Third Order Intercept Point)</label>
  <div class="row">
    <input id="toi" type="number" step="any">
    <select id="toiUnit">
      <option value="dbm">dBm</option>
    </select>
  </div>

  <label>IPL (Input Power Level)</label>
  <div class="row">
    <input id="pin" type="number" step="any">
    <select id="pinUnit">
      <option value="dbm">dBm</option>
    </select>
  </div>

  <label>GTD (Gain of the DUT)</label>
  <div class="row">
    <input id="gain" type="number" step="any">
    <select id="gainUnit">
      <option value="db">dB</option>
    </select>
  </div>

  <button class="btn" onclick="calc()">CALCULATE</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="resultTitle">RESULTS</div>

  <div class="bigResult">
    <div class="bigLabel">AM to PM Conversion</div>
    <div class="bigValue" id="result"></div>
  </div>

  <div class="formula">
    Original formula preserved:<br><br>
    m = −((TOI − PIN − G) / 10)<br>
    Result = 13.2 × 10<sup>m</sup>
  </div>

</div>

<script>
function clearResults(){
  document.getElementById("result").innerHTML = "";
}

function calc(){

  var TOI = Number(document.getElementById("toi").value);
  var PIN = Number(document.getElementById("pin").value);
  var G = Number(document.getElementById("gain").value);

  if(
    document.getElementById("toi").value === "" ||
    document.getElementById("pin").value === "" ||
    document.getElementById("gain").value === "" ||
    isNaN(TOI) ||
    isNaN(PIN) ||
    isNaN(G)
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  /* ORIGINAL FORMULA */
  var m1 = (-((TOI - PIN - G) / 10));
  var c1 = (13.2 * (Math.pow(10, m1)));

  document.getElementById("result").innerHTML = c1.toFixed(6);
}
</script>

</body>
</html>
