<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coax Inductance Calculator | RF Transmission Designer</title>
<meta name="description" content="Calculate coaxial cable inductance using outer diameter, inner diameter, length, and relative permeability.">
<meta name="keywords" content="coax inductance calculator, coaxial cable transmission line solver, magnetic flux linkage equation, characteristic inductance formula, coax cable D d L dimensions, RF transmission line analysis">
<style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}
    body{margin:0;background:#f6f8fb;padding:0;color:#333}
    .calc{max-width:620px;margin:auto;padding:14px;padding-top:24px}
    label{display:block;font-size:15px;font-weight:700;color:#555;margin-bottom:6px}
    .row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;margin-bottom:16px}
    .valueBox,input{width:100%;height:43px;border:1px solid #cfd6df;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;outline:none}
    .valueBox{display:flex;align-items:center;justify-content:center;font-weight:800;color:#374151;background:#eee}
    input:focus{border-color:#ff6a00;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
    .btn{width:100%;height:48px;border:none;border-radius:10px;background:linear-gradient(90deg,#ff7a18,#ff4b00);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
    #errorBox{display:none;margin-top:14px;margin-bottom:6px;color:#dc2626;font-size:14px;font-weight:800}
    .resultTitle{font-size:13px;font-weight:800;letter-spacing:1px;color:#7b8794;margin-top:22px;margin-bottom:12px}
    .resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{padding:16px;border-radius:12px;min-height:82px;border:1px solid #cfd6df}
    .cardLabel{font-size:11px;font-weight:900;margin-bottom:10px;letter-spacing:0.5px;text-transform:uppercase}
    .cardValue{font-size:18px;font-weight:900;line-height:1}
    .blue{background:#eef5ff;border-color:#bfd3ff} .blue *{color:#2359e8}
    .green{background:#ecfdf5;border-color:#bbf7d0} .green *{color:#16a34a}
    .infoBox{margin-top:16px;padding:16px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
    .infoBox h2{margin:0 0 12px;font-size:15px;color:#1e293b;border-bottom:1px solid #edf2f7;padding-bottom:6px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
    .formulaLine{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin:8px 0;font-size:13px;color:#334155;font-weight:700;overflow-x:auto}
    .paramGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
    .paramItem{background:#f8fafc;padding:10px;border-radius:8px;border:1px solid #e2e8f0;font-size:12px;font-weight:600;color:#475467}
    .exampleGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
    .exampleCard{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px;font-size:13px}
    .diagramBox{text-align:center;margin-top:10px}
</style>
</head>
<body>
<main class="calc">
  <form id="tool" onsubmit="event.preventDefault();">
    <label for="out_diameter">D / Outer Diameter</label>
    <div class="row">
      <input id="out_diameter" type="number" step="any" placeholder="Enter D">
      <div class="valueBox">mm</div>
    </div>
    <label for="in_diameter">d / Inner Diameter</label>
    <div class="row">
      <input id="in_diameter" type="number" step="any" placeholder="Enter d">
      <div class="valueBox">mm</div>
    </div>
    <label for="length">L / Length</label>
    <div class="row">
      <input id="length" type="number" step="any" placeholder="Enter L">
      <div class="valueBox">mm</div>
    </div>
    <label for="rel_perm">Relative Permeability (μr)</label>
    <div class="row"><input id="rel_perm" type="number" step="any" value="1"><div class="valueBox">μr</div></div>
    <button class="btn" type="button" onclick="calc()">CALCULATE</button>
  </form>

  <div id="errorBox">Please enter valid positive values.</div>

  <div class="resultTitle">RESULTS</div>
  <div class="resultGrid">
    <div class="card blue"><div class="cardLabel">Inductance (H)</div><b class="cardValue" id="inductanceH">-</b></div>
    <div class="card green"><div class="cardLabel">Inductance (nH)</div><b class="cardValue" id="inductanceNH">-</b></div>
  </div>

  <div class="diagramScroll">
 <h2>Diagrams & Theory</h2>
    <p></p>
      <svg viewBox="0 0 900 430" aria-label="Coax inductance D d L dimension diagram">

        <rect x="10" y="10" width="880" height="410" rx="18" fill="#fff"/>

        <rect x="170" y="125" width="520" height="120" rx="60"
              fill="#e5e7eb" stroke="#111827" stroke-width="4"/>

        <ellipse cx="170" cy="185" rx="50" ry="60"
                 fill="#d1d5db" stroke="#111827" stroke-width="4"/>

        <ellipse cx="690" cy="185" rx="50" ry="60"
                 fill="#e5e7eb" stroke="#111827" stroke-width="4"/>

        <rect x="170" y="150" width="520" height="70" rx="35"
              fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>

        <ellipse cx="170" cy="185" rx="30" ry="35"
                 fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>

        <ellipse cx="690" cy="185" rx="30" ry="35"
                 fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>

        <rect x="170" y="174" width="520" height="22" rx="11"
              fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

        <ellipse cx="170" cy="185" rx="12" ry="12"
                 fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

        <ellipse cx="690" cy="185" rx="12" ry="12"
                 fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

        <!-- D = Outer Diameter -->
        <line x1="80" y1="125" x2="80" y2="245"
              stroke="#111827" stroke-width="3"/>

        <path d="M80 125 L70 140 L90 140 Z" fill="#111827"/>
        <path d="M80 245 L70 230 L90 230 Z" fill="#111827"/>

        <line x1="100" y1="125" x2="170" y2="125"
              stroke="#111827" stroke-width="2"/>

        <line x1="100" y1="245" x2="170" y2="245"
              stroke="#111827" stroke-width="2"/>

        <text x="55" y="190"
              font-size="28"
              font-weight="700"
              fill="#111827"
              transform="rotate(-90 55 190)">D</text>

        <text x="22" y="190"
              font-size="16"
              fill="#111827"
              transform="rotate(-90 22 190)">Outer Diameter</text>

        <!-- d = Inner Diameter -->
        <line x1="240" y1="174" x2="240" y2="196"
              stroke="#ef4444" stroke-width="3"/>

        <path d="M240 174 L232 184 L248 184 Z" fill="#ef4444"/>
        <path d="M240 196 L232 186 L248 186 Z" fill="#ef4444"/>

        <line x1="205" y1="174" x2="240" y2="174"
              stroke="#ef4444" stroke-width="2"/>

        <line x1="205" y1="196" x2="240" y2="196"
              stroke="#ef4444" stroke-width="2"/>

        <line x1="360" y1="110" x2="250" y2="183"
              stroke="#ef4444" stroke-width="3"/>

        <path d="M250 183 L264 177 L258 192 Z" fill="#ef4444"/>

        <text x="370" y="104"
              font-size="18"
              font-weight="700"
              fill="#ef4444">d = Inner Diameter</text>

        <!-- L = Length -->
        <line x1="170" y1="320" x2="690" y2="320"
              stroke="#111827" stroke-width="3"/>

        <path d="M170 320 L185 310 L185 330 Z" fill="#111827"/>
        <path d="M690 320 L675 310 L675 330 Z" fill="#111827"/>

        <line x1="170" y1="255" x2="170" y2="335"
              stroke="#111827" stroke-width="2"/>

        <line x1="690" y1="255" x2="690" y2="335"
              stroke="#111827" stroke-width="2"/>

        <text x="430" y="305"
              text-anchor="middle"
              font-size="28"
              font-weight="700"
              fill="#111827">L</text>

        <text x="430" y="338"
              text-anchor="middle"
              font-size="16"
              fill="#111827">Length</text>

        <text x="430" y="58"
              text-anchor="middle"
              font-size="24"
              font-weight="700"
              fill="#111827">Coax Inductance Dimensions</text>

        <rect x="515" y="60" width="280" height="46" rx="10"
              fill="#f8fafc" stroke="#d1d5db"/>

        <text x="655" y="90"
              text-anchor="middle"
              font-size="18"
              font-weight="700"
              fill="#2563eb">L = μ0 μr l / 2π × ln(D/d)</text>

      </svg>
    </div>

  <section class="infoBox">
    <h2>5. Formulas & Mathematical Logic</h2>
    <div class="formulaLine">L = (μ0 × μr / 2π) × ln(D / d) × Length</div>
  </section>
</main>

<script>
function calc(){
  var Dval=Number(document.getElementById("out_diameter").value)/1000, dval=Number(document.getElementById("in_diameter").value)/1000, Lval=Number(document.getElementById("length").value)/1000, ur=Number(document.getElementById("rel_perm").value);
  var e=document.getElementById("errorBox");
  if(Dval<=dval || Dval<=0 || dval<=0 || Lval<=0 || ur<=0){ e.style.display="block"; e.innerHTML="Invalid values: D must be > d."; return; }
  e.style.display="none";
  var ind=(4 * Math.PI * 1e-7 * ur / (2 * Math.PI)) * Math.log(Dval/dval) * Lval;
  document.getElementById("inductanceH").innerText=ind.toExponential(2)+" H";
  document.getElementById("inductanceNH").innerText=(ind*1e9).toFixed(2)+" nH";
}
</script>
</body>
</html>
