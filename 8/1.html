<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#f6f8fb;
  padding:0;
}

.calc{
  max-width:620px;
  margin:auto;
  padding:14px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.unit{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid #cfd6df;
  border-radius:8px;
  font-weight:700;
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

.resultTitle{
  margin-top:26px;
  font-size:13px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:1px;
}

.result{
  margin-top:12px;
}

.card{
  background:#eef5ff;
  border-radius:10px;
  padding:16px;
  border:1px solid #c8dbff;
}

.cardLabel{
  font-size:12px;
  font-weight:800;
  color:#2563eb;
  text-transform:uppercase;
}

.cardValue{
  margin-top:6px;
  font-size:20px;
  font-weight:800;
  color:#2563eb;
  word-break:break-word;
  min-height:24px;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  .row{
    grid-template-columns:minmax(0,1fr) 72px;
  }
}
</style>
</head>

<body>

<div class="calc">

  <label>Peak Power</label>
  <div class="row">
    <input id="number1" type="number">
    <div class="unit">dBm</div>
  </div>

  <label>Ave. PWR (Average Power)</label>
  <div class="row">
    <input id="number2" type="number">
    <div class="unit">dBm</div>
  </div>

  <label>Input Power</label>
  <div class="row">
    <input id="number3" type="number">
    <div class="unit">dBm</div>
  </div>

  <label>Third Order Intercept Point (IP3)</label>
  <div class="row">
    <input id="number4" type="number">
    <div class="unit">dBm</div>
  </div>

  <button class="btn" onclick="calc()">CALCULATE</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="resultTitle">RESULT</div>

  <div class="result">
    <div class="card">
      <div class="cardLabel">ACPR</div>
      <div class="cardValue" id="acprValue"></div>
    </div>
  </div>

  <div class="formula">
    Original formula preserved:<br><br>
    Crestfactor = Pmax / Pavg<br>
    ACPR = -20.75 + (1.6 × Crestfactor) + (2 × (Pin − IP3))
  </div>

</div>

<script>
function calc(){

  var Pmax = Number(document.getElementById("number1").value);
  var Pavg = Number(document.getElementById("number2").value);
  var Pin  = Number(document.getElementById("number3").value);
  var IP3  = Number(document.getElementById("number4").value);

  var errorBox = document.getElementById("errorBox");
  var resultValue = document.getElementById("acprValue");

  if(
    isNaN(Pmax) || isNaN(Pavg) || isNaN(Pin) || isNaN(IP3) ||
    Pavg === 0 ||
    document.getElementById("number1").value === "" ||
    document.getElementById("number2").value === "" ||
    document.getElementById("number3").value === "" ||
    document.getElementById("number4").value === ""
  ){
    errorBox.style.display = "block";
    resultValue.innerHTML = "";
    return;
  }

  errorBox.style.display = "none";

  /* ORIGINAL FORMULA PRESERVED */
  var Crestfactor = Pmax / Pavg;

  var c1 =
    -20.75 +
    (1.6 * Crestfactor) +
    (2 * (Pin - IP3));

  resultValue.innerHTML = c1.toFixed(4);
}
</script>

</body>
</html>
