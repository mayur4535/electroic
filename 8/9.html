<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:0}
.calc{max-width:620px;margin:auto;padding:14px}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  margin-bottom:16px;
}

input,select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

input:focus,select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff7a18,#ff4b00);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
}

.resultTitle{
  margin-top:26px;
  font-size:13px;
  font-weight:800;
  color:#8b95a7;
  letter-spacing:1px;
}

.resultGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.card{
  border-radius:10px;
  padding:16px;
  min-height:76px;
}

.card:nth-child(1){
  background:#eef5ff;
  border:1px solid #c8dbff;
}

.card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

.cardLabel{
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
}

.card:nth-child(1) .cardLabel,
.card:nth-child(1) .cardValue{
  color:#2563eb;
}

.card:nth-child(2) .cardLabel,
.card:nth-child(2) .cardValue{
  color:#059669;
}

.cardValue{
  margin-top:6px;
  font-size:18px;
  font-weight:800;
  min-height:24px;
  word-break:break-word;
}

.formula{
  margin-top:16px;
  padding:14px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  .calc{padding:14px}
  .row{grid-template-columns:minmax(0,1fr) 72px}
  .resultGrid{grid-template-columns:1fr 1fr}
  .cardValue{font-size:14px}
}
</style>
</head>

<body>

<div class="calc">

  <label>Electric Field RMS</label>
  <div class="row">
    <input id="electricField" type="number" step="any">
    <select id="electricUnit">
      <option value="1">V/m</option>
      <option value="0.001">mV/m</option>
      <option value="1000">kV/m</option>
    </select>
  </div>

  <label>Material Conductivity</label>
  <div class="row">
    <input id="conductivity" type="number" step="any">
    <select id="conductivityUnit">
      <option value="1">S/m</option>
      <option value="0.001">mS/m</option>
    </select>
  </div>

  <label>Mass Density</label>
  <div class="row">
    <input id="massDensity" type="number" step="any">
    <select id="densityUnit">
      <option value="1">kg/m³</option>
      <option value="1000">g/cm³</option>
    </select>
  </div>

  <button class="btn" onclick="calc()">CALCULATE</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="resultTitle">RESULTS</div>

  <div class="resultGrid">

    <div class="card">
      <div class="cardLabel">SAR</div>
      <div class="cardValue" id="sarResult"></div>
    </div>

    <div class="card">
      <div class="cardLabel">IPD</div>
      <div class="cardValue" id="ipdResult"></div>
    </div>

  </div>

  <div class="formula">
    Original formula preserved:<br><br>
    SAR = σ × E² / ρ<br>
    IPD = E² / 377<br><br>
    E = Electric field RMS, σ = Conductivity, ρ = Mass density
  </div>

</div>

<script>
function clearResults(){
  document.getElementById("sarResult").innerHTML = "";
  document.getElementById("ipdResult").innerHTML = "";
}

function calc(){

  var E = Number(document.getElementById("electricField").value) * Number(document.getElementById("electricUnit").value);
  var sigma = Number(document.getElementById("conductivity").value) * Number(document.getElementById("conductivityUnit").value);
  var md = Number(document.getElementById("massDensity").value) * Number(document.getElementById("densityUnit").value);

  if(
    document.getElementById("electricField").value === "" ||
    document.getElementById("conductivity").value === "" ||
    document.getElementById("massDensity").value === "" ||
    isNaN(E) || isNaN(sigma) || isNaN(md) ||
    md === 0
  ){
    document.getElementById("errorBox").style.display = "block";
    clearResults();
    return;
  }

  document.getElementById("errorBox").style.display = "none";

  /* ORIGINAL FORMULA */
  var c1 = ((sigma * (Math.pow(E,2))) / md);
  var c2 = ((Math.pow(E,2)) / 377);

  document.getElementById("sarResult").innerHTML = c1.toFixed(6) + " W/kg";
  document.getElementById("ipdResult").innerHTML = c2.toFixed(6) + " W/m²";
}
</script>

</body>
</html>
