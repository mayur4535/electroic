<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f6f8fb;
padding:0;
}

.calc{
max-width:620px;
margin:auto;
padding:14px;
}

label{
display:block;
font-size:15px;
font-weight:700;
color:#555;
margin-bottom:6px;
}

.row{
display:grid;
grid-template-columns:minmax(0,1fr) 82px;
gap:8px;
margin-bottom:16px;
}

input,select{
width:100%;
height:43px;
border:1px solid #cfd6df;
border-radius:8px;
padding:0 12px;
font-size:15px;
background:#fff;
outline:none;
}

select{
text-align:center;
font-weight:800;
}

input:focus,
select:focus{
border-color:#ff6a00;
box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

.btn{
width:100%;
height:48px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#ff7a18,#ff4b00);
color:#fff;
font-size:16px;
font-weight:800;
cursor:pointer;
margin-top:8px;
}

#errorBox{
display:none;
margin-top:12px;
color:#dc2626;
font-size:14px;
font-weight:800;
}

.resultTitle{
font-size:13px;
font-weight:800;
letter-spacing:1px;
color:#7b8794;
margin-top:22px;
margin-bottom:12px;
}

.resultGrid{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

.card{
padding:16px;
border-radius:12px;
min-height:82px;
}

.cardLabel{
font-size:12px;
font-weight:900;
letter-spacing:.5px;
margin-bottom:10px;
}

.cardLine{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.cardValue{
font-size:18px;
font-weight:900;
min-height:22px;
word-break:break-word;
}

.cardUnit{
font-size:18px;
font-weight:900;
}

.blue{
background:#eef5ff;
border:1px solid #bfd3ff;
}

.blue .cardLabel,
.blue .cardValue,
.blue .cardUnit{
color:#2359e8;
}

.formula{
margin-top:16px;
padding:14px;
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
font-size:13px;
line-height:1.6;
color:#667085;
font-weight:700;
}

@media(max-width:600px){

.row{
grid-template-columns:minmax(0,1fr) 72px;
}

.cardValue,
.cardUnit{
font-size:16px;
}

}

</style>

</head>

<body>

<div class="calc">

<label>
U (Velocity Factor of Transmission Line)
</label>

<div class="row">

<input
id="velocityFactor"
type="number"
step="any">

<select>
<option>U</option>
</select>

</div>



<label>
Td (Round Trip Time)
</label>

<div class="row">

<input
id="roundTripTime"
type="number"
step="any">

<select>
<option>Td</option>
</select>

</div>



<button
class="btn"
onclick="calc()">

CALCULATE

</button>



<div id="errorBox">

Please enter valid values.

</div>



<div class="resultTitle">

RESULTS

</div>



<div class="resultGrid">

<div class="card blue">

<div class="cardLabel">

TDR LENGTH

</div>

<div class="cardLine">

<span
class="cardValue"
id="tdrLengthResult">
</span>

<span
class="cardUnit"
id="tdrLengthUnit">
</span>

</div>

</div>

</div>



<div class="formula">

Website matched formula:<br><br>

TDR Length =

(3 × 10⁸ × U × Td ÷ 2)

<br><br>

Result stored as signed 32-bit integer
(to match website)

</div>

</div>



<script>

function clearResults(){

tdrLengthResult.innerHTML="";

tdrLengthUnit.innerHTML="";

}



function calc(){

let U=

Number(
velocityFactor.value
);

let Td=

Number(
roundTripTime.value
);


if(

velocityFactor.value===""

||

roundTripTime.value===""

||

isNaN(U)

||

isNaN(Td)

){

errorBox.style.display=
"block";

clearResults();

return;

}


errorBox.style.display=
"none";


/* WEBSITE MATCH */

let raw =

(
3
*
Math.pow(
10,
8
)
*
U
*
Td
)

/

2;


/* OVERFLOW MATCH */

let length = raw | 0;



tdrLengthResult.innerHTML=

length;



tdrLengthUnit.innerHTML=

"m";

}

clearResults();

</script>

</body>
</html>
