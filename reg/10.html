<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#star-delta-calc,*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:10px}
#star-delta-calc{max-width:620px;margin:auto;padding-top:14px}
.calc-grid{display:grid;gap:15px}
.calc-label{display:block;font-size:15px;font-weight:700;color:#4b5563;margin-bottom:7px}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:center}
input,select{width:100%;height:43px;border:1px solid #cfd6df;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;outline:none}
select{text-align:center;font-weight:700;padding:0 6px}
input:focus,select:focus{border-color:#ff6a00;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.unit-box{height:43px;border:1px solid #cfd6df;border-radius:8px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#111827}
.section{display:none}
.section.active{display:block}
button{width:100%;height:45px;margin-top:24px;border:0;border-radius:9px;background:linear-gradient(90deg,#ff7a18,#ff3d00);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.result-title{margin-top:30px;margin-bottom:14px;font-size:14px;font-weight:800;color:#a7afbd;letter-spacing:.5px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result-card{min-height:64px;padding:14px;border-radius:9px}
.result-card:nth-child(1){background:#eef5ff;border:1px solid #bcd7ff}
.result-card:nth-child(2){background:#ecfdf5;border:1px solid #bbf7d0}
.result-card:nth-child(3){background:#f5f3ff;border:1px solid #ddd6fe}
.result-card:nth-child(1) .result-label,.result-card:nth-child(1) .result-value{color:#2563eb}
.result-card:nth-child(2) .result-label,.result-card:nth-child(2) .result-value{color:#059669}
.result-card:nth-child(3) .result-label,.result-card:nth-child(3) .result-value{color:#7c3aed}
.result-label{font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:7px}
.result-value{font-size:16px;font-weight:900;word-break:break-word;min-height:18px}
.formula{margin-top:18px;padding:14px;border-radius:9px;background:#f9fafb;border:1px solid #e5e7eb;font-size:14px;line-height:1.6;color:#667085;font-weight:700}
#errorBox{display:none;margin-top:12px;color:#dc2626;font-size:14px;font-weight:800}
@media(max-width:600px){
body{padding:0}
.calc-row{grid-template-columns:minmax(0,1fr) 72px}
.result-grid{grid-template-columns:1fr 1fr}
.result-value{font-size:14px}
}
</style>
</head>

<body>

<div id="star-delta-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Conversion Type</label>
      <div class="calc-row">
        <select id="modeSelect" onchange="changeMode()">
          <option value="starToDelta">Star to Delta</option>
          <option value="deltaToStar">Delta to Star</option>
        </select>
        <div class="unit-box">TYPE</div>
      </div>
    </div>

    <div id="starToDelta" class="section active">
      <div class="calc-grid">
        <div>
          <label class="calc-label">R1</label>
          <div class="calc-row">
            <input id="yR4" type="number" placeholder="Enter R1">
            <div class="unit-box">Ω</div>
          </div>
        </div>

        <div>
          <label class="calc-label">R2</label>
          <div class="calc-row">
            <input id="yR5" type="number" placeholder="Enter R2">
            <div class="unit-box">Ω</div>
          </div>
        </div>

        <div>
          <label class="calc-label">R3</label>
          <div class="calc-row">
            <input id="yR6" type="number" placeholder="Enter R3">
            <div class="unit-box">Ω</div>
          </div>
        </div>
      </div>

      <button onclick="r123()">Calculate</button>

      <div class="result-title">RESULTS</div>
      <div class="result-grid">
        <div class="result-card">
          <div class="result-label">Ra</div>
          <div class="result-value"><span id="yR1"></span> Ω</div>
        </div>
        <div class="result-card">
          <div class="result-label">Rb</div>
          <div class="result-value"><span id="yR2"></span> Ω</div>
        </div>
        <div class="result-card">
          <div class="result-label">Rc</div>
          <div class="result-value"><span id="yR3"></span> Ω</div>
        </div>
      </div>

      <div class="formula">
        Original formula:<br>
        sum = R1×R2 + R2×R3 + R3×R1<br>
        Ra = sum / R1, Rb = sum / R2, Rc = sum / R3
      </div>
    </div>

    <div id="deltaToStar" class="section">
      <div class="calc-grid">
        <div>
          <label class="calc-label">Ra</label>
          <div class="calc-row">
            <input id="dR1" type="number" placeholder="Enter Ra">
            <div class="unit-box">Ω</div>
          </div>
        </div>

        <div>
          <label class="calc-label">Rb</label>
          <div class="calc-row">
            <input id="dR2" type="number" placeholder="Enter Rb">
            <div class="unit-box">Ω</div>
          </div>
        </div>

        <div>
          <label class="calc-label">Rc</label>
          <div class="calc-row">
            <input id="dR3" type="number" placeholder="Enter Rc">
            <div class="unit-box">Ω</div>
          </div>
        </div>
      </div>

      <button onclick="r456()">Calculate</button>

      <div class="result-title">RESULTS</div>
      <div class="result-grid">
        <div class="result-card">
          <div class="result-label">R1</div>
          <div class="result-value"><span id="dR4"></span> Ω</div>
        </div>
        <div class="result-card">
          <div class="result-label">R2</div>
          <div class="result-value"><span id="dR5"></span> Ω</div>
        </div>
        <div class="result-card">
          <div class="result-label">R3</div>
          <div class="result-value"><span id="dR6"></span> Ω</div>
        </div>
      </div>

      <div class="formula">
        Original formula:<br>
        sum = Ra + Rb + Rc<br>
        R1 = Rb×Rc / sum, R2 = Ra×Rc / sum, R3 = Ra×Rb / sum
      </div>
    </div>

  </div>

  <div id="errorBox">Please enter valid values.</div>

</div>

<script>
function num(id){
  return Number(document.getElementById(id).value);
}

function out(id,val){
  document.getElementById(id).innerText = Number(val).toPrecision(6);
}

function showError(){
  document.getElementById("errorBox").style.display = "block";
}

function hideError(){
  document.getElementById("errorBox").style.display = "none";
}

function clearResults(){
  ["yR1","yR2","yR3","dR4","dR5","dR6"].forEach(id=>{
    document.getElementById(id).innerText = "";
  });
}

function changeMode(){
  document.getElementById("starToDelta").classList.remove("active");
  document.getElementById("deltaToStar").classList.remove("active");
  document.getElementById(document.getElementById("modeSelect").value).classList.add("active");
  clearResults();
  hideError();
}

/* ORIGINAL DELTA TO STAR FORMULA */
function r456(){
  var a = num("dR1");
  var b = num("dR2");
  var c = num("dR3");

  if(a <= 0 || b <= 0 || c <= 0){
    showError();
    clearResults();
    return;
  }

  hideError();

  var dsum = ((1 * a) + (1 * b) + (1 * c));

  var calcr4 = (b * c) / dsum;
  var calcr5 = (a * c) / dsum;
  var calcr6 = (a * b) / dsum;

  out("dR4", calcr4);
  out("dR5", calcr5);
  out("dR6", calcr6);
}

/* ORIGINAL STAR TO DELTA FORMULA */
function r123(){
  var j = num("yR4");
  var k = num("yR5");
  var l = num("yR6");

  if(j <= 0 || k <= 0 || l <= 0){
    showError();
    clearResults();
    return;
  }

  hideError();

  var ysum = ((j * k) + (k * l) + (l * j));

  var calcr1 = ysum / j;
  var calcr2 = ysum / k;
  var calcr3 = ysum / l;

  out("yR1", calcr1);
  out("yR2", calcr2);
  out("yR3", calcr3);
}
</script>

</body>
</html>
