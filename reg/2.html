<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#capacitor-sp-calc,
#capacitor-sp-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#capacitor-sp-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#capacitor-sp-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#capacitor-sp-calc .calc-grid{
  display:grid;
  gap:15px;
}

#capacitor-sp-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#capacitor-sp-calc input,
#capacitor-sp-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#capacitor-sp-calc select{
  text-align:center;
  font-weight:700;
}

#capacitor-sp-calc input:focus,
#capacitor-sp-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#capacitor-sp-calc .unit-box,
#capacitor-sp-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#capacitor-sp-calc .unit-box{
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
}

#capacitor-sp-calc .btn-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

#capacitor-sp-calc button{
  width:100%;
  height:45px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#capacitor-sp-calc button.secondary{
  background:#fff;
  color:#ea580c;
  border:1px solid #fed7aa;
}

#capacitor-sp-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
}

#capacitor-sp-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#capacitor-sp-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#capacitor-sp-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#capacitor-sp-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#capacitor-sp-calc .result-card:nth-child(1) .result-label,
#capacitor-sp-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#capacitor-sp-calc .result-card:nth-child(2) .result-label,
#capacitor-sp-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#capacitor-sp-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#capacitor-sp-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#capacitor-sp-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #capacitor-sp-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #capacitor-sp-calc .unit-box,
  #capacitor-sp-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #capacitor-sp-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #capacitor-sp-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="capacitor-sp-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Connection Type</label>

      <div class="calc-row">

        <select id="calcMode" onchange="calculateCapacitors()">
          <option value="parallel">Parallel</option>
          <option value="series">Series</option>
        </select>

        <div class="unit-box">TYPE</div>

      </div>
    </div>

    <div id="capacitorInputs"></div>

  </div>

  <div class="btn-row">

    <button type="button" onclick="addCapacitor()">
      + Capacitor
    </button>

    <button type="button" class="secondary" onclick="removeCapacitor()">
      - Capacitor
    </button>

  </div>

  <div id="errorBox">
    Please enter capacitor values.
  </div>

  <div class="result-title">
    RESULTS
  </div>

  <div class="result-grid">

    <div class="result-card">

      <div class="result-label">
        Total Capacitance
      </div>

      <div class="result-value">
        <span id="resultValue">-</span>
      </div>

    </div>

    <div class="result-card">

      <div class="result-label">
        Result Format
      </div>

      <div class="result-value">

        <select id="outputUnit" onchange="calculateCapacitors()">

          <option value="1e-12">pF</option>
          <option value="1e-9">nF</option>
          <option value="1e-6" selected>µF</option>
          <option value="1e-3">mF</option>

        </select>

      </div>

    </div>

  </div>

  <div class="formula" id="formulaText">
    Parallel: Ctotal = C1 + C2 + C3 + ...
  </div>

</div>

<script>

let capacitorCount = 3;

function capacitorRow(index){

  return `
    <div id="capacitorRow${index}" style="margin-bottom:15px;">

      <label class="calc-label">C${index}</label>

      <div class="calc-row">

        <input
          type="number"
          id="cap${index}"
          oninput="calculateCapacitors()"
          placeholder="Enter C${index}"
        >

        <select
          id="unit${index}"
          class="unit-select"
          onchange="calculateCapacitors()"
        >

          <option value="1e-12">pF</option>
          <option value="1e-9">nF</option>
          <option value="1e-6" selected>µF</option>
          <option value="1e-3">mF</option>

        </select>

      </div>

    </div>
  `;
}

function renderInputs(){

  const box =
    document.getElementById("capacitorInputs");

  box.innerHTML = "";

  for(let i = 1; i <= capacitorCount; i++){

    box.insertAdjacentHTML(
      "beforeend",
      capacitorRow(i)
    );
  }
}

function addCapacitor(){

  capacitorCount++;

  document
    .getElementById("capacitorInputs")
    .insertAdjacentHTML(
      "beforeend",
      capacitorRow(capacitorCount)
    );
}

function removeCapacitor(){

  if(capacitorCount <= 1) return;

  const row =
    document.getElementById(
      "capacitorRow" + capacitorCount
    );

  if(row) row.remove();

  capacitorCount--;

  calculateCapacitors();
}

function calculateCapacitors(){

  const mode =
    document.getElementById("calcMode").value;

  const outputUnit =
    Number(document.getElementById("outputUnit").value);

  const errorBox =
    document.getElementById("errorBox");

  let capacitorValues = [];

  for(let i = 1; i <= capacitorCount; i++){

    const input =
      document.getElementById("cap" + i);

    const unit =
      document.getElementById("unit" + i);

    if(
      input &&
      unit &&
      input.value !== ""
    ){

      const valueFarad =
        Number(input.value) *
        Number(unit.value);

      if(valueFarad > 0){

        capacitorValues.push(valueFarad);
      }
    }
  }

  if(capacitorValues.length < 1){

    errorBox.style.display = "block";

    document.getElementById("resultValue").innerText = "-";

    return;
  }

  errorBox.style.display = "none";

  let totalFarad = 0;

  /* CAPACITOR FORMULAS */

  if(mode === "parallel"){

    totalFarad = 0;

    for(let i = 0; i < capacitorValues.length; i++){

      totalFarad += capacitorValues[i];
    }

    document.getElementById("formulaText").innerHTML =
      "Parallel: Ctotal = C1 + C2 + C3 + ...";
  }

  else{

    let reciprocalSum = 0;

    for(let i = 0; i < capacitorValues.length; i++){

      reciprocalSum +=
        1 / capacitorValues[i];
    }

    totalFarad =
      1 / reciprocalSum;

    document.getElementById("formulaText").innerHTML =
      "Series: Ctotal = 1 / (1/C1 + 1/C2 + 1/C3 + ...)";
  }

  /* OUTPUT CONVERSION */

  let displayValue =
    totalFarad / outputUnit;

  let unitText = "µF";

  if(outputUnit === 1e-12){
    unitText = "pF";
  }

  if(outputUnit === 1e-9){
    unitText = "nF";
  }

  if(outputUnit === 1e-6){
    unitText = "µF";
  }

  if(outputUnit === 1e-3){
    unitText = "mF";
  }

  document.getElementById("resultValue").innerText =
    parseFloat(displayValue.toFixed(10))
    + " "
    + unitText;
}

document.addEventListener("DOMContentLoaded", function(){

  renderInputs();

  calculateCapacitors();
});

</script>

</body>
</html>
