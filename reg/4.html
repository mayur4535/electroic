<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#regulator-calc,*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:10px}
#regulator-calc{max-width:620px;margin:auto;padding-top:14px}
.calc-grid{display:grid;gap:15px}
.calc-label{display:block;font-size:15px;font-weight:700;color:#4b5563;margin-bottom:7px}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:center}
input,select{width:100%;height:43px;border:1px solid #cfd6df;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;outline:none}
select{text-align:center;font-weight:700;padding:0 6px}
input:focus,select:focus{border-color:#ff6a00;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.unit-box,.unit-select{width:82px;min-width:82px;max-width:82px;height:43px}
.unit-box{border:1px solid #cfd6df;border-radius:8px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#111827}
.section{display:none}.section.active{display:block}
.calc-btn{width:100%;height:45px;margin-top:24px;border:0;border-radius:9px;background:linear-gradient(90deg,#ff7a18,#ff3d00);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.result-title{margin-top:30px;margin-bottom:14px;font-size:14px;font-weight:800;color:#a7afbd;letter-spacing:.5px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result-card{min-height:64px;padding:14px;border-radius:9px}
.result-card:nth-child(1){background:#eef5ff;border:1px solid #bcd7ff}
.result-card:nth-child(2){background:#ecfdf5;border:1px solid #bbf7d0}
.result-card:nth-child(1) .result-label,.result-card:nth-child(1) .result-value{color:#2563eb}
.result-card:nth-child(2) .result-label,.result-card:nth-child(2) .result-value{color:#059669}
.result-label{font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:7px}
.result-value{font-size:16px;font-weight:900;min-height:18px;word-break:break-word}
.formula{margin-top:18px;padding:14px;border-radius:9px;background:#f9fafb;border:1px solid #e5e7eb;font-size:14px;line-height:1.6;color:#667085;font-weight:700}
.error{display:none;margin-top:12px;color:#dc2626;font-size:14px;font-weight:800}
@media(max-width:600px){
body{padding:0}
.calc-row{grid-template-columns:minmax(0,1fr) 72px}
.unit-box,.unit-select{width:72px;min-width:72px;max-width:72px}
.result-grid{grid-template-columns:1fr 1fr}
.result-value{font-size:14px}
}
</style>
</head>

<body>

<div id="regulator-calc">

  <label class="calc-label">Mode Selection</label>
  <div class="calc-row">
    <select id="modeSelect" onchange="changeMode()">
      <option value="voltage">Voltage Adj</option>
      <option value="current">Current Adj</option>
    </select>
    <div class="unit-box">MODE</div>
  </div>

  <div id="voltage" class="section active">
    <div class="calc-grid">

      <div>
        <label class="calc-label">R1</label>
        <div class="calc-row">
          <input type="number" id="r1_v" value="25">
          <select id="r1Scale_v" class="unit-select">
            <option value="">Ω</option>
            <option value="Kilo" selected>kΩ</option>
            <option value="Mega">MΩ</option>
          </select>
        </div>
      </div>

      <div>
        <label class="calc-label">R2</label>
        <div class="calc-row">
          <input type="number" id="r2_v" value="25">
          <select id="r2Scale_v" class="unit-select">
            <option value="">Ω</option>
            <option value="Kilo" selected>kΩ</option>
            <option value="Mega">MΩ</option>
          </select>
        </div>
      </div>

      <div>
        <label class="calc-label">Regulator</label>
        <div class="calc-row">
          <select id="regulador_v">
            <option selected>LM317</option>
            <option>7805</option>
            <option>7808</option>
            <option>7812</option>
            <option>7824</option>
          </select>
          <div class="unit-box">IC</div>
        </div>
      </div>

    </div>

    <button class="calc-btn" onclick="compute_v()">Calculate</button>
    <div id="err_v" class="error">Please enter valid values.</div>

    <div class="result-title">RESULTS</div>
    <div class="result-grid">
      <div class="result-card">
        <div class="result-label">Vout</div>
        <div class="result-value"><span id="vout_v"></span></div>
      </div>
    </div>

    <div class="formula">Vout = Vreg × (1 + R2 / R1)</div>
  </div>

  <div id="current" class="section">
    <div class="calc-grid">

      <div>
        <label class="calc-label">R</label>
        <div class="calc-row">
          <input type="number" id="r_i" value="50">
          <select id="rScale_i" class="unit-select">
            <option value="">Ω</option>
            <option value="Kilo" selected>kΩ</option>
            <option value="Mega">MΩ</option>
          </select>
        </div>
      </div>

      <div>
        <label class="calc-label">Regulator</label>
        <div class="calc-row">
          <select id="regulador_i">
            <option selected>LM317</option>
            <option>7805</option>
            <option>7808</option>
            <option>7812</option>
            <option>7824</option>
          </select>
          <div class="unit-box">IC</div>
        </div>
      </div>

    </div>

    <button class="calc-btn" onclick="compute_i()">Calculate</button>
    <div id="err_i" class="error">Please enter valid values.</div>

    <div class="result-title">RESULTS</div>
    <div class="result-grid">
      <div class="result-card">
        <div class="result-label">Iout</div>
        <div class="result-value"><span id="iout_i"></span></div>
      </div>
      <div class="result-card">
        <div class="result-label">Pr</div>
        <div class="result-value"><span id="pout_i"></span></div>
      </div>
    </div>

    <div class="formula">Iout = Vreg / R<br>Pr = Vreg × Iout</div>
  </div>

</div>

<script>
function roundNumber(num, dec){
  return Math.round(Math.round(num * Math.pow(10, dec + 1)) / 10) / Math.pow(10, dec);
}

function parseValue(val, scale){
  var l = parseFloat(val);
  if(scale == "Pico") l /= 1000000000000;
  if(scale == "Nano") l /= 1000000000;
  if(scale == "Micro") l /= 1000000;
  if(scale == "Mili") l /= 1000;
  if(scale == "Kilo") l *= 1000;
  if(scale == "Mega") l *= 1000000;
  if(scale == "Giga") l *= 1000000000;
  return l;
}

function getReg(id){
  var r = document.getElementById(id).value;
  if(r == "LM317") return 1.25;
  if(r == "7805") return 5;
  if(r == "7808") return 8;
  if(r == "7812") return 12;
  if(r == "7824") return 24;
  return 0;
}

function compute_v(){
  var r1 = parseValue(document.getElementById("r1_v").value, document.getElementById("r1Scale_v").value);
  var r2 = parseValue(document.getElementById("r2_v").value, document.getElementById("r2Scale_v").value);
  var vreg = getReg("regulador_v");

  if(isNaN(r1) || isNaN(r2) || r1 <= 0){
    document.getElementById("err_v").style.display = "block";
    document.getElementById("vout_v").innerText = "";
    return;
  }

  document.getElementById("err_v").style.display = "none";

  var vout = vreg * (1 + r2 / r1);

  if(vout < 1){
    document.getElementById("vout_v").innerText = roundNumber(vout * 1000, 3) + " mV";
  }else{
    document.getElementById("vout_v").innerText = roundNumber(vout, 3) + " V";
  }
}

function compute_i(){
  var r = parseValue(document.getElementById("r_i").value, document.getElementById("rScale_i").value);
  var vreg = getReg("regulador_i");

  if(isNaN(r) || r <= 0){
    document.getElementById("err_i").style.display = "block";
    document.getElementById("iout_i").innerText = "";
    document.getElementById("pout_i").innerText = "";
    return;
  }

  document.getElementById("err_i").style.display = "none";

  var iout = vreg / r;
  var pout = vreg * iout;

  if(iout < 1){
    document.getElementById("iout_i").innerText = roundNumber(iout * 1000, 3) + " mA";
  }else{
    document.getElementById("iout_i").innerText = roundNumber(iout, 3) + " A";
  }

  if(pout < 1){
    document.getElementById("pout_i").innerText = roundNumber(pout * 1000, 3) + " mW";
  }else{
    document.getElementById("pout_i").innerText = roundNumber(pout, 3) + " W";
  }
}

function changeMode(){
  var mode = document.getElementById("modeSelect").value;
  document.getElementById("voltage").classList.remove("active");
  document.getElementById("current").classList.remove("active");
  document.getElementById(mode).classList.add("active");
}
</script>

</body>
</html>
