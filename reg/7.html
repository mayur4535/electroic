<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#cap-energy-calc,
#cap-energy-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#cap-energy-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#cap-energy-calc .calc-grid{
  display:grid;
  gap:15px;
}

#cap-energy-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#cap-energy-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#cap-energy-calc input,
#cap-energy-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#cap-energy-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#cap-energy-calc input:focus,
#cap-energy-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#cap-energy-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#cap-energy-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#cap-energy-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#cap-energy-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#cap-energy-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#cap-energy-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#cap-energy-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#cap-energy-calc .result-card:nth-child(1) .result-label,
#cap-energy-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#cap-energy-calc .result-card:nth-child(2) .result-label,
#cap-energy-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#cap-energy-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#cap-energy-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
  min-height:18px;
  display:flex;
  align-items:center;
}

#cap-energy-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  body{padding:0;}

  #cap-energy-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #cap-energy-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #cap-energy-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #cap-energy-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="cap-energy-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Capacitance</label>
      <div class="calc-row">
        <input id="ia" type="number" placeholder="Enter capacitance">
        <select id="uia" class="unit-select">
          <option value="1:1:0" selected>F</option>
          <option value="1000000000000:1:0">pF</option>
          <option value="1000000000:1:0">nF</option>
          <option value="1000000:1:0">µF</option>
          <option value="1000:1:0">mF</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Voltage</label>
      <div class="calc-row">
        <input id="ib" type="number" placeholder="Enter voltage">
        <select id="uib" class="unit-select">
          <option value="1:1:0" selected>V</option>
          <option value="1000000000:1:0">nV</option>
          <option value="1000000:1:0">µV</option>
          <option value="1000:1:0">mV</option>
          <option value="0.001:1:0">kV</option>
          <option value="0.000001:1:0">MV</option>
          <option value="0.000000001:1:0">GV</option>
        </select>
      </div>
    </div>

  </div>

  <button onclick="calculate()">Calculate</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Energy Stored</div>

      <div class="calc-row" style="margin-top:8px;">
        <div class="result-value">
          <span id="oa"></span>
        </div>

        <select id="uoa" onchange="calculate()" class="unit-select">
          <option value="1:1:0" selected>J</option>
          <option value="1000000000:1:0">nJ</option>
          <option value="1000000:1:0">µJ</option>
          <option value="1000:1:0">mJ</option>
          <option value="0.001:1:0">kJ</option>
          <option value="0.000001:1:0">MJ</option>
          <option value="0.000000001:1:0">GJ</option>
          <option value="0.238845897:1:0">cal</option>
          <option value="0.000238845897:1:0">kcal</option>
          <option value="0.000948317:1:0">BTU</option>
          <option value="6.2415115443e18:1:0">eV</option>
          <option value="10000000:1:0">erg</option>
          <option value="0.000000277777777777778:1:0">kWh</option>
        </select>
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Charge Stored</div>

      <div class="calc-row" style="margin-top:8px;">
        <div class="result-value">
          <span id="ob"></span>
        </div>

        <select id="uob" onchange="calculate()" class="unit-select">
          <option value="1:1:0" selected>C</option>
          <option value="1000000:1:0">µC</option>
          <option value="1:1:0">mC</option>
          <option value="0.001:1:0">kC</option>
          <option value="0.000001:1:0">MC</option>
          <option value="6.2415097445e18:1:0">e</option>
          <option value="0.00001036426899:1:0">Faraday</option>
        </select>
      </div>
    </div>

  </div>

  <div class="formula">
    Energy = 0.5 × C × V²<br>
    Charge = C × V
  </div>

</div>

<script>
function getUnit(id){
  var u = document.getElementById(id).value;
  var ua = u.split(":",3);

  return {
    m: parseFloat(ua[0]),
    b: parseFloat(ua[1]),
    a: parseFloat(ua[2])
  };
}

function fromUnit(value,id){
  var unit = getUnit(id);

  if(unit.m == 0 && unit.a == 0 && unit.b == 0){
    return false;
  }

  return Math.pow(((value - unit.a) / unit.m), (1 / unit.b));
}

function toUnit(value,id){
  var unit = getUnit(id);

  if(unit.m == 0 && unit.a == 0 && unit.b == 0){
    return false;
  }

  return Math.pow(value, unit.b) * unit.m + unit.a;
}

function calculate(){

  var ia = parseFloat(document.getElementById("ia").value);
  var ib = parseFloat(document.getElementById("ib").value);
  var errorBox = document.getElementById("errorBox");

  if(isNaN(ia) || isNaN(ib)){
    errorBox.style.display = "block";
    document.getElementById("oa").innerText = "";
    document.getElementById("ob").innerText = "";
    return false;
  }

  errorBox.style.display = "none";

  /* ORIGINAL FORMULA PRESERVED */

  ia = fromUnit(ia,"uia");
  ib = fromUnit(ib,"uib");

  var oa = 0.5 * ia * ib * ib;
  var ob = ia * ib;

  oa = toUnit(oa,"uoa");
  ob = toUnit(ob,"uob");

  if(oa.toPrecision){
    oa = oa.toPrecision(6);
  }

  if(ob.toPrecision){
    ob = ob.toPrecision(6);
  }

  document.getElementById("oa").innerText = oa;
  document.getElementById("ob").innerText = ob;

  return false;
}
</script>

</body>
</html>
