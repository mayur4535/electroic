<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#inductor-sp-calc,
#inductor-sp-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#inductor-sp-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#inductor-sp-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#inductor-sp-calc .calc-grid{
  display:grid;
  gap:15px;
}

#inductor-sp-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#inductor-sp-calc input,
#inductor-sp-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#inductor-sp-calc select{
  text-align:center;
  font-weight:700;
}

#inductor-sp-calc input:focus,
#inductor-sp-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#inductor-sp-calc .unit-box,
#inductor-sp-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#inductor-sp-calc .unit-box{
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
}

#inductor-sp-calc .btn-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

#inductor-sp-calc button{
  width:100%;
  height:45px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#inductor-sp-calc button.secondary{
  background:#fff;
  color:#ea580c;
  border:1px solid #fed7aa;
}

#inductor-sp-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
}

#inductor-sp-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#inductor-sp-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#inductor-sp-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#inductor-sp-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#inductor-sp-calc .result-card:nth-child(1) .result-label,
#inductor-sp-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#inductor-sp-calc .result-card:nth-child(2) .result-label,
#inductor-sp-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#inductor-sp-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#inductor-sp-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#inductor-sp-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  body{padding:0;}

  #inductor-sp-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #inductor-sp-calc .unit-box,
  #inductor-sp-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #inductor-sp-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #inductor-sp-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="inductor-sp-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Connection Type</label>
      <div class="calc-row">
        <select id="calcMode" onchange="calculateInductors()">
          <option value="series">Series</option>
          <option value="parallel">Parallel</option>
        </select>
        <div class="unit-box">TYPE</div>
      </div>
    </div>

    <div id="inductorInputs"></div>

  </div>

  <div class="btn-row">
    <button type="button" onclick="addInductor()">+ Inductor</button>
    <button type="button" class="secondary" onclick="removeInductor()">- Inductor</button>
  </div>

  <div id="errorBox">Please enter inductor values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Total Inductance</div>
      <div class="result-value">
        <span id="resultValue">-</span>
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Result Format</div>
      <div class="result-value">
        <select id="outputUnit" onchange="calculateInductors()">
          <option value="1e-9">nH</option>
          <option value="1e-6" selected>µH</option>
          <option value="1e-3">mH</option>
          <option value="1">H</option>
        </select>
      </div>
    </div>

  </div>

  <div class="formula" id="formulaText">
    Series: Ltotal = L1 + L2 + L3 + ...
  </div>

</div>

<script>
let inductorCount = 3;

function inductorRow(index){
  return `
    <div id="inductorRow${index}" style="margin-bottom:15px;">
      <label class="calc-label">L${index}</label>
      <div class="calc-row">
        <input
          type="number"
          id="ind${index}"
          oninput="calculateInductors()"
          placeholder="Enter L${index}"
        >

        <select
          id="unit${index}"
          class="unit-select"
          onchange="calculateInductors()"
        >
          <option value="1e-9">nH</option>
          <option value="1e-6" selected>µH</option>
          <option value="1e-3">mH</option>
          <option value="1">H</option>
        </select>
      </div>
    </div>
  `;
}

function renderInputs(){
  const box = document.getElementById("inductorInputs");
  box.innerHTML = "";

  for(let i = 1; i <= inductorCount; i++){
    box.insertAdjacentHTML("beforeend", inductorRow(i));
  }
}

function addInductor(){
  inductorCount++;
  document
    .getElementById("inductorInputs")
    .insertAdjacentHTML("beforeend", inductorRow(inductorCount));
}

function removeInductor(){
  if(inductorCount <= 1) return;

  const row = document.getElementById("inductorRow" + inductorCount);
  if(row) row.remove();

  inductorCount--;
  calculateInductors();
}

function calculateInductors(){
  const mode = document.getElementById("calcMode").value;
  const outputUnit = Number(document.getElementById("outputUnit").value);
  const errorBox = document.getElementById("errorBox");

  let values = [];

  for(let i = 1; i <= inductorCount; i++){
    const input = document.getElementById("ind" + i);
    const unit = document.getElementById("unit" + i);

    if(input && unit && input.value !== ""){
      const valueHenry = Number(input.value) * Number(unit.value);

      if(valueHenry > 0 && isFinite(valueHenry)){
        values.push(valueHenry);
      }
    }
  }

  if(values.length < 1){
    errorBox.style.display = "block";
    document.getElementById("resultValue").innerText = "-";
    return;
  }

  errorBox.style.display = "none";

  let totalHenry = 0;

  if(mode === "series"){
    totalHenry = 0;

    for(let i = 0; i < values.length; i++){
      totalHenry += values[i];
    }

    document.getElementById("formulaText").innerHTML =
      "Series: Ltotal = L1 + L2 + L3 + ...";
  }else{
    let reciprocalSum = 0;

    for(let i = 0; i < values.length; i++){
      reciprocalSum += 1 / values[i];
    }

    totalHenry = 1 / reciprocalSum;

    document.getElementById("formulaText").innerHTML =
      "Parallel: Ltotal = 1 / (1/L1 + 1/L2 + 1/L3 + ...)";
  }

  let displayValue = totalHenry / outputUnit;
  let unitText = "µH";

  if(outputUnit === 1e-9) unitText = "nH";
  if(outputUnit === 1e-6) unitText = "µH";
  if(outputUnit === 1e-3) unitText = "mH";
  if(outputUnit === 1) unitText = "H";

  document.getElementById("resultValue").innerText =
    parseFloat(displayValue.toFixed(10)) + " " + unitText;
}

document.addEventListener("DOMContentLoaded", function(){
  renderInputs();
  calculateInductors();
});
</script>

</body>
</html>
