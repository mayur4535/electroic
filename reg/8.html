<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#coil-inductance-calc,
#coil-inductance-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#coil-inductance-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#coil-inductance-calc .calc-grid{
  display:grid;
  gap:15px;
}

#coil-inductance-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#coil-inductance-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#coil-inductance-calc input,
#coil-inductance-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#coil-inductance-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#coil-inductance-calc input:focus,
#coil-inductance-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#coil-inductance-calc .unit-box,
#coil-inductance-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#coil-inductance-calc .unit-box{
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#coil-inductance-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#coil-inductance-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#coil-inductance-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#coil-inductance-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#coil-inductance-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#coil-inductance-calc .result-card:nth-child(1) .result-label,
#coil-inductance-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#coil-inductance-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#coil-inductance-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
  min-height:18px;
  display:flex;
  align-items:center;
}

#coil-inductance-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #coil-inductance-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #coil-inductance-calc .unit-box,
  #coil-inductance-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #coil-inductance-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #coil-inductance-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="coil-inductance-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Coil Type</label>
      <div class="calc-row">
        <select id="geometry" onchange="updateGeometry()">
          <option value="1" selected>Single</option>
          <option value="2">Multi</option>
          <option value="3">Flat</option>
        </select>
        <div class="unit-box">TYPE</div>
      </div>
    </div>

    <div>
      <label class="calc-label" id="diameterLabel">Coil Diameter</label>
      <div class="calc-row">
        <input id="diamIn" type="number" min="0" placeholder="Enter diameter">
        <select id="coilUnits" class="unit-select" onchange="calculateVal(); updateUnitLabels();">
          <option value="0.0393700787402" selected>mm</option>
          <option value="0.393700787402">cm</option>
          <option value="39.3700787402">m</option>
          <option value="1">in</option>
          <option value="12">ft</option>
        </select>
      </div>
    </div>

    <div id="intDiamRow">
      <label class="calc-label">Internal Diameter</label>
      <div class="calc-row">
        <input id="innDiamIn" type="number" min="0" placeholder="Enter internal diameter">
        <div class="unit-box" id="c4">mm</div>
      </div>
    </div>

    <div id="lengthRow">
      <label class="calc-label">Coil Length</label>
      <div class="calc-row">
        <input id="lengthIn" type="number" min="0" placeholder="Enter coil length">
        <div class="unit-box" id="c5">mm</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Turns</label>
      <div class="calc-row">
        <input id="nTurnsIn" type="number" min="0" placeholder="Enter turns">
        <div class="unit-box">N</div>
      </div>
    </div>

  </div>

  <button onclick="calculateVal()">Calculate</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Inductance</div>

      <div class="calc-row" style="margin-top:8px;">
        <div class="result-value">
          <span id="rsltDiv"></span>
        </div>

        <select id="lUnits" onchange="calculateVal()" class="unit-select">
          <option value="1000000">pH</option>
          <option value="1000">nH</option>
          <option value="1" selected>µH</option>
          <option value="0.001">mH</option>
          <option value="0.000001">H</option>
        </select>
      </div>
    </div>

  </div>

  <div class="formula" id="formulaBox">
    Single Layer: r² × N² / (9r + 10l)<br>
    Multi Layer: 0.8 × r² × N² / (6r + 9l + 10d)<br>
    Flat Spiral: r² × N² / (8r + 11d)
  </div>

</div>

<script>
function updateUnitLabels(){
  var coilUnits = Number(document.getElementById("coilUnits").value);

  if(coilUnits == 0.0393700787402){
    document.getElementById("c4").innerHTML = "mm";
    document.getElementById("c5").innerHTML = "mm";
  }else if(coilUnits == 0.393700787402){
    document.getElementById("c4").innerHTML = "cm";
    document.getElementById("c5").innerHTML = "cm";
  }else if(coilUnits == 39.3700787402){
    document.getElementById("c4").innerHTML = "m";
    document.getElementById("c5").innerHTML = "m";
  }else if(coilUnits == 1){
    document.getElementById("c4").innerHTML = "in";
    document.getElementById("c5").innerHTML = "in";
  }else if(coilUnits == 12){
    document.getElementById("c4").innerHTML = "ft";
    document.getElementById("c5").innerHTML = "ft";
  }
}

function updateGeometry(){
  var geometry = Number(document.getElementById("geometry").value);

  if(geometry == 1){
    document.getElementById("diameterLabel").innerHTML = "Coil Diameter";
    document.getElementById("lengthRow").style.display = "block";
    document.getElementById("intDiamRow").style.display = "none";
  }else if(geometry == 3){
    document.getElementById("diameterLabel").innerHTML = "Outer Diameter";
    document.getElementById("lengthRow").style.display = "none";
    document.getElementById("intDiamRow").style.display = "block";
  }else{
    document.getElementById("diameterLabel").innerHTML = "Outer Diameter";
    document.getElementById("lengthRow").style.display = "block";
    document.getElementById("intDiamRow").style.display = "block";
  }

  updateUnitLabels();
  document.getElementById("rsltDiv").innerHTML = "";
}

function calculateVal(){

  var geometry = Number(document.getElementById("geometry").value);
  var coilUnits = Number(document.getElementById("coilUnits").value);
  var diameter = Number(document.getElementById("diamIn").value);
  var coilLength = Number(document.getElementById("lengthIn").value);
  var intDiam = Number(document.getElementById("innDiamIn").value);
  var nTurns = Number(document.getElementById("nTurnsIn").value);
  var lUnits = Number(document.getElementById("lUnits").value);

  var errorBox = document.getElementById("errorBox");

  if(diameter <= 0 || nTurns <= 0){
    errorBox.style.display = "block";
    document.getElementById("rsltDiv").innerHTML = "";
    return;
  }

  if(geometry == 1 && coilLength <= 0){
    errorBox.style.display = "block";
    document.getElementById("rsltDiv").innerHTML = "";
    return;
  }

  if(geometry == 3 && intDiam <= 0){
    errorBox.style.display = "block";
    document.getElementById("rsltDiv").innerHTML = "";
    return;
  }

  if(geometry == 2 && (coilLength <= 0 || intDiam <= 0)){
    errorBox.style.display = "block";
    document.getElementById("rsltDiv").innerHTML = "";
    return;
  }

  errorBox.style.display = "none";

  var coilDepth = diameter - intDiam;
  var mlfsDiam = diameter - intDiam * 0.5;

  var result = 0;

  /* ORIGINAL FORMULAS PRESERVED */

  if(geometry == 1){

    result =
      (
        0.5 * diameter * coilUnits *
        0.5 * diameter * coilUnits *
        nTurns * nTurns /
        (
          9 * 0.5 * diameter * coilUnits +
          10 * coilLength * coilUnits
        ) *
        lUnits
      ).toFixed(3);

    document.getElementById("formulaBox").innerHTML =
      "Single Layer:<br>" +
      "Self-Inductance ≈ r² × N² / (9r + 10l)";

  }else if(geometry == 3){

    result =
      (
        0.5 * mlfsDiam * coilUnits *
        0.5 * mlfsDiam * coilUnits *
        nTurns * nTurns /
        (
          8 * 0.5 * mlfsDiam * coilUnits +
          11 * coilDepth * coilUnits
        ) *
        lUnits
      ).toFixed(3);

    document.getElementById("formulaBox").innerHTML =
      "Flat Spiral:<br>" +
      "Self-Inductance ≈ r² × N² / (8r + 11d)";

  }else{

    result =
      (
        0.8 *
        (
          0.5 * mlfsDiam * coilUnits *
          0.5 * mlfsDiam * coilUnits *
          nTurns * nTurns
        ) /
        (
          6 * 0.5 * mlfsDiam * coilUnits +
          9 * coilLength * coilUnits +
          10 * coilDepth * coilUnits
        ) *
        lUnits
      ).toFixed(3);

    document.getElementById("formulaBox").innerHTML =
      "Multi Layer:<br>" +
      "Self-Inductance ≈ 0.8 × r² × N² / (6r + 9l + 10d)";
  }

  document.getElementById("rsltDiv").innerHTML = result;

  updateUnitLabels();
}

document.addEventListener("DOMContentLoaded", function(){
  updateGeometry();
});
</script>

</body>
</html>
