<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
#resistor-ratio-calc,*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f8fb;padding:10px}
#resistor-ratio-calc{max-width:620px;margin:auto;padding-top:14px}
.calc-grid{display:grid;gap:15px}
.calc-label{display:block;font-size:15px;font-weight:700;color:#4b5563;margin-bottom:7px}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:center}
input,select{width:100%;height:43px;border:1px solid #cfd6df;border-radius:8px;padding:0 12px;font-size:15px;background:#fff;outline:none}
select{text-align:center;font-weight:700}
.unit-box{height:43px;border:1px solid #cfd6df;border-radius:8px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.check-row{height:43px;border:1px solid #cfd6df;border-radius:8px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:700}
.check-row input{width:18px;height:18px}
button{width:100%;height:45px;margin-top:24px;border:0;border-radius:9px;background:linear-gradient(90deg,#ff7a18,#ff3d00);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.result-title{margin-top:30px;margin-bottom:14px;font-size:14px;font-weight:800;color:#a7afbd}
.result-grid{display:grid;gap:12px}
.result-card{padding:14px;border-radius:9px}
.result-card:nth-child(1){background:#eef5ff;border:1px solid #bcd7ff}
.result-card:nth-child(2){background:#ecfdf5;border:1px solid #bbf7d0}
.result-card:nth-child(3){background:#f5f3ff;border:1px solid #ddd6fe}
.result-label{font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:7px}
.result-value{font-size:15px;font-weight:900;line-height:1.8;visibility:hidden}
.show-result .result-value,.show-result #equRratio{visibility:visible}
#errorBox{display:none;margin-top:12px;color:#dc2626;font-size:14px;font-weight:800}
#equRratio{visibility:hidden;font-size:14px;font-weight:800;color:#dc2626;margin-bottom:10px}
.mini-error{color:#dc2626;font-size:13px;font-weight:900}
.formula{margin-top:18px;padding:14px;border-radius:9px;background:#f9fafb;border:1px solid #e5e7eb;font-size:14px;line-height:1.6;color:#667085;font-weight:700}
@media(max-width:600px){body{padding:0}.calc-row{grid-template-columns:minmax(0,1fr) 72px}.result-value{font-size:14px}}
</style>
</head>

<body>

<div id="resistor-ratio-calc">

  <div class="calc-grid">
    <div>
      <label class="calc-label">Resistor Series</label>
      <div class="calc-row">
        <select id="seriesSelect" onchange="serclick(this.value)">
          <option value="12" selected>E12</option>
          <option value="24">E24</option>
          <option value="48">E48</option>
          <option value="96">E96</option>
        </select>
        <div class="unit-box">SER</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Ratio Type</label>
      <div class="calc-row">
        <select id="ratioTypeSelect" onchange="ratioclick(this.value)">
          <option value="0" selected>R1 / R2</option>
          <option value="1">Voltage Divider</option>
        </select>
        <div class="unit-box">TYPE</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Desired Ratio</label>
      <div class="calc-row">
        <input id="Rratio" type="number" value="0.35" step="0.01">
        <div class="unit-box">R</div>
      </div>
    </div>

    <label class="check-row">
      <input type="checkbox" id="recipCheck">
      Inverse <span id="reciprocal"></span>
    </label>
  </div>

  <button onclick="ratioCalc()">Calculate</button>

  <div id="errorBox">Please enter valid ratio.</div>

  <div class="result-title">RESULTS</div>
  <div id="equRratio"></div>

  <div class="result-grid">
    <div class="result-card">
      <div class="result-label">Single</div>
      <div class="result-value">
        <span id="ratioSingle1"></span> ÷ <span id="ratioSingle2"></span> =
        <span id="ratioSingleVal"></span><br>
        <span class="mini-error">ERROR: </span><span id="ratioSingleErr" class="mini-error"></span>
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Series</div>
      <div class="result-value">
        <span id="ratioSeries1"></span> ÷
        (<span id="ratioSeries2"></span> + <span id="ratioSeries3"></span>) =
        <span id="ratioSerVal"></span><br>
        <span class="mini-error">ERROR: </span><span id="ratioSerErr" class="mini-error"></span>
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Parallel</div>
      <div class="result-value">
        <span id="ratioPar1"></span> ÷
        (<span id="ratioPar2"></span> // <span id="ratioPar3"></span>) =
        <span id="ratioParVal"></span><br>
        <span class="mini-error">ERROR: </span><span id="ratioParErr" class="mini-error"></span>
      </div>
    </div>
  </div>

  <div class="formula">
    Original E-series resistor ratio search formula preserved.
  </div>
</div>

<script>
var E12=[1.0,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
var E24=[1.0,1.1,1.2,1.3,1.5,1.6,1.8,2.0,2.2,2.4,2.7,3.0,3.3,3.6,3.9,4.3,4.7,5.1,5.6,6.2,6.8,7.5,8.2,9.1];
var Es=E12;
var ratiotype=0;

function serclick(ser){
  ser=Number(ser);
  if(ser==12) Es=E12;
  else if(ser==24) Es=E24;
  else{
    Es=[];
    for(i=0;i<ser;i++) Es[i]=Number((Math.pow(10,i/ser)).toFixed(2));
  }
}

function ratioclick(type){
  ratiotype=Number(type);
}

function toEng(r){
  var valstr;
  if(r>=1000000){r/=1000000;valstr=" M";}
  else if(r>=1000){r/=1000;valstr=" K";}
  else valstr=" ";
  r=Math.round(100*r)/100;
  return r.toString()+valstr+String.fromCharCode(937);
}

function findFirstLower(res){
  if(res<1) res=1;
  var man=Math.log(res)/Math.LN10;
  var exp=Math.floor(man);
  man=Math.floor((man-exp)*Es.length);
  exp=Math.pow(10,exp);
  return [man,exp];
}

function findNextHigher(res){
  if(res[0]<(Es.length-1)) return [res[0]+1,res[1]];
  return [0,res[1]*10];
}

function findBestMatch(res){
  var rlow=findFirstLower(res);
  var rhigh=findNextHigher(rlow);
  var errl=(Es[rlow[0]]*rlow[1]-res)/res;
  var errh=(Es[rhigh[0]]*rhigh[1]-res)/res;
  return Math.abs(errh)<Math.abs(errl)?rhigh:rlow;
}

function findBestSer(res){
  var thisRA=findFirstLower(res/2);
  var R1=Es[thisRA[0]]*thisRA[1];
  var bestErr=1E9,bestR1,bestR2,err,R2A,R2;
  do{
    R2A=findBestMatch(res-R1);
    R2=Es[R2A[0]]*R2A[1];
    err=R1+R2-res;
    if(Math.abs(err)<Math.abs(bestErr)){
      bestR1=R1;bestR2=R2;bestErr=err;
    }
    thisRA=findNextHigher(thisRA);
    R1=Es[thisRA[0]]*thisRA[1];
  }while(R1<res);
  return [bestR1,bestR2];
}

function findBestPar(res){
  var thisRA=findFirstLower(res);
  var R1=Es[thisRA[0]]*thisRA[1];
  var bestErr=1E9,bestR1,bestR2,err,R2A,R2;
  do{
    if(R1!=res){
      R2A=findBestMatch(1/(1/res-1/R1));
      R2=Es[R2A[0]]*R2A[1];
      if(R2<1E9){
        err=R1*R2/(R1+R2)-res;
        if(Math.abs(err)<Math.abs(bestErr)){
          bestR1=R1;bestR2=R2;bestErr=err;
        }
      }
    }
    thisRA=findNextHigher(thisRA);
    R1=Es[thisRA[0]]*thisRA[1];
  }while(R1<=2*res);
  return [bestR1,bestR2];
}

function ratioCalc(){
  document.getElementById("resistor-ratio-calc").classList.add("show-result");

  var dratio=Number(document.getElementById("Rratio").value);
  if(isNaN(dratio)||dratio<=0||(ratiotype==1&&dratio>=1)){
    document.getElementById("errorBox").style.display="block";
    return;
  }
  document.getElementById("errorBox").style.display="none";

  if(document.getElementById("recipCheck").checked){
    dratio=(ratiotype==1)?1.0-dratio:1.0/dratio;
  }

  if(ratiotype==1){
    document.getElementById("equRratio").innerHTML="Equivalent resistor ratio: "+(dratio/(1-dratio)).toPrecision(5);
    dratio=dratio/(1.0-dratio);
  }else{
    document.getElementById("equRratio").innerHTML="";
  }

  var exp=Math.floor(Math.log(Math.sqrt(dratio*1E9))/Math.LN10);
  exp=Math.round(Math.pow(10,exp));

  var bestSingleErr=1E9,bestSerErr=1E9,bestParErr=1E9;
  var bestSingleRNum,bestSingleRDen,bestSeriesRNum,bestSeriesRDen1,bestSeriesRDen2,bestParRNum,bestParRDen1,bestParRDen2;

  for(i in Es){
    var rNum=Math.round(Es[i]*exp);
    var rDen=rNum/dratio;

    var rSingleA=findBestMatch(rDen);
    var rSingle=Es[rSingleA[0]]*rSingleA[1];
    var ratio=rNum/rSingle;
    var err=ratio>dratio?ratio/dratio:dratio/ratio;
    if(err<bestSingleErr){bestSingleErr=err;bestSingleRNum=rNum;bestSingleRDen=rSingle;}

    var rGroupA=findBestSer(rDen);
    ratio=rNum/(rGroupA[0]+rGroupA[1]);
    err=ratio>dratio?ratio/dratio:dratio/ratio;
    if(err<bestSerErr){bestSerErr=err;bestSeriesRNum=rNum;bestSeriesRDen1=rGroupA[0];bestSeriesRDen2=rGroupA[1];}

    rGroupA=findBestPar(rDen);
    ratio=rNum*(rGroupA[0]+rGroupA[1])/(rGroupA[0]*rGroupA[1]);
    err=ratio>dratio?ratio/dratio:dratio/ratio;
    if(err<bestParErr){bestParErr=err;bestParRNum=rNum;bestParRDen1=rGroupA[0];bestParRDen2=rGroupA[1];}
  }

  bestSingleRNum=Math.round(100*bestSingleRNum)/100;
  bestSingleRDen=Math.round(100*bestSingleRDen)/100;
  document.getElementById("ratioSingle1").innerHTML=toEng(bestSingleRNum);
  document.getElementById("ratioSingle2").innerHTML=toEng(bestSingleRDen);
  document.getElementById("ratioSingleVal").innerHTML=(bestSingleRNum/bestSingleRDen).toPrecision(4);
  document.getElementById("ratioSingleErr").innerHTML=(100*(bestSingleErr-1)).toFixed(2)+" %";

  bestSeriesRNum=Math.round(100*bestSeriesRNum)/100;
  bestSeriesRDen1=Math.round(100*bestSeriesRDen1)/100;
  bestSeriesRDen2=Math.round(100*bestSeriesRDen2)/100;
  document.getElementById("ratioSeries1").innerHTML=toEng(bestSeriesRNum);
  document.getElementById("ratioSeries2").innerHTML=toEng(bestSeriesRDen1);
  document.getElementById("ratioSeries3").innerHTML=toEng(bestSeriesRDen2);
  document.getElementById("ratioSerVal").innerHTML=(bestSeriesRNum/(bestSeriesRDen1+bestSeriesRDen2)).toPrecision(4);
  document.getElementById("ratioSerErr").innerHTML=(100*(bestSerErr-1)).toFixed(2)+" %";

  bestParRNum=Math.round(100*bestParRNum)/100;
  bestParRDen1=Math.round(100*bestParRDen1)/100;
  bestParRDen2=Math.round(100*bestParRDen2)/100;
  document.getElementById("ratioPar1").innerHTML=toEng(bestParRNum);
  document.getElementById("ratioPar2").innerHTML=toEng(bestParRDen1);
  document.getElementById("ratioPar3").innerHTML=toEng(bestParRDen2);
  document.getElementById("ratioParVal").innerHTML=(bestParRNum*(bestParRDen1+bestParRDen2)/(bestParRDen1*bestParRDen2)).toPrecision(4);
  document.getElementById("ratioParErr").innerHTML=(100*(bestParErr-1)).toFixed(2)+" %";
}

document.addEventListener("DOMContentLoaded",function(){
  serclick(12);
});
</script>

</body>
</html>
