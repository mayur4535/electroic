<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#resistor-sp-calc,
#resistor-sp-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#resistor-sp-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#resistor-sp-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#resistor-sp-calc .calc-grid{
  display:grid;
  gap:15px;
}

#resistor-sp-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#resistor-sp-calc input,
#resistor-sp-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#resistor-sp-calc select{
  text-align:center;
  font-weight:700;
}

#resistor-sp-calc input:focus,
#resistor-sp-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#resistor-sp-calc .unit-box,
#resistor-sp-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#resistor-sp-calc .unit-box{
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
}

#resistor-sp-calc .btn-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

#resistor-sp-calc button{
  width:100%;
  height:45px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#resistor-sp-calc button.secondary{
  background:#fff;
  color:#ea580c;
  border:1px solid #fed7aa;
}

#resistor-sp-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
}

#resistor-sp-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#resistor-sp-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#resistor-sp-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#resistor-sp-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#resistor-sp-calc .result-card:nth-child(1) .result-label,
#resistor-sp-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#resistor-sp-calc .result-card:nth-child(2) .result-label,
#resistor-sp-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#resistor-sp-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#resistor-sp-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#resistor-sp-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #resistor-sp-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #resistor-sp-calc .unit-box,
  #resistor-sp-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #resistor-sp-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #resistor-sp-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="resistor-sp-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Connection Type</label>

      <div class="calc-row">
        <select id="calcMode" onchange="calculateResistors()">
          <option value="series">Series</option>
          <option value="parallel">Parallel</option>
        </select>

        <div class="unit-box">TYPE</div>
      </div>
    </div>

    <div id="resistorInputs"></div>

  </div>

  <div class="btn-row">
    <button type="button" onclick="addResistor()">+ Resistor</button>

    <button type="button" class="secondary" onclick="removeResistor()">
      - Resistor
    </button>
  </div>

  <div id="errorBox">
    Please enter resistor values.
  </div>

  <div class="result-title">
    RESULTS
  </div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Total Resistance</div>

      <div class="result-value">
        <span id="resultValue">-</span>
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Result Format</div>

      <div class="result-value">

        <select id="outputUnit" onchange="calculateResistors()">

          <option value="1">Ω</option>
          <option value="1000" selected>kΩ</option>
          <option value="1000000">MΩ</option>

        </select>

      </div>
    </div>

  </div>

  <div class="formula" id="formulaText">
    Series: Rtotal = R1 + R2 + R3 + ...
  </div>

</div>

<script>

let resistorCount = 3;

function resistorRow(index){

  return `
    <div id="resistorRow${index}" style="margin-bottom:15px;">

      <label class="calc-label">R${index}</label>

      <div class="calc-row">

        <input
          type="number"
          id="res${index}"
          oninput="calculateResistors()"
          placeholder="Enter R${index}"
        >

        <select
          id="unit${index}"
          class="unit-select"
          onchange="calculateResistors()"
        >

          <option value="1">Ω</option>
          <option value="1000">kΩ</option>
          <option value="1000000">MΩ</option>

        </select>

      </div>

    </div>
  `;
}

function renderInputs(){

  const box =
    document.getElementById("resistorInputs");

  box.innerHTML = "";

  for(let i = 1; i <= resistorCount; i++){

    box.insertAdjacentHTML(
      "beforeend",
      resistorRow(i)
    );
  }
}

function addResistor(){

  resistorCount++;

  document
    .getElementById("resistorInputs")
    .insertAdjacentHTML(
      "beforeend",
      resistorRow(resistorCount)
    );
}

function removeResistor(){

  if(resistorCount <= 1) return;

  const row =
    document.getElementById(
      "resistorRow" + resistorCount
    );

  if(row) row.remove();

  resistorCount--;

  calculateResistors();
}

function calculateResistors(){

  const mode =
    document.getElementById("calcMode").value;

  const outputUnit =
    Number(document.getElementById("outputUnit").value);

  const errorBox =
    document.getElementById("errorBox");

  let resistorValues = [];

  for(let i = 1; i <= resistorCount; i++){

    const input =
      document.getElementById("res" + i);

    const unit =
      document.getElementById("unit" + i);

    if(
      input &&
      unit &&
      input.value !== ""
    ){

      const valueOhm =
        Number(input.value) *
        Number(unit.value);

      if(valueOhm > 0){

        resistorValues.push(valueOhm);
      }
    }
  }

  if(resistorValues.length < 1){

    errorBox.style.display = "block";

    document.getElementById("resultValue").innerText = "-";

    return;
  }

  errorBox.style.display = "none";

  let totalOhm = 0;

  /* EXACT DIGIKEY STYLE FORMULA */

  if(mode === "series"){

    totalOhm = 0;

    for(let i = 0; i < resistorValues.length; i++){

      totalOhm += resistorValues[i];
    }

    document.getElementById("formulaText").innerHTML =
      "Series: Rtotal = R1 + R2 + R3 + ...";
  }

  else{

    let reciprocalSum = 0;

    for(let i = 0; i < resistorValues.length; i++){

      reciprocalSum +=
        1 / resistorValues[i];
    }

    totalOhm =
      1 / reciprocalSum;

    document.getElementById("formulaText").innerHTML =
      "Parallel: Rtotal = 1 / (1/R1 + 1/R2 + 1/R3 + ...)";
  }

  /* CONVERT OUTPUT LIKE DIGIKEY */

  let displayValue =
    totalOhm / outputUnit;

  let unitText = "Ω";

  if(outputUnit === 1000){
    unitText = "kΩ";
  }

  if(outputUnit === 1000000){
    unitText = "MΩ";
  }

  document.getElementById("resultValue").innerText =
    parseFloat(displayValue.toFixed(10))
    + " "
    + unitText;
}

document.addEventListener("DOMContentLoaded", function(){

  renderInputs();

  /* SAME AS YOUR SCREENSHOT */

  document.getElementById("res1").value = 11;
  document.getElementById("unit1").value = 1000;

  document.getElementById("res2").value = 12;
  document.getElementById("unit2").value = 1000;

  document.getElementById("res3").value = 11;
  document.getElementById("unit3").value = 1;

  calculateResistors();
});

</script>

</body>
</html>
