<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;padding:12px;background:#fff;color:#123}
body.lock-scroll{overflow:hidden}
.wrap{max-width:900px;margin:auto;text-align:center;padding:0 14px}
.top{max-width:260px;margin:0 auto 18px;text-align:left}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;text-align:left}
.lbl{font-size:13px;margin-bottom:5px}
.pick-btn{width:100%;height:42px;border:1px solid #8fa3bd;border-radius:8px;font-size:14px;font-weight:bold;padding:6px 30px 6px 10px;background:linear-gradient(#f9fcff,#c8d5e6 48%,#a9b9cf 50%,#edf3fb);box-shadow:inset 0 1px 0 #fff,0 2px 5px #999;position:relative;cursor:pointer;text-align:left;overflow:hidden;white-space:nowrap}
.pick-btn:after{content:"⌄";position:absolute;right:9px;top:7px;font-size:20px}
.sw{display:inline-block;width:17px;height:17px;border:1px solid #666;margin-right:6px;vertical-align:middle}
.result{margin:14px auto;border-radius:22px;border:3px solid #73AD21;padding:14px 18px;width:min(95%,340px);font-size:24px;font-weight:bold}
.inductor{position:relative;width:100%;max-width:430px;height:170px;margin:5px auto 18px;overflow:hidden}
.wire{position:absolute;top:72px;left:0;width:100%;height:26px;background:#777}
.body{position:absolute;top:32px;left:8%;right:8%;height:110px;background:#1f8b28;border-radius:60px;box-shadow:4px 5px 8px rgba(0,0,0,.35);overflow:hidden}
.band{position:absolute;top:32px;height:110px;width:7%;z-index:3}
#band0{left:21%}
#band1{left:34%}
#band2{left:47%}
#band3{left:60%}
#band4{left:73%}
.ios-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9999}
.ios-picker{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:92%;max-width:420px;background:#d8dee9;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:12px;z-index:10000}
.ios-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:bold}
.ios-head button{border:0;background:#0b7cff;color:#fff;padding:7px 14px;border-radius:8px;font-weight:bold}
.wheel-wrap{position:relative}
.wheel{height:210px;overflow-y:auto;border-radius:10px;border:1px solid #8e99aa;background:linear-gradient(#eef3fb,#cbd6e7,#eef3fb);scroll-snap-type:y mandatory;padding:84px 0}
.wheel::-webkit-scrollbar{width:0;height:0}
.wheel div{height:42px;display:flex;align-items:center;padding:0 18px;font-size:22px;font-weight:bold;scroll-snap-align:center;cursor:pointer}
.wheel-highlight{position:absolute;left:0;right:0;top:84px;height:42px;border-top:1px solid #6f7f98;border-bottom:1px solid #6f7f98;background:rgba(255,255,255,.25);pointer-events:none}
.formula{font-size:14px;font-weight:bold;line-height:1.6;margin-top:12px}
@media(min-width:701px){
.controls{grid-template-columns:repeat(4,1fr)}
.pick-btn{height:44px;font-size:16px}
.lbl{font-size:14px}
.result{font-size:28px}
.inductor{height:220px}
.wire{top:94px;height:32px}
.body{top:42px;height:140px}
.band{top:42px;height:140px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<div class="lbl">Band Mode</div>
<div id="modeBox"></div>
</div>

<div class="controls">
<div id="box1"><div class="lbl" id="lab1">First</div><div id="d1Box"></div></div>
<div id="box2"><div class="lbl" id="lab2">Second</div><div id="d2Box"></div></div>
<div id="boxM"><div class="lbl" id="labM">Third</div><div id="mBox"></div></div>
<div id="boxT"><div class="lbl" id="labT">Forth</div><div id="tBox"></div></div>
</div>

<div class="inductor">
<div class="wire"></div>
<div class="body"></div>
<div class="band" id="band0"></div>
<div class="band" id="band1"></div>
<div class="band" id="band2"></div>
<div class="band" id="band3"></div>
<div class="band" id="band4"></div>
</div>

<div class="result" id="result">RES</div>

<div class="formula">
Value = original code formula: value = digits × 10<sup>multiplier</sup>, formatted in µH / mH.
</div>

</div>

<div class="ios-mask" id="mask">
<div class="ios-picker">
<div class="ios-head">
<span id="title">Select</span>
<button onclick="closePicker()">Done</button>
</div>
<div class="wheel-wrap">
<div class="wheel-highlight"></div>
<div class="wheel" id="wheel"></div>
</div>
</div>
</div>

<script>
const colors={
black:"#000",brown:"brown",red:"red",orange:"orange",yellow:"yellow",
green:"green",blue:"blue",violet:"darkviolet",gray:"gray",white:"white",
gold:"gold",silver:"silver"
};

const modes=[["3 BAND",3,"#ddd"],["4 BAND",4,"#ddd"],["5 BAND",5,"#ddd"]];

const digitNormal=[
["black",0,colors.black],["brown",1,colors.brown],["red",2,colors.red],
["orange",3,colors.orange],["yellow",4,colors.yellow],["green",5,colors.green],
["blue",6,colors.blue],["violet",7,colors.violet],["gray",8,colors.gray],
["white",9,colors.white]
];

const digitFive=[
["gold",-1,colors.gold],["black",0,colors.black],["brown",1,colors.brown],
["red",2,colors.red],["orange",3,colors.orange],["yellow",4,colors.yellow],
["green",5,colors.green],["blue",6,colors.blue],["violet",7,colors.violet],
["gray",8,colors.gray],["white",9,colors.white]
];

/* value = original selectedIndex */
const multNormal=[
["black",0,colors.black],["brown",1,colors.brown],["red",2,colors.red],
["orange",3,colors.orange],["yellow",4,colors.yellow],
["gold",5,colors.gold],["silver",6,colors.silver]
];

const multNoGoldSilver=[
["black",0,colors.black],["brown",1,colors.brown],["red",2,colors.red],
["orange",3,colors.orange],["yellow",4,colors.yellow],["green",5,colors.green],
["blue",6,colors.blue],["violet",7,colors.violet],["gray",8,colors.gray],
["white",9,colors.white]
];

const tol4=[
["gold",0,colors.gold],["silver",1,colors.silver],["black",2,colors.black]
];

const tol5=[
["gold",0,colors.gold],["silver",1,colors.silver],["black",2,colors.black],
["brown",3,colors.brown],["red",4,colors.red],["orange",5,colors.orange],
["yellow",6,colors.yellow]
];

const tolerance=[" ±5%"," ±10%"," ±20%"," ±1%"," ±2%"," ±3%"," ±4%","","",""];
const multiplier=[0,1,2,3,4,-1,-2];

let state={mode:4,d1:0,d2:0,m:0,t:0};
let btns={},activeData=[],activeKey="";

function makeBtn(id,key,name){
let b=document.createElement("div");
b.className="pick-btn";
b.onclick=function(){openPicker(getData(key),key,name)};
document.getElementById(id).appendChild(b);
btns[key]=b;
setBtn(getData(key),key);
}

function getData(key){
if(key==="mode")return modes;
if(key==="d1"||key==="d2")return state.mode==5?digitFive:digitNormal;
if(key==="m"){
if(state.mode==5 && (state.d1<0 || state.d2<0)) return multNoGoldSilver;
return multNormal;
}
if(key==="t")return state.mode==5?tol5:tol4;
}

function setBtn(data,key){
let x=data.find(a=>a[1]===state[key])||data[0];
btns[key].innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
}

function openPicker(data,key,name){
activeData=data;activeKey=key;
document.body.classList.add("lock-scroll");
document.getElementById("title").innerText=name;
let wheel=document.getElementById("wheel");
wheel.innerHTML="";
data.forEach(function(x,idx){
let r=document.createElement("div");
r.innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
r.onclick=function(){selectItem(idx)};
wheel.appendChild(r);
});
document.getElementById("mask").style.display="block";
let current=data.findIndex(x=>x[1]===state[key]);
setTimeout(function(){wheel.scrollTop=(current<0?0:current)*42},30);
}

function selectItem(idx){
let x=activeData[idx];
state[activeKey]=x[1];

if(activeKey==="mode"){
state.d1=0;
state.d2=0;
state.m=0;
state.t=0;
}

if((activeKey==="d1"||activeKey==="d2") && state.mode==5){
let allowed=getData("m");
if(!allowed.some(a=>a[1]===state.m)) state.m=0;
}

refreshBtns();
calc();
closePicker();
}

function closePicker(){
document.body.classList.remove("lock-scroll");
document.getElementById("mask").style.display="none";
}

document.getElementById("mask").onclick=function(e){
if(e.target.id==="mask")closePicker();
};

makeBtn("modeBox","mode","Band Mode");
makeBtn("d1Box","d1","First");
makeBtn("d2Box","d2","Second");
makeBtn("mBox","m","Multiplier");
makeBtn("tBox","t","Tolerance");

function refreshBtns(){
["mode","d1","d2","m","t"].forEach(k=>setBtn(getData(k),k));
}

function formatValue(dig){
let value=Math.round(dig*100)/100;
if(value>=1000){
value/=1000;
return value+" mH";
}
return value+" µH";
}

function getColor(data,val){
let x=data.find(a=>a[1]===val);
return x?x[2]:"transparent";
}

function calc(){
let variant=state.mode;
let value=0,t;

if(variant==3 || variant==4){
let d1=state.d1;
let d2=state.d2;
t=variant==3?2:state.t;
value=(d1*10)+d2;
value=eval(""+value+"e"+multiplier[state.m]);
}

if(variant==5){
let d1=state.d1;
let d2=state.d2;
t=state.t;

if(!((d1<0)||(d2<0))){
value=(d1*10)+d2;
value=eval(""+value+"e"+multiplier[state.m]);
}
else if((d1<0)&&(d2>=0)){
d1=state.d2;
d2=state.m;
value=0.1*d1+0.01*d2;
}
else if((d1>=0)&&(d2<0)){
d1=state.d1;
d2=state.m;
value=d1+0.1*d2;
}
}

document.getElementById("result").innerHTML=formatValue(value)+", "+tolerance[t];

document.getElementById("boxT").style.display=(variant==3)?"none":"block";

if(variant==5){
document.getElementById("lab1").innerHTML="Second";
document.getElementById("lab2").innerHTML="Third";
document.getElementById("labM").innerHTML="Forth";
document.getElementById("labT").innerHTML="Fifth";

document.getElementById("band0").style.background=colors.silver;
document.getElementById("band0").style.display="block";
document.getElementById("band1").style.background=getColor(digitFive,state.d1);
document.getElementById("band2").style.background=getColor(digitFive,state.d2);
document.getElementById("band3").style.background=getColor(getData("m"),state.m);
document.getElementById("band4").style.background=getColor(tol5,state.t);
}
else{
document.getElementById("lab1").innerHTML="First";
document.getElementById("lab2").innerHTML="Second";
document.getElementById("labM").innerHTML="Third";
document.getElementById("labT").innerHTML="Forth";

document.getElementById("band0").style.display="none";
document.getElementById("band1").style.background=getColor(digitNormal,state.d1);
document.getElementById("band2").style.background=getColor(digitNormal,state.d2);
document.getElementById("band3").style.background=getColor(multNormal,state.m);
document.getElementById("band4").style.background=variant==4?getColor(tol4,state.t):"transparent";
}

refreshBtns();
}

calc();
</script>

</body>
</html>
