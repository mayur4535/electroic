<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;padding:20px;background:#fff;color:#123}
.wrap{max-width:1000px;margin:auto;text-align:center}
.top{max-width:220px;margin:0 auto 22px;text-align:left}
.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-bottom:18px;text-align:left}
.lbl{font-size:14px;margin-bottom:5px}
.result{font-size:20px;font-weight:bold;margin:10px 0 15px}

.picker{position:relative}
.pick-btn{
width:100%;height:42px;border:1px solid #8fa3bd;border-radius:8px;
font-size:16px;font-weight:bold;text-align:left;padding:6px 35px 6px 12px;
background:linear-gradient(#f8fbff,#c6d2e2 48%,#aebcd0 50%,#eef3fa);
box-shadow:inset 0 1px 0 #fff,0 1px 3px #999;cursor:pointer
}
.pick-btn:after{content:"⌄";position:absolute;right:12px}
.list{
display:none;position:absolute;z-index:99;top:46px;left:0;right:0;
background:linear-gradient(#f9f9f9,#dce3ef);border:1px solid #777;
border-radius:8px;box-shadow:0 8px 20px #777;max-height:230px;overflow:auto
}
.item{padding:9px 12px;font-weight:bold;cursor:pointer}
.item:hover{background:#9fb3d5}
.sw{display:inline-block;width:18px;height:18px;border:1px solid #888;margin-right:8px;vertical-align:middle}

.resistor{position:relative;width:90%;height:200px;margin:auto}
.wire{position:absolute;top:80px;width:100%;height:40px;background:#888}
.body{position:absolute;top:0;left:7%;right:7%;height:200px}
.cap{position:absolute;width:25%;height:200px;background:#d8d8d8;border-radius:25px}
.cap.left{left:0}.cap.right{right:0}
.mid{position:absolute;top:22px;left:23%;right:23%;height:156px;background:#d8d8d8}
.band{position:absolute;width:6%}
#band1{left:16%;height:200px}
#band2{left:28%;top:22px;height:156px}
#band3{left:40%;top:22px;height:156px}
#band4{left:52%;top:22px;height:156px}
#band5{right:18%;height:200px}
#band6{right:10%;height:200px}

@media(max-width:700px){
body{padding:12px}.controls{grid-template-columns:1fr}.resistor{height:130px;width:100%}
.wire{top:50px;height:25px}.body{height:130px}.cap{height:130px}
.mid{top:12px;height:100px}.band{height:130px}
#band2,#band3,#band4{top:12px;height:100px}
}
</style>
</head>
<body>

<div class="wrap">
<div class="top">
<div class="lbl">SELECT BAND</div>
<div id="modeBox"></div>
</div>

<div class="controls">
<div id="box1"><div class="lbl">1st Digit</div><div id="d1Box"></div></div>
<div id="box2"><div class="lbl">2nd Digit</div><div id="d2Box"></div></div>
<div id="box3"><div class="lbl">3rd Digit</div><div id="d3Box"></div></div>
<div id="boxM"><div class="lbl">Multiplier</div><div id="mBox"></div></div>
<div id="boxT"><div class="lbl">Tolerance</div><div id="tBox"></div></div>
<div id="boxC"><div class="lbl">Temp. Coeff.</div><div id="cBox"></div></div>
</div>

<div class="result" id="result"></div>

<div class="resistor">
<div class="wire"></div><div class="body">
<div class="mid"></div><div class="cap left"></div><div class="cap right"></div>
<div class="band" id="band1"></div><div class="band" id="band2"></div>
<div class="band" id="band3"></div><div class="band" id="band4"></div>
<div class="band" id="band5"></div><div class="band" id="band6"></div>
</div></div>
</div>

<script>
const digit=[["black",0,"#000"],["brown",1,"brown"],["red",2,"red"],["orange",3,"orange"],["yellow",4,"yellow"],["green",5,"green"],["blue",6,"blue"],["violet",7,"violet"],["gray",8,"gray"],["white",9,"white"]];
const multi=[...digit.map(x=>[x[0],Math.pow(10,x[1]),x[2]]),["gold",0.1,"gold"],["silver",0.01,"silver"]];
const tol=[["brown",1,"brown"],["red",2,"red"],["green",0.5,"green"],["blue",0.25,"blue"],["violet",0.1,"violet"],["gray",0.05,"gray"],["gold",5,"gold"],["silver",10,"silver"]];
const temp=[["brown",100,"brown"],["red",50,"red"],["orange",15,"orange"],["yellow",25,"yellow"],["blue",10,"blue"],["violet",5,"violet"]];
const modes=[["3 BAND",3,"#ddd"],["4 BAND",4,"#ddd"],["5 BAND",5,"#ddd"],["6 BAND",6,"#ddd"]];
let state={mode:4,d1:1,d2:0,d3:0,m:1,t:10,c:100};

function picker(id,data,key){
let box=document.getElementById(id),btn=document.createElement("button"),list=document.createElement("div");
btn.className="pick-btn"; list.className="list"; box.className="picker";
data.forEach(x=>{let it=document.createElement("div");it.className="item";it.innerHTML=`<span class="sw" style="background:${x[2]}"></span>${x[0]}`;it.onclick=()=>{state[key]=x[1];btn.innerHTML=`<span class="sw" style="background:${x[2]}"></span>${x[0]}`;list.style.display="none";calc()};list.appendChild(it)});
btn.onclick=e=>{e.stopPropagation();document.querySelectorAll(".list").forEach(l=>l.style.display="none");list.style.display="block"};
box.append(btn,list);
let def=data.find(x=>x[1]==state[key])||data[0];btn.innerHTML=`<span class="sw" style="background:${def[2]}"></span>${def[0]}`;
}
picker("modeBox",modes,"mode");picker("d1Box",digit,"d1");picker("d2Box",digit,"d2");picker("d3Box",digit,"d3");
picker("mBox",multi,"m");picker("tBox",tol,"t");picker("cBox",temp,"c");
document.body.onclick=()=>document.querySelectorAll(".list").forEach(l=>l.style.display="none");

function col(data,val){return (data.find(x=>x[1]==val)||data[0])[2]}
function ohm(v){if(v>=1e9)return +(v/1e9).toFixed(4)+" GΩ";if(v>=1e6)return +(v/1e6).toFixed(4)+" MΩ";if(v>=1e3)return +(v/1e3).toFixed(4)+" kΩ";return +v.toFixed(4)+" Ω"}

function calc(){
let mode=state.mode;
box3.style.display=(mode>=5)?"block":"none";
boxT.style.display=(mode>=4)?"block":"none";
boxC.style.display=(mode==6)?"block":"none";

let val=(mode>=5?(state.d1*100+state.d2*10+state.d3):(state.d1*10+state.d2))*state.m;
result.innerHTML="Resistance: "+ohm(val)+(mode>=4?" ± "+state.t+"%":"")+(mode==6?" "+state.c+" ppm/°C":"");

band1.style.background=col(digit,state.d1);
band2.style.background=col(digit,state.d2);
band3.style.background=mode>=5?col(digit,state.d3):col(multi,state.m);
band4.style.background=mode>=5?col(multi,state.m):"transparent";
band5.style.background=mode>=4?col(tol,state.t):"transparent";
band6.style.background=mode==6?col(temp,state.c):"transparent";
}
calc();
</script>
</body>
</html>
