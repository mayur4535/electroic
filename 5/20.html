<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#fff;
text-align:center;
}

.wrap{
max-width:460px;
margin:18px auto;
padding:8px;
}

.cap-box{
position:relative;
max-width:380px;
height:230px;
margin:auto;
}

.terminal{
position:absolute;
top:76px;
width:12px;
height:96px;
background:linear-gradient(90deg,#444,#e4e4ef,#777);
border:1.5px solid #111;
}

.terminal.left{left:0}
.terminal.right{right:0}

.cap-main{
position:absolute;
left:12px;
right:12px;
top:42px;
height:148px;
background:#f4b847;
border:2px solid #111;
box-shadow:
inset 0 11px 0 rgba(255,215,105,.7),
inset 0 -13px 0 rgba(105,70,0,.4);
}

.cap-main:before{
content:"";
position:absolute;
left:-2px;right:-2px;top:-18px;height:18px;
background:linear-gradient(#d99400,#ffd05a,#d99400);
border:2px solid #111;border-bottom:0;
}

.cap-main:after{
content:"";
position:absolute;
left:-2px;right:-2px;bottom:-18px;height:18px;
background:linear-gradient(#654200,#d99d21,#654200);
border:2px solid #111;border-top:0;
}

.polarity{
position:absolute;
left:13px;
top:42px;
width:42px;
height:148px;
background:#b96312;
border-right:2px solid #111;
}

/* CENTER INPUT GROUP */
.input-group{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
align-items:center;
gap:18px;
z-index:20;
}

.voltage-select{
width:70px;
height:52px;
font-size:28px;
font-weight:bold;
text-align:center;
background:rgba(255,255,255,.25);
border:1px solid #333;
outline:none;
}

.code-input{
width:120px;
height:52px;
font-size:36px;
font-weight:bold;
text-align:center;
background:rgba(255,255,255,.25);
border:1px solid #333;
outline:none;
}

.result{
margin:18px auto 0;
border:2px solid #73AD21;
border-radius:20px;
padding:10px;
width:240px;
font-size:30px;
font-weight:bold;
}

.voltage-result{
font-size:18px;
margin-top:4px;
}

@media(max-width:600px){
.cap-box{
max-width:320px;
height:200px;
}

.input-group{
gap:14px;
}

.voltage-select{
width:62px;
height:46px;
font-size:24px;
}

.code-input{
width:105px;
height:46px;
font-size:30px;
}

.result{
font-size:26px;
width:220px;
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="cap-box">

<div class="terminal left"></div>
<div class="terminal right"></div>

<div class="cap-main"></div>
<div class="polarity"></div>

<div class="input-group">

<select id="tolcode" class="voltage-select">
<option value="A">e</option>
<option value="B">G</option>
<option value="C">J</option>
<option value="D">A</option>
<option value="F">C</option>
<option value="G">D</option>
<option selected value="H">E</option>
<option value="J">V</option>
<option value="K">H</option>
</select>

<input id="capcode" class="code-input" maxlength="3" placeholder="103" autocomplete="off" spellcheck="false">

</div>

</div>

<div class="result">
<div id="capacitance">---</div>
<div id="tolerance" class="voltage-result">16V</div>
</div>

</div>

<script>
let tolval=[
"2.5V",
"4V",
"6.3V",
"10V",
"16V",
"20V",
"25V",
"35V",
"50V"
];

let codeBox=document.getElementById("capcode");
let tolBox=document.getElementById("tolcode");

codeBox.addEventListener("input",calc);
tolBox.addEventListener("change",calc);

function calc(){
let v=codeBox.value.trim();

if(v.length===3 && /^[0-9]{3}$/.test(v)){
let value=parseInt(v.slice(0,2))*Math.pow(10,parseInt(v.slice(2)));
document.getElementById("capacitance").innerHTML=format(value);
}else{
document.getElementById("capacitance").innerHTML="---";
}

document.getElementById("tolerance").innerHTML=tolval[tolBox.selectedIndex] || "---";
}

function format(v){
if(v<1000)return v+" pF";
if(v<1000000)return (v/1000)+" nF";
return (v/1000000)+" µF";
}

calc();
</script>

</body>
</html>
