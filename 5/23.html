<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diode Calculator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial;
  background:#fff;
  color:#102033;
  padding:18px 22px;
}

.app{
  max-width:860px;
  margin:auto;
  padding:0 14px;
}

.label{font-size:14px;margin-bottom:6px}
.top{max-width:280px;margin:0 auto 22px}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  width:100%;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:480px){
  body{padding:18px 18px}
  .app{padding:0 12px}
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
}

.ios-btn{
  width:100%;
  min-width:0;
  height:44px;
  border:1px solid #788aa3;
  border-radius:7px;
  background:linear-gradient(#eef6ff,#b9c9dc);
  box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.dot{
  width:17px;
  height:17px;
  border:1px solid #555;
  display:inline-block;
  margin-right:7px;
}

.diode{
  display:flex;
  justify-content:center;
  margin:60px auto;
}

.body{
  width:230px;
  height:72px;
  border-radius:20px;
  position:relative;
  background:linear-gradient(145deg,#9d1f1f,#e95345,#a61e1e);
  box-shadow:
    inset 0 6px 12px rgba(255,255,255,.25),
    inset 0 -6px 12px rgba(0,0,0,.4),
    0 8px 18px rgba(0,0,0,.25);
}

.body:before,.body:after{
  content:"";
  position:absolute;
  top:0;
  width:22px;
  height:72px;
  background:linear-gradient(#ddd,#999);
  border-radius:7px;
}

.body:before{left:0}
.body:after{right:0}

.band{
  position:absolute;
  top:0;
  height:100%;
  width:14px;
}

.result{
  max-width:340px;
  margin:30px auto 0;
  border:3px solid #73AD21;
  border-radius:22px;
  padding:16px;
  font-size:25px;
  font-weight:800;
  text-align:center;
  color:#0b6b18;
  background:#fbfffb;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
  z-index:9999;
}

.overlay.show{display:flex}

.popup{
  width:100%;
  max-width:420px;
  background:#dce5f1;
  border-radius:16px;
  padding:16px 14px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  max-height:90vh;
  overflow:hidden;
}

.popup-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
  margin-bottom:10px;
}

.done{
  border:0;
  background:#007aff;
  color:#fff;
  padding:7px 15px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.list-wrap{
  position:relative;
  height:230px;
  border:1px solid #9aaabe;
  border-radius:12px;
  background:#eaf1fb;
  overflow:hidden;
  margin:8px 6px;
}

.list-wrap::before{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:92px;
  height:46px;
  background:rgba(255,255,255,.72);
  border-top:1px solid rgba(0,0,0,.25);
  border-bottom:1px solid rgba(0,0,0,.25);
  z-index:2;
  pointer-events:none;
}

.list{
  height:230px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  padding-top:92px;
  padding-bottom:92px;
}

.option{
  height:46px;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:22px;
  font-weight:800;
  border-bottom:1px solid #aab8ca;
  cursor:pointer;
  scroll-snap-align:center;
  position:relative;
  z-index:1;
}

.option.active{
  background:rgba(0,122,255,.12);
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="label">Band Mode</div>
    <div class="ios-btn" onclick="openPopup('mode')">
      <span id="modeText">▣ 4 BAND</span><span>v</span>
    </div>
  </div>

  <div class="grid" id="selectors"></div>

  <div class="diode">
    <div class="body" id="diodeBody"></div>
  </div>

  <div class="result" id="resultBox">--</div>

</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-head">
      <span id="popupTitle">Select</span>
      <button class="done" onclick="closePopup()">Done</button>
    </div>

    <div class="list-wrap">
      <div class="list" id="optionList"></div>
    </div>
  </div>
</div>

<script>
const colors={black:"#000",brown:"brown",red:"red",orange:"orange",yellow:"yellow",green:"green",blue:"blue",violet:"violet",grey:"grey",white:"#fff"};

const digit=[
 ["black","0","black"],["brown","1","brown"],["red","2","red"],
 ["orange","3","orange"],["yellow","4","yellow"],["green","5","green"],
 ["blue","6","blue"],["violet","7","violet"],["grey","8","grey"],["white","9","white"]
];

const modes={
 diode4:{
  title:"▣ 4 BAND",
  labels:["First","Second","Third","Forth"],
  bands:[
   [["black","AA","black"],["red","BA","red"]],
   [["black","X","black"],["red","S","red"],["yellow","T","yellow"],["green","V","green"],["blue","W","blue"],["grey","Y","grey"],["white","Z","white"]],
   digit,digit
  ],
  formula:v=>v[0]+v[1]+v[2]+v[3]
 },
 general:{
  title:"▣ GENERAL",
  labels:["Select Colour"],
  bands:[
   [["black","General Purpose","black"],["yellow","Switching","yellow"],["green","Schottkey","green"],["blue","Zener","blue"]]
  ],
  formula:v=>v[0]
 },
 jedec:{
  title:"▣ JEDEC",
  labels:["1","2","3","4","5"],
  bands:[digit,digit,digit,digit,
   [["brown","A","brown"],["red","B","red"],["orange","C","orange"],["yellow","D","yellow"],["green","E","green"],["blue","F","blue"],["violet","G","violet"],["grey","H","grey"],["white","J","white"]]
  ],
  formula:v=>"1N"+v.join("")
 }
};

let current="diode4";
let selected=[];
let active=0;

function html(o){
 return `<span class="dot" style="background:${colors[o[2]]}"></span>${o[0]}`;
}

function render(){
 let m=modes[current];
 selected=m.bands.map(b=>b[0]);
 document.getElementById("modeText").innerHTML=m.title;

 let h="";
 m.bands.forEach((b,i)=>{
  h+=`<div>
    <div class="label">${m.labels[i]}</div>
    <div class="ios-btn" onclick="openPopup('band',${i})">
      <span id="s${i}">${html(selected[i])}</span><span>v</span>
    </div>
  </div>`;
 });

 document.getElementById("selectors").innerHTML=h;
 draw();
 update();
}

function draw(){
 let body=document.getElementById("diodeBody");
 body.innerHTML="";
 selected.forEach((o,i)=>{
  let b=document.createElement("div");
  b.className="band";
  b.style.left=(45+i*30)+"px";
  b.style.background=colors[o[2]];
  body.appendChild(b);
 });
}

function openPopup(type,i=0){
 active=i;
 let list=document.getElementById("optionList");
 list.innerHTML="";

 if(type==="mode"){
  document.getElementById("popupTitle").innerText="Band Mode";
  Object.keys(modes).forEach(k=>{
   list.innerHTML+=`<div class="option ${k===current?'active':''}" onclick="setMode('${k}')">${modes[k].title}</div>`;
  });
 }else{
  document.getElementById("popupTitle").innerText=modes[current].labels[i];
  modes[current].bands[i].forEach((o,x)=>{
   const isActive = selected[i][1] === o[1] ? "active" : "";
   list.innerHTML+=`<div class="option ${isActive}" onclick="setBand(${x})">${html(o)}</div>`;
  });
 }

 document.getElementById("overlay").classList.add("show");

 setTimeout(()=>{
   const activeItem = list.querySelector(".option.active");
   if(activeItem){
     list.scrollTop = activeItem.offsetTop - 92;
   }
 },60);
}

function setMode(m){
 current=m;
 closePopup();
 render();
}

function setBand(i){
 selected[active]=modes[current].bands[active][i];
 document.getElementById("s"+active).innerHTML=html(selected[active]);
 draw();
 update();
 closePopup();
}

function update(){
 let v=selected.map(x=>x[1]);
 document.getElementById("resultBox").innerText=modes[current].formula(v);
}

function closePopup(){
 document.getElementById("overlay").classList.remove("show");
}

document.getElementById("overlay").addEventListener("click",function(e){
 if(e.target.id==="overlay") closePopup();
});

render();
</script>

</body>
</html>
