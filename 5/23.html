<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diode Calculator</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;padding:12px;background:#fff;color:#123}
.wrap{max-width:1000px;margin:auto;text-align:center;padding:0 18px}
.top{max-width:260px;margin:0 auto 18px;text-align:left}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;text-align:left}
.lbl{font-size:14px;margin-bottom:5px;white-space:nowrap}

.pick-btn{
  width:100%;height:44px;border:1px solid #8fa3bd;border-radius:8px;
  font-size:16px;font-weight:bold;padding:6px 35px 6px 12px;
  background:linear-gradient(#f9fcff,#c8d5e6 48%,#a9b9cf 50%,#edf3fb);
  box-shadow:inset 0 1px 0 #fff,0 2px 5px #999;
  position:relative;cursor:pointer;text-align:left;overflow:hidden;white-space:nowrap
}
.pick-btn:after{content:"⌄";position:absolute;right:12px;top:7px;font-size:22px}
.sw{display:inline-block;width:18px;height:18px;border:1px solid #666;margin-right:8px;vertical-align:middle}

.result{
  max-width:360px;margin:22px auto 0;border:3px solid #73AD21;border-radius:22px;
  padding:14px;font-size:24px;font-weight:bold;color:#0b6b18;background:#fbfffb
}

.ios-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.30);z-index:9999;padding:18px}
.ios-picker{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:92%;max-width:420px;background:#d8dee9;border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);padding:12px;z-index:10000
}
.ios-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:bold}
.ios-head button{border:0;background:#0b7cff;color:#fff;padding:7px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.wheel-wrap{position:relative}
.wheel{
  height:210px;overflow-y:auto;border-radius:10px;border:1px solid #8e99aa;
  background:linear-gradient(#eef3fb,#cbd6e7,#eef3fb);
  scroll-snap-type:y mandatory;padding:84px 0;-webkit-overflow-scrolling:touch
}
.wheel::-webkit-scrollbar{width:0}
.wheel div{height:42px;display:flex;align-items:center;padding:0 18px;font-size:22px;font-weight:bold;scroll-snap-align:center;cursor:pointer}
.wheel-highlight{
  position:absolute;left:0;right:0;top:84px;height:42px;
  border-top:1px solid #6f7f98;border-bottom:1px solid #6f7f98;
  background:rgba(255,255,255,.25);pointer-events:none
}

.diode{position:relative;width:320px;height:120px;margin:10px auto 10px}
.diode-body{
  position:absolute;left:35px;right:35px;top:22px;height:76px;border-radius:20px;
  background:linear-gradient(145deg,#9d1f1f,#e95345,#a61e1e);
  box-shadow:inset 0 6px 12px rgba(255,255,255,.25),inset 0 -6px 12px rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.25);
  overflow:hidden
}
.diode-body:before,.diode-body:after{
  content:"";position:absolute;top:0;width:24px;height:76px;background:linear-gradient(#ddd,#999);z-index:5
}
.diode-body:before{left:0}.diode-body:after{right:0}
.band{position:absolute;top:0;width:15px;height:76px;z-index:4}
#band1{left:48px} #band2{left:82px} #band3{left:116px} #band4{left:150px} #band5{left:184px}

@media(max-width:700px){
  .wrap{padding-left:18px;padding-right:18px}
  .controls{grid-template-columns:repeat(2,1fr);gap:14px 12px}
  .lbl{font-size:13px;padding-left:2px}
  .pick-btn{height:42px;font-size:14px;padding-left:10px;padding-right:30px}
  .pick-btn:after{right:9px;top:7px;font-size:20px}
  .result{font-size:20px}
  .diode{width:100%;max-width:320px}
}
</style>
</head>

<body>

<div class="wrap">
  <div class="top">
    <div class="lbl">Band Mode</div>
    <div id="modeBox"></div>
  </div>

  <div class="controls">
    <div id="box1"><div class="lbl" id="lbl1">First</div><div id="b1Box"></div></div>
    <div id="box2"><div class="lbl" id="lbl2">Second</div><div id="b2Box"></div></div>
    <div id="box3"><div class="lbl" id="lbl3">Third</div><div id="b3Box"></div></div>
    <div id="box4"><div class="lbl" id="lbl4">Forth</div><div id="b4Box"></div></div>
    <div id="box5"><div class="lbl" id="lbl5">Fifth</div><div id="b5Box"></div></div>
  </div>

  <div class="diode">
    <div class="diode-body">
      <div class="band" id="band1"></div>
      <div class="band" id="band2"></div>
      <div class="band" id="band3"></div>
      <div class="band" id="band4"></div>
      <div class="band" id="band5"></div>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>

<div class="ios-mask" id="mask">
  <div class="ios-picker">
    <div class="ios-head">
      <span id="title">Select</span>
      <button onclick="closePicker()">Done</button>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-highlight"></div>
      <div class="wheel" id="wheel"></div>
    </div>
  </div>
</div>

<script>
const modeData=[
  ["4 BAND","diode4","#ddd"],
  ["GENERAL DIODE","general","#ddd"],
  ["JEDEC SERIES","jedec","#ddd"]
];

const digit=[
 ["black","0","#000"],["brown","1","brown"],["red","2","red"],["orange","3","orange"],
 ["yellow","4","yellow"],["green","5","green"],["blue","6","blue"],["violet","7","violet"],
 ["grey","8","grey"],["white","9","#fff"]
];

const first4=[
 ["black","AA","#000"],
 ["red","BA","red"]
];

const second4=[
 ["black","X","#000"],
 ["red","S","red"],
 ["yellow","T","yellow"],
 ["green","V","green"],
 ["blue","W","blue"],
 ["grey","Y","grey"],
 ["white","Z","#fff"]
];

const general=[
 ["black","General Purpose","#000"],
 ["yellow","Switching","yellow"],
 ["green","Schottkey","green"],
 ["blue","Zener","blue"]
];

const jedec5=[
 ["brown","A","brown"],["red","B","red"],["orange","C","orange"],
 ["yellow","D","yellow"],["green","E","green"],["blue","F","blue"],
 ["violet","G","violet"],["grey","H","grey"],["white","J","#fff"]
];

let state={mode:"diode4",b1:"AA",b2:"X",b3:"0",b4:"0",b5:"A"};
let btns={}, activeData=[], activeKey="";

function makeBtn(id,data,key,name){
  let b=document.createElement("div");
  b.className="pick-btn";
  b.onclick=function(){openPicker(data,key,name)};
  document.getElementById(id).appendChild(b);
  btns[key]=b;
  setBtn(data,key);
}

function setBtn(data,key){
  let x=data.find(a=>a[1]==state[key]) || data[0];
  btns[key].innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
}

function openPicker(data,key,name){
  activeData=data;
  activeKey=key;
  document.getElementById("title").innerText=name;

  let wheel=document.getElementById("wheel");
  wheel.innerHTML="";

  data.forEach(function(x,idx){
    let r=document.createElement("div");
    r.innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
    r.onclick=function(){selectItem(idx)};
    wheel.appendChild(r);
  });

  document.getElementById("mask").style.display="block";
  let current=data.findIndex(x=>x[1]==state[key]);
  setTimeout(function(){ wheel.scrollTop=(current<0?0:current)*42; },30);
}

function selectItem(idx){
  let x=activeData[idx];
  state[activeKey]=x[1];
  setBtn(activeData,activeKey);
  calc();
  closePicker();
}

function closePicker(){
  document.getElementById("mask").style.display="none";
}

document.getElementById("mask").onclick=function(e){
  if(e.target.id==="mask")closePicker();
};

function colorOf(data,val){
  return (data.find(x=>x[1]==val)||data[0])[2];
}

makeBtn("modeBox",modeData,"mode","Band Mode");
makeBtn("b1Box",first4,"b1","First");
makeBtn("b2Box",second4,"b2","Second");
makeBtn("b3Box",digit,"b3","Third");
makeBtn("b4Box",digit,"b4","Forth");
makeBtn("b5Box",jedec5,"b5","Fifth");

function setControlsForMode(){
  let mode=state.mode;

  box1.style.display="block";
  box2.style.display=mode==="general"?"none":"block";
  box3.style.display=mode==="general"?"none":"block";
  box4.style.display=mode==="general"?"none":"block";
  box5.style.display=mode==="jedec"?"block":"none";

  if(mode==="general"){
    lbl1.innerText="Select Colour";
    btns.b1.onclick=function(){openPicker(general,"b1","Select Colour")};
    if(!general.find(x=>x[1]===state.b1)) state.b1="General Purpose";
    setBtn(general,"b1");
  }

  if(mode==="diode4"){
    lbl1.innerText="First"; lbl2.innerText="Second"; lbl3.innerText="Third"; lbl4.innerText="Forth";
    btns.b1.onclick=function(){openPicker(first4,"b1","First")};
    btns.b2.onclick=function(){openPicker(second4,"b2","Second")};
    btns.b3.onclick=function(){openPicker(digit,"b3","Third")};
    btns.b4.onclick=function(){openPicker(digit,"b4","Forth")};

    if(!first4.find(x=>x[1]===state.b1)) state.b1="AA";
    if(!second4.find(x=>x[1]===state.b2)) state.b2="X";
    if(!digit.find(x=>x[1]===state.b3)) state.b3="0";
    if(!digit.find(x=>x[1]===state.b4)) state.b4="0";

    setBtn(first4,"b1"); setBtn(second4,"b2"); setBtn(digit,"b3"); setBtn(digit,"b4");
  }

  if(mode==="jedec"){
    lbl1.innerText="1 Band"; lbl2.innerText="2 Band"; lbl3.innerText="3 Band"; lbl4.innerText="4 Band"; lbl5.innerText="5 Band";
    btns.b1.onclick=function(){openPicker(digit,"b1","1 Band")};
    btns.b2.onclick=function(){openPicker(digit,"b2","2 Band")};
    btns.b3.onclick=function(){openPicker(digit,"b3","3 Band")};
    btns.b4.onclick=function(){openPicker(digit,"b4","4 Band")};
    btns.b5.onclick=function(){openPicker(jedec5,"b5","5 Band")};

    if(!digit.find(x=>x[1]===state.b1)) state.b1="0";
    if(!digit.find(x=>x[1]===state.b2)) state.b2="0";
    if(!digit.find(x=>x[1]===state.b3)) state.b3="0";
    if(!digit.find(x=>x[1]===state.b4)) state.b4="0";
    if(!jedec5.find(x=>x[1]===state.b5)) state.b5="A";

    setBtn(digit,"b1"); setBtn(digit,"b2"); setBtn(digit,"b3"); setBtn(digit,"b4"); setBtn(jedec5,"b5");
  }
}

function clearBands(){
  [band1,band2,band3,band4,band5].forEach(b=>b.style.background="transparent");
}

function calc(){
  setBtn(modeData,"mode");
  setControlsForMode();
  clearBands();

  if(state.mode==="diode4"){
    result.innerText=state.b1+state.b2+state.b3+state.b4;
    band1.style.background=colorOf(first4,state.b1);
    band2.style.background=colorOf(second4,state.b2);
    band3.style.background=colorOf(digit,state.b3);
    band4.style.background=colorOf(digit,state.b4);
  }

  if(state.mode==="general"){
    result.innerText=state.b1;
    band1.style.background=colorOf(general,state.b1);
  }

  if(state.mode==="jedec"){
    result.innerText="1N"+state.b1+state.b2+state.b3+state.b4+state.b5;
    band1.style.background=colorOf(digit,state.b1);
    band2.style.background=colorOf(digit,state.b2);
    band3.style.background=colorOf(digit,state.b3);
    band4.style.background=colorOf(digit,state.b4);
    band5.style.background=colorOf(jedec5,state.b5);
  }
}

calc();
</script>
</body>
</html>
