<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial, sans-serif;
background:#fff;
text-align:center;
}

/* ✅ TOP MARGIN EXACT 10px */
.smd-wrap{
width:100%;
max-width:520px; /* reduced */
margin:10px auto 0;
padding:8px 10px;
}

/* IMAGE BOX */
.smd-box{
position:relative;
width:100%;
max-width:340px; /* ~20% smaller */
margin:8px auto;
}

.smd-box img{
width:100%;
display:block;
}

/* INPUT (20% smaller) */
.SMDtexto{
position:absolute;
left:50%;
top:48%;
transform:translate(-50%,-50%);
width:42%;
height:22%;
font-size:clamp(22px, 7vw, 48px); /* reduced */
text-align:center;
color:white;
background:#2b2b2b;
border:0;
outline:0;
font-weight:bold;
}

/* OUTPUT (20% smaller) */
.outSMD{
margin:12px auto 0;
border-radius:16px;
text-align:center;
font-size:clamp(18px, 5.5vw, 30px);
border:5px solid #73AD21;
padding:6px 14px;
width:min(85%, 220px);
font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){
.smd-wrap{padding:6px 8px}
.smd-box{max-width:300px}

.SMDtexto{
font-size:clamp(20px,6vw,36px);
}

.outSMD{
font-size:clamp(16px,5vw,26px);
border-width:4px;
}
}
</style>
</head>

<body>

<div class="smd-wrap">

<div class="smd-box">
<img src="https://ik.imagekit.io/mak/color_code/smd_resistor_NH-x_6o2V0.png">

<input 
type="text" 
class="SMDtexto" 
id="code" 
value="000" 
maxlength="4"
autocomplete="off"
>
</div>

<div class="outSMD" id="result">RES</div>

</div>

<script>
let input=document.getElementById("code");

/* CLEAR 000 */
input.addEventListener("focus",function(){
if(this.value==="000"){this.value="";}
});

/* RESTORE */
input.addEventListener("blur",function(){
if(this.value===""){
this.value="000";
calc();
}
});

/* CALC */
function calc(){
let code=input.value.trim();
let out=document.getElementById("result");

if(code===""){
out.innerHTML="RES";
return;
}

if(!/^[0-9]{3,4}$/.test(code)){
out.innerHTML="Invalid";
return;
}

let value;

if(code.length===3){
value=parseInt(code.slice(0,2))*Math.pow(10,parseInt(code[2]));
}

if(code.length===4){
value=parseInt(code.slice(0,3))*Math.pow(10,parseInt(code[3]));
}

if(value>=1e6){
out.innerHTML=(value/1e6).toFixed(2)+" MΩ";
}
else if(value>=1e3){
out.innerHTML=(value/1e3).toFixed(2)+" kΩ";
}
else{
out.innerHTML=value+" Ω";
}
}

input.addEventListener("input",calc);
calc();
</script>

</body>
</html>
