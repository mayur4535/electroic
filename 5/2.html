<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial, sans-serif;
background:#fff;
text-align:center;
}

.smd-wrap{
width:100%;
max-width:650px;
margin:0 auto;
padding:20px 12px;
position:relative;
}

.smd-box{
position:relative;
width:100%;
max-width:430px;
margin:20px auto;
}

.smd-box img{
width:100%;
height:auto;
display:block;
}

.SMDtexto{
position:absolute;
left:50%;
top:48%;
transform:translate(-50%,-50%);
width:42%;
height:22%;
font-size:clamp(34px, 10vw, 90px);
text-align:center;
color:white;
background:#2b2b2b;
border:0;
outline:0;
font-weight:bold;
}

.outSMD{
margin:25px auto 0;
border-radius:25px;
text-align:center;
font-size:clamp(26px, 8vw, 55px);
border:8px solid #73AD21;
padding:10px 25px;
width:min(90%, 320px);
font-weight:bold;
}

@media(max-width:600px){
.smd-wrap{padding:12px 8px}
.smd-box{max-width:360px}
.outSMD{
border-width:6px;
border-radius:20px;
}
}
</style>
</head>

<body>

<div class="smd-wrap">

<div class="smd-box">
<img src="https://ik.imagekit.io/mak/color_code/smd_resistor_NH-x_6o2V0.png">

<input 
type="text" 
class="SMDtexto" 
id="code" 
value="000" 
maxlength="4"
autocomplete="off"
>
</div>

<div class="outSMD" id="result">RES</div>

</div>

<script>
let input=document.getElementById("code");

/* ✅ AUTO CLEAR ON CLICK */
input.addEventListener("focus",function(){
if(this.value==="000"){
this.value="";
}
});

/* OPTIONAL: restore if empty */
input.addEventListener("blur",function(){
if(this.value===""){
this.value="000";
calc();
}
});

/* CALC */
function calc(){
let code=input.value.trim();
let out=document.getElementById("result");

if(code===""){
out.innerHTML="RES";
return;
}

if(!/^[0-9]{3,4}$/.test(code)){
out.innerHTML="Invalid";
return;
}

let value;

if(code.length===3){
let base=parseInt(code.slice(0,2));
let mul=parseInt(code[2]);
value=base*Math.pow(10,mul);
}

if(code.length===4){
let base=parseInt(code.slice(0,3));
let mul=parseInt(code[3]);
value=base*Math.pow(10,mul);
}

if(value>=1e6){
out.innerHTML=(value/1e6).toFixed(2)+" MΩ";
}
else if(value>=1e3){
out.innerHTML=(value/1e3).toFixed(2)+" kΩ";
}
else{
out.innerHTML=value+" Ω";
}
}

input.addEventListener("input",calc);

calc();
</script>

</body>
</html>
