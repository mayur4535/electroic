<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial, sans-serif;
background:#fff;
text-align:center;
}

.smd-wrap{
width:100%;
max-width:650px;
margin:0 auto;
padding:20px 12px;
position:relative;
}

.smd-box{
position:relative;
width:100%;
max-width:430px;
margin:20px auto;
}

.smd-box img{
width:100%;
height:auto;
display:block;
}

.SMDtexto{
position:absolute;
left:50%;
top:48%;
transform:translate(-50%,-50%);
width:42%;
height:22%;
font-size:clamp(38px, 11vw, 100px);
text-align:center;
color:white;
background:#2b2b2b;
border:0;
outline:0;
font-weight:bold;
}

.outSMD{
margin:28px auto 0;
border-radius:28px;
text-align:center;
font-size:clamp(30px, 9vw, 60px);
border:8px solid #73AD21;
padding:14px 28px;
width:min(95%, 350px);
font-weight:bold;
}

@media(max-width:600px){
.smd-wrap{padding:12px 8px}
.smd-box{max-width:360px}

.outSMD{
border-width:6px;
border-radius:22px;
padding:12px 20px;
}
}
</style>
</head>

<body>

<div class="smd-wrap">

<div class="smd-box">
<img src="https://ik.imagekit.io/mak/color_code/smd_resistor_NH-x_6o2V0.png" alt="SMD Resistor">
<input type="text" class="SMDtexto" id="code" value="000" maxlength="4" autocomplete="off" spellcheck="false">
</div>

<div class="outSMD" id="result">RES</div>

</div>

<script>
let codeBox=document.getElementById("code");
let out=document.getElementById("result");

/* ✅ CLICK / TAP ON 000 = CLEAR */
codeBox.addEventListener("focus",function(){
if(codeBox.value==="000"){
codeBox.value="";
out.innerHTML="RES";
}
});

codeBox.addEventListener("click",function(){
if(codeBox.value==="000"){
codeBox.value="";
out.innerHTML="RES";
}
});

function calc(){
let code=codeBox.value.trim().toUpperCase();

if(code==="" || code==="000"){
out.innerHTML="RES";
return;
}

if(!/^[0-9]{3,4}$/.test(code)){
out.innerHTML="Invalid";
return;
}

let value;

if(code.length===3){
let base=parseInt(code.substring(0,2));
let mul=parseInt(code.substring(2,3));
value=base*Math.pow(10,mul);
}

if(code.length===4){
let base=parseInt(code.substring(0,3));
let mul=parseInt(code.substring(3,4));
value=base*Math.pow(10,mul);
}

if(value>=1000000){
out.innerHTML=(value/1000000).toFixed(2)+" MΩ";
}
else if(value>=1000){
out.innerHTML=(value/1000).toFixed(2)+" kΩ";
}
else{
out.innerHTML=value+" Ω";
}
}

codeBox.addEventListener("input",calc);
calc();
</script>

</body>
</html>
