<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial, sans-serif;
background:#fff;
text-align:center;
}

/* TOP MARGIN 40% */
.smd-wrap{
width:100%;
max-width:520px;
margin:0 auto;
padding:18px 6px;
}

.smd-box{
position:relative;
width:100%;
max-width:280px;
height:280px;
margin:16px auto 0;
display:flex;
align-items:center;
justify-content:center;
}

.inductor-ui{
position:relative;
width:100%;
height:100%;
background:#9a9aa6;
border-radius:22%;
box-shadow:
inset 0 0 0 1px #111,
0 8px 18px rgba(0,0,0,.35);
}

.pad{
position:absolute;
width:26%;
height:18%;
background:#111;
border-radius:50%;
box-shadow:
inset 0 4px 8px rgba(255,255,255,.18),
inset 0 -5px 8px rgba(0,0,0,.8);
z-index:1;
}

.p1{top:12%;left:11%}
.p2{top:12%;right:11%}
.p3{bottom:12%;left:11%}
.p4{bottom:12%;right:11%}

.coil-outer{
position:absolute;
left:15%;
top:15%;
width:70%;
height:70%;
border-radius:50%;
background:#1d1d22;
box-shadow:
0 3px 8px rgba(0,0,0,.7),
inset 0 0 0 2px #050505;
z-index:2;
}

.coil-mid{
position:absolute;
left:20%;
top:20%;
width:60%;
height:60%;
border-radius:50%;
background:#dcdce4;
box-shadow:inset 0 0 0 2px #222;
z-index:3;
}

.coil-inner{
position:absolute;
left:24%;
top:24%;
width:52%;
height:52%;
border-radius:50%;
background:#9d9da9;
box-shadow:inset 0 0 0 1px #111;
z-index:4;
}

.gap{
position:absolute;
left:14%;
top:47%;
width:8%;
height:5%;
background:#9a9aa6;
border:1px solid #111;
z-index:5;
}

/* INPUT FIXED */
.SMDtexto{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:42%;
height:22%;
font-size:clamp(24px,8vw,38px);
text-align:center;
color:#fff;
background:#2d2d34;
border:0;
outline:0;
font-weight:bold;
border-radius:8px;
z-index:50;
pointer-events:auto;
}

.outSMD{
margin:14px auto 0;
border-radius:22px;
text-align:center;
font-size:clamp(22px,7vw,36px);
border:2px solid #73AD21;
padding:7px 20px;
width:min(88%,220px);
font-weight:bold;
}

.formula{
margin-top:14px;
font-size:13px;
font-weight:bold;
line-height:1.5;
color:#333;
}

@media(max-width:600px){
.smd-box{
max-width:245px;
height:245px;
margin:12px auto 0;
}

.outSMD{
font-size:clamp(22px,7.5vw,34px);
width:min(90%,210px);
}
}
</style>
</head>

<body>

<div class="smd-wrap">

<div class="smd-box">
<div class="inductor-ui">
<div class="pad p1"></div>
<div class="pad p2"></div>
<div class="pad p3"></div>
<div class="pad p4"></div>
<div class="coil-outer"></div>
<div class="coil-mid"></div>
<div class="coil-inner"></div>
<div class="gap"></div>

<input type="text" class="SMDtexto" id="code" value="0000" maxlength="4" autocomplete="off" spellcheck="false">
</div>
</div>

<div class="outSMD" id="result">RES</div>

<div class="formula">
3 digit: AB × 10<sup>C</sup> µH<br>
4 digit: ABC × 10<sup>D</sup> µH<br>
R = decimal point
</div>

</div>

<script>
let codeBox=document.getElementById("code");
let result=document.getElementById("result");

let ohm="H";
let unit="";
let unit1="µH";

codeBox.addEventListener("click",function(){
if(codeBox.value==="0000"){
codeBox.value="";
result.innerHTML="RES";
}
});

codeBox.addEventListener("focus",function(){
if(codeBox.value==="0000"){
codeBox.value="";
result.innerHTML="RES";
}
});

codeBox.addEventListener("input",calc);
codeBox.addEventListener("keyup",calc);
codeBox.addEventListener("change",calc);

function calc(){
let v=codeBox.value.trim();

if(v==="" || v==="0000"){
result.innerHTML="RES";
return;
}

if(v.search(/([^0-9,rR])/i)>=0){
result.innerHTML='<font color="red">Err.</font>';
return;
}

let len=v.length;
let upper=v.toUpperCase();

if(len===3){
if(upper.indexOf("R")!==-1){
let pos=upper.indexOf("R");

if(pos===0){
result.innerHTML=upper.replace("R","0.")+ohm;
}
else if(pos===1){
result.innerHTML=upper.replace("R",".")+unit1;
}
else{
result.innerHTML='<font color="red">Err.</font>';
}
}
else{
let first=parseInt(parseInt(v).toString(10).slice(0,2));
let last=parseInt(parseInt(v).toString(10).slice(2));
let res=first*Math.pow(10,last);
result.innerHTML=formatValue(res);
}
}
else if(len===4){
if(upper.indexOf("R")!==-1){
let pos=upper.indexOf("R");

if(pos===0){
result.innerHTML=upper.replace("R","0.")+ohm;
}
else if(pos===1 || pos===2){
result.innerHTML=upper.replace("R",".")+ohm;
}
else{
result.innerHTML='<font color="red">Err.</font>';
}
}
else{
let first=parseInt(parseInt(v).toString(10).slice(0,3));
let last=parseInt(parseInt(v).toString(10).slice(3));
let res=first*Math.pow(10,last);
result.innerHTML=formatValue(res);
}
}
else if(len>4){
result.innerHTML='<font color="red">error</font>';
}
else{
result.innerHTML="Cal.";
}
}

function formatValue(res){
if(res>999999999){
res=res/1000000000;
unit="N"+ohm;
}
else if(res<999999999 && res>999999){
res=res/1000000;
unit="µ"+ohm;
}
else if(res<999999 && res>999){
res=res/1000;
unit="m"+ohm;
}
else{
unit=unit1;
}

return res+unit;
}

calc();
</script>

</body>
</html>
