<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;padding:12px;background:#fff;color:#123}
.wrap{max-width:1000px;margin:auto;text-align:center;padding:0 10px}

.top{max-width:260px;margin:0 auto 18px;text-align:left}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;text-align:left}
.lbl{font-size:14px;margin-bottom:5px;white-space:nowrap}

.pick-btn{
  width:100%;height:44px;border:1px solid #8fa3bd;border-radius:8px;
  font-size:16px;font-weight:bold;padding:6px 35px 6px 12px;
  background:linear-gradient(#f9fcff,#c8d5e6 48%,#a9b9cf 50%,#edf3fb);
  box-shadow:inset 0 1px 0 #fff,0 2px 5px #999;
  position:relative;cursor:pointer;text-align:left;overflow:hidden;white-space:nowrap;
}
.pick-btn:after{content:"⌄";position:absolute;right:12px;top:7px;font-size:22px}
.sw{display:inline-block;width:18px;height:18px;border:1px solid #666;margin-right:8px;vertical-align:middle}

.result{
  font-size:20px;font-weight:bold;margin:10px 0 16px;color:#0f8f55;
  border:2px solid #52b788;border-radius:12px;padding:12px;
}

/* IMAGE FRONT, COLOUR BEHIND */
.cap-wrap{
  width:250px;
  height:300px;
  position:relative;
  margin:0 auto 20px;
}

.cap-mask{
  position:absolute;
  top:0;
  left:0;
  width:250px;
  height:250px;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
}

.cap-img{
  width:250px;
  position:absolute;
  top:0;
  left:0;
  z-index:10;
  pointer-events:none;
}

.band{
  position:absolute;
  border:none;
  z-index:2;
}

/* 3 BAND positions */
.mode3 #bandM{
  width:70px;height:82px;top:30px;left:45px;
  border-radius:0% 100% 0% 100% / 0% 100% 0% 100%;
}
.mode3 #band1{
  width:15px;height:92px;top:10px;left:120px;
}
.mode3 #band2{
  width:70px;height:80px;top:32px;left:132px;
  border-radius:100% 0% 100% 0% / 100% 2% 98% 0%;
}
.mode3 #bandTemp,
.mode3 #bandT{display:none}

/* 5 BAND positions */
.mode5 #bandTemp{
  width:95px;height:42px;top:86px;left:8px;
  border-radius:0% 100% 0% 100% / 0% 100% 0% 100%;
}
.mode5 #band1{
  width:70px;height:82px;top:30px;left:45px;
  border-radius:0% 100% 0% 100% / 0% 100% 0% 100%;
}
.mode5 #band2{
  width:15px;height:92px;top:10px;left:120px;
}
.mode5 #bandM{
  width:70px;height:80px;top:32px;left:132px;
  border-radius:100% 0% 100% 0% / 100% 2% 98% 0%;
}
.mode5 #bandT{
  width:100px;height:50px;top:80px;left:142px;
  border-radius:100% 0% 100% 0% / 100% 2% 98% 0%;
}

/* iOS popup */
.ios-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.30);z-index:9999}
.ios-picker{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:92%;max-width:420px;background:#d8dee9;border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);padding:12px;z-index:10000;
}
.ios-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:bold}
.ios-head button{border:0;background:#0b7cff;color:#fff;padding:7px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.wheel-wrap{position:relative}
.wheel{
  height:210px;overflow-y:auto;border-radius:10px;border:1px solid #8e99aa;
  background:linear-gradient(#eef3fb,#cbd6e7,#eef3fb);
  scroll-snap-type:y mandatory;padding:84px 0;
}
.wheel::-webkit-scrollbar{width:0}
.wheel div{height:42px;display:flex;align-items:center;padding:0 18px;font-size:22px;font-weight:bold;scroll-snap-align:center;cursor:pointer}
.wheel-highlight{position:absolute;left:0;right:0;top:84px;height:42px;border-top:1px solid #6f7f98;border-bottom:1px solid #6f7f98;background:rgba(255,255,255,.25);pointer-events:none}

@media(max-width:700px){
  .controls{grid-template-columns:repeat(2,1fr)!important;gap:14px 12px}
  .top{max-width:100%}
  .lbl{font-size:13px}
  .pick-btn{height:42px;font-size:14px;padding-left:10px;padding-right:30px}
  .result{font-size:18px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
  <div class="lbl">Band Mode</div>
  <div id="modeBox"></div>
</div>

<div class="cap-wrap mode3" id="capWrap">
  <div class="cap-mask">
    <div id="bandTemp" class="band"></div>
    <div id="bandM" class="band"></div>
    <div id="band1" class="band"></div>
    <div id="band2" class="band"></div>
    <div id="bandT" class="band"></div>
  </div>

  <img id="capImg" class="cap-img" src="https://ik.imagekit.io/mak/color_code/DISKCAPV1_0jPTzfYBW.png">
</div>

<div class="result" id="result">Select bands</div>

<div class="controls">
  <div id="boxTemp"><div class="lbl">Temp</div><div id="tempBox"></div></div>
  <div id="box1"><div class="lbl">1Band</div><div id="d1Box"></div></div>
  <div id="box2"><div class="lbl">2Band</div><div id="d2Box"></div></div>
  <div id="boxM"><div class="lbl">Multiplier</div><div id="mBox"></div></div>
  <div id="boxT"><div class="lbl">Tolerance</div><div id="tBox"></div></div>
</div>

</div>

<div class="ios-mask" id="mask">
  <div class="ios-picker">
    <div class="ios-head">
      <span id="title">Select</span>
      <button onclick="closePicker()">Done</button>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-highlight"></div>
      <div class="wheel" id="wheel"></div>
    </div>
  </div>
</div>

<script>
const modeData=[["3 BAND",3,"#ddd"],["5 BAND",5,"#ddd"]];

const digit1=[
["Black",0,"#000"],["Brown",10,"brown"],["Red",20,"red"],["Orange",30,"orange"],
["Yellow",40,"yellow"],["Green",50,"green"],["Blue",60,"blue"],["Violet",70,"violet"],
["Grey",80,"grey"],["White",90,"white"],["Gold",0,"gold"],["Silver",0,"silver"]
];

const digit2=[
["Black",0,"#000"],["Brown",1,"brown"],["Red",2,"red"],["Orange",3,"orange"],
["Yellow",4,"yellow"],["Green",5,"green"],["Blue",6,"blue"],["Violet",7,"violet"],
["Grey",8,"grey"],["White",9,"white"],["Gold",0,"gold"],["Silver",0,"silver"]
];

const multiplier=[
["Black",1,"#000"],["Brown",10,"brown"],["Red",100,"red"],["Orange",1000,"orange"],
["Yellow",10000,"yellow"],["Green",100000,"green"],["Blue",1000000,"blue"],
["Violet",10000000,"violet"],["Grey",1000000000,"grey"],["White",100000000000,"white"],
["Gold",100000000000,"gold"],["Silver",1000000000,"silver"]
];

const tolerance=[
["Black","±20.0%","#000"],["Brown","±1.0%","brown"],["Red","±2.0%","red"],
["Orange","±3.0%","orange"],["Yellow","±4.0%","yellow"],["Green","±5.0%","green"],
["Grey","+80%,-20%","grey"],["White","±10.0%","white"],["Gold","±5.0%","gold"],
["Silver","±10.0%","silver"]
];

const temp=[
["Black",0,"#000"],["Brown","-30/ppmC°","brown"],["Red","-80/ppmC°","red"],
["Orange","-150/ppmC°","orange"],["Yellow","-220/ppmC°","yellow"],
["Green","-330/ppmC°","green"],["Blue","-470/ppmC°","blue"],
["Violet","-750/ppmC°","violet"],["Grey","+30/ppmC°","grey"],
["Silver","+100/ppmC°","silver"]
];

let state={mode:3,d1:10,d2:1,m:1,t:"±20.0%",temp:0};
let btns={},activeData=[],activeKey="";

function makeBtn(id,data,key,name){
  let b=document.createElement("div");
  b.className="pick-btn";
  b.onclick=function(){openPicker(data,key,name)};
  document.getElementById(id).appendChild(b);
  btns[key]=b;
  setBtn(data,key);
}

function setBtn(data,key){
  let x=data.find(a=>a[1]===state[key])||data[0];
  btns[key].innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
}

function openPicker(data,key,name){
  activeData=data;
  activeKey=key;
  document.getElementById("title").innerText=name;
  let wheel=document.getElementById("wheel");
  wheel.innerHTML="";

  data.forEach(function(x,idx){
    let r=document.createElement("div");
    r.innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
    r.onclick=function(){selectItem(idx)};
    wheel.appendChild(r);
  });

  document.getElementById("mask").style.display="block";
}

function selectItem(idx){
  let x=activeData[idx];
  state[activeKey]=x[1];
  setBtn(activeData,activeKey);
  calc();
  closePicker();
}

function closePicker(){document.getElementById("mask").style.display="none"}
document.getElementById("mask").onclick=function(e){if(e.target.id==="mask")closePicker()};

makeBtn("modeBox",modeData,"mode","Band Mode");
makeBtn("tempBox",temp,"temp","Temp");
makeBtn("mBox",multiplier,"m","Multiplier");
makeBtn("d1Box",digit1,"d1","1Band");
makeBtn("d2Box",digit2,"d2","2Band");
makeBtn("tBox",tolerance,"t","Tolerance");

function col(data,val){return (data.find(x=>x[1]===val)||data[0])[2]}

function calculate(){
  var columnFirst=state.d1;
  var columnSecond=state.d2;
  var columnThird=state.m;
  var wynik;

  if(columnThird==0){
    wynik=parseInt(columnFirst)+parseInt(columnSecond);
  }else{
    wynik=(parseInt(columnFirst)+parseInt(columnSecond))*parseFloat(columnThird);
  }

  if(columnThird==0.1){
    wynik=(parseInt(columnFirst)+parseInt(columnSecond))*0.1;
  }

  if(columnThird==0.01){
    wynik=(parseInt(columnFirst)+parseInt(columnSecond))*0.01;
  }

  return wynik;
}

function showResult(){
  let calculationResult=calculate();
  let digitCount=calculationResult.toString().length;
  let output="";

  if(digitCount>=4 && digitCount<7){
    output=calculate()/1000+" nf";
  }else if(digitCount>=7 && digitCount<=9){
    output=calculate()/1000000+" μF";
  }else if(digitCount>=10 && digitCount<=11){
    output=calculate()/100000000000+" pF";
  }else if(digitCount>=12 && digitCount<=13){
    output=calculate()/1000000000000+" pF";
  }else{
    output=calculate()+" pf";
  }

  if(state.mode==5){
    output+=" &nbsp; "+state.temp+" &nbsp; "+state.t;
  }

  document.getElementById("result").innerHTML=output;
}

function calc(){
  let isFive=state.mode==5;

  document.getElementById("capWrap").className=isFive ? "cap-wrap mode5" : "cap-wrap mode3";
  document.getElementById("capImg").src=isFive
    ? "https://ik.imagekit.io/mak/color_code/DISKCAPV_qilHAJMjHB.png"
    : "https://ik.imagekit.io/mak/color_code/DISKCAPV1_0jPTzfYBW.png";

  document.getElementById("boxTemp").style.display=isFive?"block":"none";
  document.getElementById("boxT").style.display=isFive?"block":"none";

  document.getElementById("bandTemp").style.background=col(temp,state.temp);
  document.getElementById("bandM").style.background=col(multiplier,state.m);
  document.getElementById("band1").style.background=col(digit1,state.d1);
  document.getElementById("band2").style.background=col(digit2,state.d2);
  document.getElementById("bandT").style.background=col(tolerance,state.t);

  showResult();
}

calc();
</script>

</body>
</html>
