<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  font-family:Arial;
  margin:0;
  padding:12px;
  background:#fff;
  color:#123;
}

.wrap{
  max-width:1000px;
  margin:auto;
  text-align:center;
  padding:0 10px;
  overflow:visible;
}

.top{
  max-width:260px;
  margin:0 auto 18px;
  text-align:left;
}

.controls{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-bottom:18px;
  text-align:left;
}

.lbl{
  font-size:14px;
  margin-bottom:5px;
  white-space:nowrap;
}

.pick-btn{
  width:100%;
  height:44px;
  border:1px solid #8fa3bd;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  padding:6px 35px 6px 12px;
  background:linear-gradient(#f9fcff,#c8d5e6 48%,#a9b9cf 50%,#edf3fb);
  box-shadow:inset 0 1px 0 #fff,0 2px 5px #999;
  position:relative;
  cursor:pointer;
  text-align:left;
  overflow:hidden;
  white-space:nowrap;
}

.pick-btn:after{
  content:"⌄";
  position:absolute;
  right:12px;
  top:7px;
  font-size:22px;
}

.sw{
  display:inline-block;
  width:18px;
  height:18px;
  border:1px solid #666;
  margin-right:8px;
  vertical-align:middle;
}

.result{
  font-size:20px;
  font-weight:bold;
  margin:10px 0 16px;
  color:#0f8f55;
  border:2px solid #52b788;
  border-radius:12px;
  padding:12px;
}

/* DISK CAP OVERLAY */
.disk-wrap{
  width:252px;
  height:297px;
  margin:0 auto 18px;
  position:relative;
}

.disk{
  width:234px;
  height:234px;
  border-radius:50%;
  background:#d8963d;
  position:absolute;
  left:9px;
  top:0;
  overflow:hidden;
  box-shadow:inset -18px -22px 35px rgba(0,0,0,.08);
}

.disk::before{
  content:"";
  position:absolute;
  width:20px;
  height:212px;
  left:67px;
  top:0;
  background:linear-gradient(to right,rgba(255,255,255,.45),rgba(255,255,255,.05));
  transform:skewX(-10deg);
  opacity:.55;
  z-index:8;
}

.disk::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.18),transparent 45%);
  z-index:9;
  pointer-events:none;
}

.cap-band{
  position:absolute;
  left:0;
  width:100%;
  height:16px;
  z-index:4;
}

.band-v{top:25px}
.band-1{top:52px}
.band-2{top:79px}
.band-3{top:106px}
.band-4{top:133px}

.lead{
  position:absolute;
  width:10px;
  height:63px;
  background:#aaa;
  bottom:0;
  border-radius:6px 6px 0 0;
}

.lead.left{left:74px}
.lead.right{right:74px}

/* IOS POPUP */
.ios-mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.30);
  z-index:9999;
}

.ios-picker{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:92%;
  max-width:420px;
  background:#d8dee9;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  padding:12px;
  z-index:10000;
}

.ios-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-weight:bold;
}

.ios-head button{
  border:0;
  background:#0b7cff;
  color:#fff;
  padding:7px 14px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.wheel-wrap{
  position:relative;
}

.wheel{
  height:210px;
  overflow-y:auto;
  border-radius:10px;
  border:1px solid #8e99aa;
  background:linear-gradient(#eef3fb,#cbd6e7,#eef3fb);
  scroll-snap-type:y mandatory;
  padding:84px 0;
}

.wheel::-webkit-scrollbar{width:0}

.wheel div{
  height:42px;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:22px;
  font-weight:bold;
  scroll-snap-align:center;
  cursor:pointer;
}

.wheel-highlight{
  position:absolute;
  left:0;
  right:0;
  top:84px;
  height:42px;
  border-top:1px solid #6f7f98;
  border-bottom:1px solid #6f7f98;
  background:rgba(255,255,255,.25);
  pointer-events:none;
}

/* mobile */
@media(max-width:700px){
  .wrap{
    padding-left:14px;
    padding-right:14px;
  }

  .controls{
    grid-template-columns:repeat(2,1fr);
    gap:14px 12px;
  }

  .lbl{
    font-size:13px;
    padding-left:2px;
  }

  .pick-btn{
    height:42px;
    font-size:14px;
    padding-left:10px;
    padding-right:30px;
  }

  .pick-btn:after{
    right:9px;
    top:7px;
    font-size:20px;
  }

  .result{
    font-size:18px;
  }

  .disk-wrap{
    width:216px;
    height:257px;
  }

  .disk{
    width:198px;
    height:198px;
  }

  .lead.left{left:63px}
  .lead.right{right:63px}

  .cap-band{height:14px}
  .band-v{top:22px}
  .band-1{top:46px}
  .band-2{top:70px}
  .band-3{top:94px}
  .band-4{top:118px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="lbl">Band Mode</div>
    <div id="modeBox"></div>
  </div>

  <div class="controls">
    <div id="boxV">
      <div class="lbl">Voltage</div>
      <div id="vBox"></div>
    </div>

    <div id="box1">
      <div class="lbl">1Band</div>
      <div id="d1Box"></div>
    </div>

    <div id="box2">
      <div class="lbl">2Band</div>
      <div id="d2Box"></div>
    </div>

    <div id="boxM">
      <div class="lbl">Multiplier</div>
      <div id="mBox"></div>
    </div>

    <div id="boxT">
      <div class="lbl">Tolerance</div>
      <div id="tBox"></div>
    </div>
  </div>

  <div class="result" id="result">Select bands</div>

  <div class="disk-wrap">
    <div class="disk">
      <div id="bandV" class="cap-band band-v"></div>
      <div id="band1" class="cap-band band-1"></div>
      <div id="band2" class="cap-band band-2"></div>
      <div id="band3" class="cap-band band-3"></div>
      <div id="band4" class="cap-band band-4"></div>
    </div>
    <div class="lead left"></div>
    <div class="lead right"></div>
  </div>

</div>

<div class="ios-mask" id="mask">
  <div class="ios-picker">
    <div class="ios-head">
      <span id="title">Select</span>
      <button onclick="closePicker()">Done</button>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-highlight"></div>
      <div class="wheel" id="wheel"></div>
    </div>
  </div>
</div>

<script>
const modeData=[
  ["3 BAND",3,"#ddd"],
  ["5 BAND",5,"#ddd"]
];

const digit1=[
  ["black",0,"#000"],
  ["brown",10,"brown"],
  ["red",20,"red"],
  ["orange",30,"orange"],
  ["yellow",40,"yellow"],
  ["green",50,"green"],
  ["blue",60,"blue"],
  ["violet",70,"violet"],
  ["grey",80,"grey"],
  ["white",90,"white"],
  ["gold",0,"gold"],
  ["silver",0,"silver"]
];

const digit2=[
  ["black",0,"#000"],
  ["brown",1,"brown"],
  ["red",2,"red"],
  ["orange",3,"orange"],
  ["yellow",4,"yellow"],
  ["green",5,"green"],
  ["blue",6,"blue"],
  ["violet",7,"violet"],
  ["grey",8,"grey"],
  ["white",9,"white"],
  ["gold",0,"gold"],
  ["silver",0,"silver"]
];

const multiplier=[
  ["black",1,"#000"],
  ["brown",10,"brown"],
  ["red",100,"red"],
  ["orange",1000,"orange"],
  ["yellow",10000,"yellow"],
  ["green",100000,"green"],
  ["blue",1000000,"blue"],
  ["violet",10000000,"violet"],
  ["grey",1000000000,"grey"],
  ["white",100000000000,"white"],
  ["gold",100000000000,"gold"],
  ["silver",1000000000,"silver"]
];

const tolerance=[
  ["black", "±20.0%", "#000"],
  ["brown", "±1.0%", "brown"],
  ["red", "±2.0%", "red"],
  ["orange", "±3.0%", "orange"],
  ["yellow", "±4.0%", "yellow"],
  ["green", "±5.0%", "green"],
  ["grey", "+80%,-20%", "grey"],
  ["white", "±10.0%", "white"],
  ["gold", "±5.0%", "gold"],
  ["silver", "±10.0%", "silver"]
];

const voltage=[
  ["brown", "100 V", "brown"],
  ["red", "250 V", "red"],
  ["yellow", "400 V", "yellow"],
  ["blue", "630 V", "blue"]
];

let state={
  mode:3,
  d1:10,
  d2:1,
  m:1,
  t:"±20.0%",
  v:"100 V"
};

let btns={};
let activeData=[];
let activeKey="";

function makeBtn(id,data,key,name){
  let b=document.createElement("div");
  b.className="pick-btn";
  b.onclick=function(){openPicker(data,key,name)};
  document.getElementById(id).appendChild(b);
  btns[key]=b;
  setBtn(data,key);
}

function setBtn(data,key){
  let x=data.find(a=>a[1]==state[key]) || data[0];
  btns[key].innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
}

function openPicker(data,key,name){
  activeData=data;
  activeKey=key;
  document.getElementById("title").innerText=name;

  let wheel=document.getElementById("wheel");
  wheel.innerHTML="";

  data.forEach(function(x,idx){
    let r=document.createElement("div");
    r.innerHTML='<span class="sw" style="background:'+x[2]+'"></span>'+x[0];
    r.onclick=function(){selectItem(idx)};
    wheel.appendChild(r);
  });

  document.getElementById("mask").style.display="block";

  let current=data.findIndex(x=>x[1]==state[key]);
  setTimeout(function(){
    wheel.scrollTop=(current<0?0:current)*42;
  },30);
}

function selectItem(idx){
  let x=activeData[idx];
  state[activeKey]=x[1];
  setBtn(activeData,activeKey);
  calc();
  closePicker();
}

function closePicker(){
  document.getElementById("mask").style.display="none";
}

document.getElementById("mask").onclick=function(e){
  if(e.target.id==="mask")closePicker();
};

makeBtn("modeBox",modeData,"mode","Band Mode");
makeBtn("vBox",voltage,"v","Voltage");
makeBtn("d1Box",digit1,"d1","1Band");
makeBtn("d2Box",digit2,"d2","2Band");
makeBtn("mBox",multiplier,"m","Multiplier");
makeBtn("tBox",tolerance,"t","Tolerance");

function col(data,val){
  return (data.find(x=>x[1]==val)||data[0])[2];
}

/* original formula logic */
function calculate(){
  var columnFirst = state.d1;
  var columnSecond = state.d2;
  var columnThird = state.m;
  var wynik;

  if(columnThird == 0){
    wynik = parseInt(columnFirst) + parseInt(columnSecond);
  }else{
    wynik = (parseInt(columnFirst) + parseInt(columnSecond)) * parseInt(columnThird);
  }
  return wynik;
}

function showOriginalResult(){
  let calculationResult = calculate();
  let digitCount = calculationResult.toString().length;
  let output = "";

  if(digitCount >= 4 && digitCount < 7){
    output = calculate() / 1000 + " nf";
  }else if(digitCount >= 7 && digitCount <= 9){
    output = calculate() / 1000000 + " μF";
  }else if(digitCount >= 10 && digitCount <= 11){
    output = calculate() / 100000000000 + " pF";
  }else if(digitCount >= 12 && digitCount <= 13){
    output = calculate() / 1000000000000 + " pF";
  }else{
    output = calculate() + " pf";
  }

  if(state.mode == 5){
    output += " &nbsp; " + state.v + " &nbsp; " + state.t;
  }

  document.getElementById("result").innerHTML = output;
}

function calc(){
  let isFive = state.mode == 5;

  document.getElementById("boxV").style.display = isFive ? "block" : "none";
  document.getElementById("boxT").style.display = isFive ? "block" : "none";

  document.getElementById("bandV").style.display = isFive ? "block" : "none";
  document.getElementById("band4").style.display = isFive ? "block" : "none";

  document.getElementById("band1").style.background = col(digit1,state.d1);
  document.getElementById("band2").style.background = col(digit2,state.d2);
  document.getElementById("band3").style.background = col(multiplier,state.m);
  document.getElementById("bandV").style.background = col(voltage,state.v);
  document.getElementById("band4").style.background = col(tolerance,state.t);

  showOriginalResult();
}

calc();
</script>

</body>
</html>
