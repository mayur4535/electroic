<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
}

/* wrapper */
.calc-wrap{
  width:min(900px, calc(100% - 24px));
  margin:0 auto; /* 👈 no top margin */
  padding:12px;
}

/* card */
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin:0 0 20px 0; /* 👈 only bottom spacing */
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h2{
  text-align:center;
  margin-bottom:18px;
}

/* capacitor */
.cap-body{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.cap-leg{
  width:40px;
  height:120px;
  background:#ccc;
  border-radius:6px;
}

.cap-main{
  flex:1;
  height:120px;
  background:#d6a36f;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cap-main input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  text-align:center;
  font-size:50px;
  font-weight:bold;
}

/* value input */
.input-box{
  width:100%;
  height:60px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:26px;
  font-weight:700;
  text-align:center;
  margin-bottom:12px;
}

/* unit buttons */
.unit-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.unit-btn{
  height:50px;
  border-radius:12px;
  border:1px solid #ccc;
  background:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.unit-btn.active{
  background:#198754;
  color:#fff;
}

/* result */
.result{
  border:2px solid #52b788;
  border-radius:12px;
  padding:16px;
  text-align:center;
  font-weight:bold;
  color:#0f8f55;
  font-size:26px;
  display:none;
  margin-top:15px;
}

/* error */
.error{
  text-align:center;
  color:red;
  margin-top:10px;
  display:none;
}

/* mobile */
@media(max-width:600px){
  .cap-leg{width:25px;height:90px}
  .cap-main{height:90px}
  .cap-main input{font-size:36px}

  .input-box{
    font-size:22px;
    height:55px;
  }

  .result{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="calc-wrap">

<!-- Code to Value -->
<div class="card">
<h2>Convert Code to Value</h2>

<div class="cap-body">
  <div class="cap-leg"></div>
  <div class="cap-main">
    <input id="code_value" maxlength="3" placeholder="103" onkeyup="calcCode()">
  </div>
  <div class="cap-leg"></div>
</div>

<div class="result" id="code_value_result">
<b id="value_uF"></b> =
<b id="value_nF"></b> =
<b id="value_pF"></b>
</div>

<div class="error" id="code_invalid_value"></div>
</div>

<!-- Value to Code -->
<div class="card">
<h2>Convert Value to Code</h2>

<input class="input-box" id="capacitance" type="number" placeholder="Enter value" oninput="calcCapacitance('')">

<div class="unit-row">
<button class="unit-btn active" id="unit_uF" onclick="calcCapacitance('uF')">uF</button>
<button class="unit-btn" id="unit_nF" onclick="calcCapacitance('nF')">nF</button>
<button class="unit-btn" id="unit_pF" onclick="calcCapacitance('pF')">pF</button>
</div>

<input name="capacitance_unit" type="hidden" value="uF">

<div class="result" id="capacitance_value_result">
The code is: <b id="value_code"></b>
</div>

<div class="error" id="capacitance_invalid_value"></div>
</div>

</div>

<script>
error2 = "Last digit cannot be greater than 6";

function calcCode(){
  document.getElementById('code_value_result').style.display="none";
  document.getElementById('code_invalid_value').style.display="none";

  let code = document.getElementById('code_value').value;
  if(code=="") return;

  let sf = Math.floor(code/10);

  if((code-(sf*10))>6){
    document.getElementById('code_invalid_value').innerHTML=error2;
    document.getElementById('code_invalid_value').style.display="block";
    return;
  }

  let res = sf * Math.pow(10,(code-(sf*10)));

  document.getElementById('code_value_result').style.display="block";
  document.getElementById('value_uF').innerHTML=(res/1000000)+"uF";
  document.getElementById('value_nF').innerHTML=(res/1000)+"nF";
  document.getElementById('value_pF').innerHTML=res+"pF";
}

error3="Value must be between 10pF and 9.9uF";
error4="Value is not a valid number";

function calcCapacitance(option){

  if(option==""){
    option=document.getElementsByName("capacitance_unit")[0].value;
  }

  document.getElementById('capacitance_value_result').style.display="none";
  document.getElementById('capacitance_invalid_value').style.display="none";

  let unit=select_unit(option);
  let val=document.getElementById("capacitance").value;

  if(val!=""){

    if(unit=="nF") val*=1000;
    if(unit=="uF") val*=1000000;

    if(val<10 || val>=10000000){
      document.getElementById('capacitance_invalid_value').innerHTML=error3;
      document.getElementById('capacitance_invalid_value').style.display="block";
      return;
    }

    let last=0;
    while(val>=100){
      last++;
      val/=10;
    }

    if(!isNaN(val)){
      document.getElementById('capacitance_value_result').style.display="block";
      document.getElementById('value_code').innerHTML=val*10+last;
    }else{
      document.getElementById('capacitance_invalid_value').innerHTML=error4;
      document.getElementById('capacitance_invalid_value').style.display="block";
    }
  }
}

function select_unit(option){
  document.getElementById('unit_uF').className="unit-btn";
  document.getElementById('unit_nF').className="unit-btn";
  document.getElementById('unit_pF').className="unit-btn";

  document.getElementById('unit_'+option).className="unit-btn active";
  document.getElementsByName("capacitance_unit")[0].value=option;

  return option;
}
</script>

</body>
</html>
