<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#voltage-divider-calc,
#voltage-divider-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#voltage-divider-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#voltage-divider-calc .calc-grid{
  display:grid;
  gap:15px;
}

#voltage-divider-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#voltage-divider-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#voltage-divider-calc input,
#voltage-divider-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#voltage-divider-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#voltage-divider-calc input:focus,
#voltage-divider-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#voltage-divider-calc .unit-box,
#voltage-divider-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#voltage-divider-calc .unit-box{
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#voltage-divider-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#voltage-divider-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#voltage-divider-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#voltage-divider-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#voltage-divider-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#voltage-divider-calc .result-card:nth-child(1) .result-label,
#voltage-divider-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#voltage-divider-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#voltage-divider-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#voltage-divider-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #voltage-divider-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #voltage-divider-calc .unit-box,
  #voltage-divider-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #voltage-divider-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #voltage-divider-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="voltage-divider-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">V<sub>IN</sub></label>
      <div class="calc-row">
        <input id="tool_voltage_source" type="number" placeholder="Enter input voltage">
        <div class="unit-box">V</div>
      </div>
    </div>

    <div>
      <label class="calc-label">R<sub>1</sub></label>
      <div class="calc-row">
        <input id="tool_resistance_1" type="number" placeholder="Enter R1">
        <select id="tool_resistance_1_unit" class="unit-select">
          <option value="1">Ω</option>
          <option value="1000">kΩ</option>
          <option value="1000000">MΩ</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">R<sub>2</sub></label>
      <div class="calc-row">
        <input id="tool_resistance_2" type="number" placeholder="Enter R2">
        <select id="tool_resistance_2_unit" class="unit-select">
          <option value="1">Ω</option>
          <option value="1000">kΩ</option>
          <option value="1000000">MΩ</option>
        </select>
      </div>
    </div>

  </div>

  <button onclick="calculateVoltageDivider()">Calculate</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">
    <div class="result-card">
      <div class="result-label">Vout</div>
      <div class="result-value"><span id="tool_voltage_output">-</span> V</div>
    </div>
  </div>

  <div class="formula">
    Vout = VIN × R2 / (R1 + R2)
  </div>

</div>

<script>
function calculateVoltageDivider(){

  let vin = parseFloat(document.getElementById("tool_voltage_source").value);

  let r1 =
    parseFloat(document.getElementById("tool_resistance_1").value) *
    parseFloat(document.getElementById("tool_resistance_1_unit").value);

  let r2 =
    parseFloat(document.getElementById("tool_resistance_2").value) *
    parseFloat(document.getElementById("tool_resistance_2_unit").value);

  let errorBox = document.getElementById("errorBox");

  if(isNaN(vin) || isNaN(r1) || isNaN(r2)){
    errorBox.style.display = "block";
    document.getElementById("tool_voltage_output").innerText = "-";
    return;
  }

  errorBox.style.display = "none";

  let vout = vin * r2 / (r1 + r2);

  document.getElementById("tool_voltage_output").innerText = vout;
}
</script>

</body>
</html>
