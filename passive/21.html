<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#resistivity-calc,
#resistivity-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#resistivity-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#resistivity-calc .calc-grid{
  display:grid;
  gap:15px;
}

#resistivity-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#resistivity-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#resistivity-calc input,
#resistivity-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#resistivity-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#resistivity-calc input:focus,
#resistivity-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#resistivity-calc .unit-box,
#resistivity-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
}

#resistivity-calc .unit-box{
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#resistivity-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#resistivity-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#resistivity-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#resistivity-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#resistivity-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#resistivity-calc .result-card:nth-child(1) .result-label,
#resistivity-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#resistivity-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#resistivity-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#resistivity-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #resistivity-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #resistivity-calc .unit-box,
  #resistivity-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #resistivity-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #resistivity-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="resistivity-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Resistance</label>

      <div class="calc-row">

        <input type="number" id="rc_resistance" placeholder="Enter resistance">

        <select id="rc_ohm_val" class="unit-select">
          <option value="1">Ω</option>
          <option value="1000">kΩ</option>
          <option value="1000000">MΩ</option>
        </select>

      </div>
    </div>

    <div>
      <label class="calc-label">Length</label>

      <div class="calc-row">
        <input type="number" id="rc_length" placeholder="Enter length">
        <div class="unit-box">m</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Area</label>

      <div class="calc-row">
        <input type="number" id="rc_area" placeholder="Enter area">
        <div class="unit-box">m²</div>
      </div>
    </div>

  </div>

  <button onclick="calculateResistivity()">
    Calculate
  </button>

  <div id="errorBox">
    Please enter valid values.
  </div>

  <div class="result-title">
    RESULTS
  </div>

  <div class="result-grid">

    <div class="result-card">

      <div class="result-label">
        Resistivity
      </div>

      <div class="result-value">
        <span id="rc_answer">-</span> Ω
      </div>

    </div>

  </div>

  <div class="formula">
    Resistivity = Area / Length × Resistance
  </div>

</div>

<script>
function numberWithCommas(x){

  return x.toString().replace(
    /\B(?=(\d{3})+(?!\d))/g,
    ","
  );
}

function calculateResistivity(){

  let resistance =
    parseFloat(document.getElementById("rc_resistance").value);

  let area =
    parseFloat(document.getElementById("rc_area").value);

  let length =
    parseFloat(document.getElementById("rc_length").value);

  let multiplier =
    parseFloat(document.getElementById("rc_ohm_val").value);

  let errorBox =
    document.getElementById("errorBox");

  if(
    isNaN(resistance) ||
    isNaN(area) ||
    isNaN(length)
  ){

    errorBox.style.display = "block";

    document.getElementById("rc_answer").innerText = "-";

    return;
  }

  errorBox.style.display = "none";

  /* ORIGINAL FORMULA PRESERVED EXACTLY */

  resistance *= multiplier;

  let answer =
    area / length * resistance;

  document.getElementById("rc_answer").innerText =
    numberWithCommas(answer);
}
</script>

</body>
</html>
