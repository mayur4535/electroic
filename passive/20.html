<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#rect-inductance-calc,
#rect-inductance-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#rect-inductance-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#rect-inductance-calc .calc-grid{
  display:grid;
  gap:15px;
}

#rect-inductance-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#rect-inductance-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#rect-inductance-calc input,
#rect-inductance-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#rect-inductance-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#rect-inductance-calc input:focus,
#rect-inductance-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

/* SQUARE RIGHT SIDE BOX */

#rect-inductance-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#rect-inductance-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  text-align:center;
  font-weight:700;
}

#rect-inductance-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#rect-inductance-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#rect-inductance-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#rect-inductance-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#rect-inductance-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#rect-inductance-calc .result-card:nth-child(1) .result-label,
#rect-inductance-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#rect-inductance-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#rect-inductance-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#rect-inductance-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #rect-inductance-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #rect-inductance-calc .unit-select,
  #rect-inductance-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #rect-inductance-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #rect-inductance-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="rect-inductance-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Turns</label>

      <div class="calc-row">
        <input type="number" id="rectangle_turns" placeholder="Enter turns">
        <div class="unit-box">N</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Width (Loop)</label>

      <div class="calc-row">
        <input type="number" id="rectangle_width" placeholder="Enter width">

        <select id="rectangle_width_unit" class="unit-select">
          <option value="2.54e-5">mil</option>
          <option value="0.01">cm</option>
          <option selected value="0.001">mm</option>
          <option value="0.000001">um</option>
          <option value="0.0254">inch</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Height (Loop)</label>

      <div class="calc-row">
        <input type="number" id="rectangle_height" placeholder="Enter height">

        <select id="rectangle_height_unit" class="unit-select">
          <option value="2.54e-5">mil</option>
          <option value="0.01">cm</option>
          <option selected value="0.001">mm</option>
          <option value="0.000001">um</option>
          <option value="0.0254">inch</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Diameter (Wire)</label>

      <div class="calc-row">
        <input type="number" id="wire_diameter" placeholder="Enter wire diameter">

        <select id="wire_diameter_unit" class="unit-select">
          <option value="2.54e-5">mil</option>
          <option value="0.01">cm</option>
          <option selected value="0.001">mm</option>
          <option value="0.000001">um</option>
          <option value="0.0254">inch</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Relative Permeability</label>

      <div class="calc-row">
        <input type="number" id="rel_perm" placeholder="Enter permeability">
        <div class="unit-box">μr</div>
      </div>
    </div>

  </div>

  <button onclick="calculateRectangleInductance()">
    Calculate
  </button>

  <div id="errorBox">
    Please enter valid values.
  </div>

  <div class="result-title">
    RESULTS
  </div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Inductance</div>

      <div class="result-value">
        <span id="tool_output1">-</span> H
      </div>
    </div>

  </div>

  <div class="formula">
    Original rectangle loop inductance formula preserved exactly from source code.
  </div>

</div>

<script>
function calculateRectangleInductance(){

  let turns =
    parseFloat(document.getElementById("rectangle_turns").value);

  let width =
    parseFloat(document.getElementById("rectangle_width").value) *
    parseFloat(document.getElementById("rectangle_width_unit").value);

  let height =
    parseFloat(document.getElementById("rectangle_height").value) *
    parseFloat(document.getElementById("rectangle_height_unit").value);

  let wireDiameter =
    parseFloat(document.getElementById("wire_diameter").value) *
    parseFloat(document.getElementById("wire_diameter_unit").value);

  let relPerm =
    parseFloat(document.getElementById("rel_perm").value);

  let errorBox =
    document.getElementById("errorBox");

  if(
    isNaN(turns) ||
    isNaN(width) ||
    isNaN(height) ||
    isNaN(wireDiameter) ||
    isNaN(relPerm)
  ){

    errorBox.style.display = "block";

    document.getElementById("tool_output1").innerText = "-";

    return;
  }

  errorBox.style.display = "none";

  /* ORIGINAL FORMULA PRESERVED */

  let mu0 = 4 * Math.PI * 1e-7;

  let inductance =
    turns * turns *
    (
      (mu0 * relPerm / Math.PI) *
      (
        -2 * (width + height) +
        2 * Math.sqrt(height * height + width * width) -
        height * Math.log(
          (
            height +
            Math.sqrt(height * height + width * width)
          ) / width
        ) -
        width * Math.log(
          (
            width +
            Math.sqrt(height * height + width * width)
          ) / height
        ) +
        height * Math.log(
          2 * height / (wireDiameter / 2)
        ) +
        width * Math.log(
          2 * width / (wireDiameter / 2)
        )
      )
    );

  document.getElementById("tool_output1").innerText =
    Number(inductance).toPrecision(3);
}
</script>

</body>
</html>
