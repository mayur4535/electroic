<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#steinhart-thermistor-calc,
#steinhart-thermistor-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  padding:10px;
}

#steinhart-thermistor-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#steinhart-thermistor-calc .calc-grid{
  display:grid;
  gap:12px;
}

#steinhart-thermistor-calc .calc-label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#344054;
  margin-bottom:6px;
}

#steinhart-thermistor-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#steinhart-thermistor-calc .full-row{
  grid-template-columns:1fr;
}

#steinhart-thermistor-calc input{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:14px;
  color:#111827;
  background:#fff;
  outline:none;
  text-align:center;
}

#steinhart-thermistor-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#steinhart-thermistor-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  color:#111827;
}

#steinhart-thermistor-calc button{
  width:100%;
  height:45px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#steinhart-thermistor-calc .result-title{
  margin-top:26px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
  color:#98a2b3;
  letter-spacing:.8px;
}

#steinhart-thermistor-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#steinhart-thermistor-calc .result-card{
  min-height:64px;
  padding:13px;
  border-radius:8px;
}

#steinhart-thermistor-calc .blue{
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#steinhart-thermistor-calc .green{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
}

#steinhart-thermistor-calc .purple{
  background:#f5f3ff;
  border:1px solid #ddd6fe;
}

#steinhart-thermistor-calc .orange{
  background:#fff7ed;
  border:1px solid #fed7aa;
}

#steinhart-thermistor-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:8px;
}

#steinhart-thermistor-calc .blue .result-label,
#steinhart-thermistor-calc .blue .result-value{
  color:#2563eb;
}

#steinhart-thermistor-calc .green .result-label,
#steinhart-thermistor-calc .green .result-value{
  color:#059669;
}

#steinhart-thermistor-calc .purple .result-label,
#steinhart-thermistor-calc .purple .result-value{
  color:#7c3aed;
}

#steinhart-thermistor-calc .orange .result-label,
#steinhart-thermistor-calc .orange .result-value{
  color:#ea580c;
}

#steinhart-thermistor-calc .result-value{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

#steinhart-thermistor-calc .formula-box{
  margin-top:14px;
  padding:14px;
  border-radius:9px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  color:#4b5563;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #steinhart-thermistor-calc{
    padding-top:12px;
  }

  #steinhart-thermistor-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #steinhart-thermistor-calc .full-row{
    grid-template-columns:1fr;
  }

  #steinhart-thermistor-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:12px;
  }

  #steinhart-thermistor-calc input{
    font-size:14px;
    padding:0 10px;
  }

  #steinhart-thermistor-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #steinhart-thermistor-calc .result-card{
    padding:12px 10px;
  }

  #steinhart-thermistor-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="steinhart-thermistor-calc">

  <form method="POST" name="ParamForm1">

    <div class="calc-grid">

      <div>
        <label class="calc-label">Coefficient A</label>
        <div class="calc-row full-row">
          <input name="A" type="number" step="any">
        </div>
      </div>

      <div>
        <label class="calc-label">Coefficient B</label>
        <div class="calc-row full-row">
          <input name="B" type="number" step="any">
        </div>
      </div>

      <div>
        <label class="calc-label">Coefficient C</label>
        <div class="calc-row full-row">
          <input name="C" type="number" step="any">
        </div>
      </div>

      <div>
        <label class="calc-label">Coefficient D</label>
        <div class="calc-row full-row">
          <input name="D" type="number" step="any">
        </div>
      </div>

      <div>
        <label class="calc-label">Rt (Resistance at Ambient Temp.)</label>
        <div class="calc-row">
          <input name="Rt" type="number" step="any">
          <div class="unit-box">Ω</div>
        </div>
      </div>

      <div>
        <label class="calc-label">Measured Resistance</label>
        <div class="calc-row">
          <input name="R" type="number" step="any">
          <div class="unit-box">Ω</div>
        </div>
      </div>

    </div>

    <button type="button" name="B2" onclick="ComputeT(document.ParamForm1);">Calculate</button>

    <div class="result-title">RESULTS</div>

    <div class="result-grid">

      <div class="result-card blue">
        <div class="result-label">Temperature</div>
        <div class="result-value"><span id="Tout">-</span> °C</div>
      </div>

    </div>

    <input name="T" type="hidden">

    <div class="formula-box">
      lr = ln(R / Rt)<br>
      T(K) = 1 / (A + B × lr + C × lr² + D × lr³)<br>
      T(°C) = T(K) − 273.15
    </div>

  </form>

</div>

<script>
function ComputeT(form) { 	
	with(Math) {
		var Precision= 5;
		
		var A= Number(form.A.value);
		var B= Number(form.B.value);
		var C= Number(form.C.value);
		var D= Number(form.D.value);
		var R= Number(form.R.value);
		var Rt= Number(form.Rt.value);

		var lr= log(R/Rt);
		T= 1/(A+ B*lr+ C*lr*lr+ D*lr*lr*lr);
		T-= 273.15;

		form.T.value= T.toPrecision(Precision);
    document.getElementById("Tout").innerText = form.T.value;
	}
}


function ComputeR(form) { 	
	with(Math) {
		var Precision= 5;
		
		var A= Number(form.A.value);
		var B= Number(form.B.value);
		var C= Number(form.C.value);
		var D= Number(form.D.value);
		var T= Number(form.T.value);
		var Rt= Number(form.Rt.value);
		var R;
		
		T+= 273.15;		// convert to Kelvin
		
		if(form.Extended.checked) {
			R= Rt*exp(A + (B/T)+ (C/(T*T))  + (D/(T*T*T)) );
		} else {
			R= Rt*exp(A + (B/T)+ (D/(T*T*T)) );
		}

		form.R.value= R.toPrecision(Precision);
	}
}


function ComputeR_Beta(form) { 	
	with(Math) {
		var Precision= 5;
		
		var B= Number(form.B.value);
		var T1= Number(form.T1.value)+273.15;
		var T2= Number(form.T2.value)+273.15;
		var R1= Number(form.R1.value);

		var R2;

		R2 = R1 / (exp(B*( 1/T1 - 1/T2 )));

		form.R2.value= R2.toPrecision(Precision);
	}
}

function ComputeT_Beta(form) { 	
	with(Math) {
		var Precision= 5;
		
		var B= Number(form.B.value);
		var T1= Number(form.T1.value)+273.15;
		var R1= Number(form.R1.value);
		var R2= Number(form.R2.value);
		
		var T2;
		var X;

		X= B/log(R1/R2);
		T2= X*T1/(X-T1);
		
		T2-= 273.15;

		form.T2.value= T2.toPrecision(Precision);
	}
}

function ComputeBeta(form) { 	
	with(Math) {
		var Precision= 5;

		var T1= Number(form.T1.value)  +273.15;		
		var T2= Number(form.T2.value)  +273.15;
		var TA=  Number(form.TA.value)  +273.15;
		var R1= Number(form.R1.value);
		var R2= Number(form.R2.value);
		
		var B;
		var A;
		
		B= T1*T2/(T2-T1)*log(R1/R2);
		A= -B*100/(TA*TA);

		form.B.value= B.toPrecision(Precision);
		form.A.value= A.toPrecision(Precision);
		
	}
}

function ComputeDeviation(form) { 	
	with(Math) {
		var Precision= 5;

		var TA= Number(form.TA.value) +273.15;		
		var dB= Number(form.dB.value);		
		var A= Number(form.A.value);
		var dR25=  Number(form.dR25.value);
		var B=  Number(form.B.value);
				
		var dR;
		var dT;
		var val= form.TA.value;
		
		if(Number(form.TA.value)!=0) {
			A= B/(TA*TA)*100;
			form.A.value= A.toPrecision(Precision);
		}
		
		dR= ( (1+dB/100)*(1+dR25/100) - 1 )*100;
		dT= dR/A;

		form.dR.value= dR.toPrecision(Precision);
		form.dT.value= dT.toPrecision(Precision);
		
	}
}
</script>

</body>
</html>
