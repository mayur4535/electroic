<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#multi-channel-calc,
#multi-channel-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  padding:10px;
}

#multi-channel-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#multi-channel-calc .input-head,
#multi-channel-calc .channel-row{
  display:grid;
  grid-template-columns:70px 1fr 1fr;
  gap:8px;
  align-items:center;
}

#multi-channel-calc .input-head{
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
  color:#667085;
  text-transform:uppercase;
}

#multi-channel-calc .channel-row{
  margin-bottom:10px;
}

#multi-channel-calc .ch-label{
  font-size:13px;
  font-weight:800;
  color:#344054;
}

#multi-channel-calc input{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 10px;
  font-size:14px;
  color:#111827;
  background:#fff;
  outline:none;
  text-align:center;
}

#multi-channel-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#multi-channel-calc button{
  width:100%;
  height:45px;
  margin-top:14px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#multi-channel-calc .result-title{
  margin-top:26px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
  color:#98a2b3;
  letter-spacing:.8px;
}

#multi-channel-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#multi-channel-calc .result-card{
  min-height:64px;
  padding:13px;
  border-radius:8px;
}

#multi-channel-calc .blue{background:#eef5ff;border:1px solid #bcd7ff;}
#multi-channel-calc .green{background:#ecfdf5;border:1px solid #a7f3d0;}
#multi-channel-calc .purple{background:#f5f3ff;border:1px solid #ddd6fe;}
#multi-channel-calc .orange{background:#fff7ed;border:1px solid #fed7aa;}

#multi-channel-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:8px;
}

#multi-channel-calc .blue .result-label,
#multi-channel-calc .blue input{color:#2563eb;}

#multi-channel-calc .green .result-label,
#multi-channel-calc .green input{color:#059669;}

#multi-channel-calc .purple .result-label,
#multi-channel-calc .purple input{color:#7c3aed;}

#multi-channel-calc .orange .result-label,
#multi-channel-calc .orange input{color:#ea580c;}

#multi-channel-calc .result-card input{
  height:auto;
  border:0;
  background:transparent;
  padding:0;
  font-size:15px;
  font-weight:900;
  text-align:left;
}

#multi-channel-calc .formula-box{
  margin-top:14px;
  padding:14px;
  border-radius:9px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  color:#4b5563;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}

@media(max-width:600px){
  body{padding:0;}

  #multi-channel-calc{
    padding-top:12px;
  }

  #multi-channel-calc .input-head,
  #multi-channel-calc .channel-row{
    grid-template-columns:50px 1fr 1fr;
    gap:7px;
  }

  #multi-channel-calc input{
    font-size:14px;
    padding:0 8px;
  }

  #multi-channel-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #multi-channel-calc .result-card{
    padding:12px 10px;
  }

  #multi-channel-calc .result-card input{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="multi-channel-calc">

<form method="POST" name="ParamForm">

  <div class="input-head">
    <div>Ch</div>
    <div>Voltage (V)</div>
    <div>Resistor (kΩ)</div>
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 1</div>
    <input name="V1" type="number" step="any">
    <input name="R1" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 2</div>
    <input name="V2" type="number" step="any">
    <input name="R2" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 3</div>
    <input name="V3" type="number" step="any">
    <input name="R3" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 4</div>
    <input name="V4" type="number" step="any">
    <input name="R4" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 5</div>
    <input name="V5" type="number" step="any">
    <input name="R5" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 6</div>
    <input name="V6" type="number" step="any">
    <input name="R6" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 7</div>
    <input name="V7" type="number" step="any">
    <input name="R7" type="number" step="any">
  </div>

  <div class="channel-row">
    <div class="ch-label">Ch 8</div>
    <input name="V8" type="number" step="any">
    <input name="R8" type="number" step="any">
  </div>

  <button type="button" name="B1" onclick="Compute(document.ParamForm);">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card blue">
      <div class="result-label">Vout 1</div>
      <input name="Vo1" type="text" readonly value="-">
    </div>

    <div class="result-card green">
      <div class="result-label">Vout 2</div>
      <input name="Vo2" type="text" readonly value="-">
    </div>

    <div class="result-card purple">
      <div class="result-label">Vout 3</div>
      <input name="Vo3" type="text" readonly value="-">
    </div>

    <div class="result-card orange">
      <div class="result-label">Vout 4</div>
      <input name="Vo4" type="text" readonly value="-">
    </div>

    <div class="result-card blue">
      <div class="result-label">Vout 5</div>
      <input name="Vo5" type="text" readonly value="-">
    </div>

    <div class="result-card green">
      <div class="result-label">Vout 6</div>
      <input name="Vo6" type="text" readonly value="-">
    </div>

    <div class="result-card purple">
      <div class="result-label">Vout 7</div>
      <input name="Vo7" type="text" readonly value="-">
    </div>

    <div class="result-card orange">
      <div class="result-label">Vout 8</div>
      <input name="Vo8" type="text" readonly value="-">
    </div>

    <div class="result-card blue">
      <div class="result-label">Vout Sum</div>
      <input name="VoSum" type="text" readonly value="-">
    </div>

  </div>

  <div class="formula-box">
    For each channel:<br>
    Rp = parallel resistance of all other channel resistors<br>
    Vo = V × Rp / (R + Rp)<br>
    Vout Sum = Vo1 + Vo2 + Vo3 + Vo4 + Vo5 + Vo6 + Vo7 + Vo8
  </div>

</form>

</div>

<script>
function Compute(form) {
	with(Math) {
		var KILO= 1000;
		var Precision= 3;
		var N= 8;
		var R = new Array();
		var Rp = new Array();
		var V = new Array();
		var Vo = new Array();
		var VoSum= 0;
		
		
		V[0]= Number(form.V1.value);
		R[0]= Number(form.R1.value);
		V[1]= Number(form.V2.value);
		R[1]= Number(form.R2.value);
		V[2]= Number(form.V3.value);
		R[2]= Number(form.R3.value);
		V[3]= Number(form.V4.value);
		R[3]= Number(form.R4.value);
		V[4]= Number(form.V5.value);
		R[4]= Number(form.R5.value);
		V[5]= Number(form.V6.value);
		R[5]= Number(form.R6.value);
		V[6]= Number(form.V7.value);
		R[6]= Number(form.R7.value);
		V[7]= Number(form.V8.value);
		R[7]= Number(form.R8.value);
		
		for(i=0;i<N;i++) {
			Rp[i]= 0;
		}
		
		for(i=0;i<N;i++) {
			if(R[i]) {
				if(i!=0) Rp[0]+= 1/R[i];
				if(i!=1) Rp[1]+= 1/R[i];
				if(i!=2) Rp[2]+= 1/R[i];
				if(i!=3) Rp[3]+= 1/R[i];
				if(i!=4) Rp[4]+= 1/R[i];
				if(i!=5) Rp[5]+= 1/R[i];	
				if(i!=6) Rp[6]+= 1/R[i];	
				if(i!=7) Rp[7]+= 1/R[i];		
			}
		}
		for(i=0;i<N;i++) Rp[i]= 1/Rp[i];
		
		for(i=0;i<N;i++) Vo[i]= V[i]*Rp[i]/(R[i]+Rp[i]);
		
		for(i=0;i<N;i++) VoSum+= Vo[i];
		
		form.VoSum.value= VoSum.toPrecision(Precision) + " V";
		form.Vo1.value= Vo[0].toPrecision(Precision) + " V";
		form.Vo2.value= Vo[1].toPrecision(Precision) + " V";
		form.Vo3.value= Vo[2].toPrecision(Precision) + " V";
		form.Vo4.value= Vo[3].toPrecision(Precision) + " V";
		form.Vo5.value= Vo[4].toPrecision(Precision) + " V";
		form.Vo6.value= Vo[5].toPrecision(Precision) + " V";
		form.Vo7.value= Vo[6].toPrecision(Precision) + " V";
		form.Vo8.value= Vo[7].toPrecision(Precision) + " V";
	}
}
</script>

</body>
</html>
