<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#luminous-flux-calc,
#luminous-flux-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#luminous-flux-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#luminous-flux-calc .calc-grid{
  display:grid;
  gap:15px;
}

#luminous-flux-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#luminous-flux-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
}

#luminous-flux-calc input{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#luminous-flux-calc .unit-box{
  width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#luminous-flux-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#luminous-flux-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#luminous-flux-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#luminous-flux-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#luminous-flux-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#luminous-flux-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#luminous-flux-calc .result-card:nth-child(1) .result-label,
#luminous-flux-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#luminous-flux-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#luminous-flux-calc .result-card:nth-child(2) .result-label,
#luminous-flux-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#luminous-flux-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#luminous-flux-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#luminous-flux-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #luminous-flux-calc{
    padding-top:12px;
  }

  #luminous-flux-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #luminous-flux-calc .unit-box{
    width:72px;
    font-size:15px;
  }

  #luminous-flux-calc input{
    font-size:15px;
    padding:0 10px;
  }

  #luminous-flux-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #luminous-flux-calc .result-card{
    padding:12px 10px;
  }

  #luminous-flux-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="luminous-flux-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Intensity (Luminous)</label>
      <div class="calc-row">
        <input type="number" id="tool_luminous_intensity" placeholder="Enter intensity">
        <div class="unit-box">mcd</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Angle (Beam)</label>
      <div class="calc-row">
        <input type="number" id="tool_beam_angle" placeholder="Enter angle">
        <div class="unit-box">°</div>
      </div>
    </div>

  </div>

  <button onclick="calculateFlux()">Calculate</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Luminous Flux</div>
      <div class="result-value"><span id="tool_luminous_flux">-</span> lm</div>
    </div>

    <div class="result-card">
      <div class="result-label">Solid Angle</div>
      <div class="result-value"><span id="solid_angle">-</span> sr</div>
    </div>

  </div>

  <div class="formula">
    Ω = 2π × (1 − cos(θ × π / 360))<br>
    Luminous Flux = Intensity × Ω / 1000
  </div>

</div>

<script>
function calculateFlux(){

  let intensity = Number(document.getElementById("tool_luminous_intensity").value);
  let angle = Number(document.getElementById("tool_beam_angle").value);

  let errorBox = document.getElementById("errorBox");

  if(!intensity || !angle){
    errorBox.style.display = "block";
    document.getElementById("tool_luminous_flux").innerText = "-";
    document.getElementById("solid_angle").innerText = "-";
    return;
  }

  errorBox.style.display = "none";

  /* Original formula kept:
     solid angle = 2 * PI * (1 - cos(angle * PI / 360))
     flux = intensity * solid angle / 1000
  */

  let solidAngle = 2 * Math.PI * (1 - Math.cos(angle * Math.PI / 360));
  let luminousFlux = intensity * solidAngle / 1000;

  document.getElementById("tool_luminous_flux").innerText = luminousFlux.toFixed(6);
  document.getElementById("solid_angle").innerText = solidAngle.toFixed(6);
}
</script>

</body>
</html>
