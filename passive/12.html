<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#capacitance-calc,
#capacitance-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  padding:10px;
}

#capacitance-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#capacitance-calc .calc-grid{
  display:grid;
  gap:12px;
}

#capacitance-calc .calc-label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#344054;
  margin-bottom:6px;
}

#capacitance-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#capacitance-calc input,
#capacitance-calc select{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 10px;
  font-size:14px;
  color:#111827;
  background:#fff;
  outline:none;
  text-align:center;
  text-align-last:center;
}

#capacitance-calc input:focus,
#capacitance-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#capacitance-calc .unit-box,
#capacitance-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  color:#111827;
}

#capacitance-calc .unit-select{
  padding:0 3px;
}

#capacitance-calc button{
  width:100%;
  height:45px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#capacitance-calc .result-title{
  margin-top:26px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
  color:#98a2b3;
  letter-spacing:.8px;
}

#capacitance-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#capacitance-calc .result-card{
  min-height:64px;
  padding:13px;
  border-radius:8px;
}

#capacitance-calc .blue{
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#capacitance-calc .green{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
}

#capacitance-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:8px;
}

#capacitance-calc .blue .result-label,
#capacitance-calc .blue .result-value{
  color:#2563eb;
}

#capacitance-calc .green .result-label,
#capacitance-calc .green .result-value{
  color:#059669;
}

#capacitance-calc .result-value{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

#capacitance-calc .formula-box{
  margin-top:14px;
  padding:14px;
  border-radius:9px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  color:#4b5563;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #capacitance-calc{
    padding-top:12px;
  }

  #capacitance-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #capacitance-calc .unit-box,
  #capacitance-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:12px;
  }

  #capacitance-calc input,
  #capacitance-calc select{
    font-size:14px;
    padding:0 8px;
  }

  #capacitance-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #capacitance-calc .result-card{
    padding:12px 10px;
  }

  #capacitance-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="capacitance-calc">

  <form id="tool-form">

    <div class="calc-grid">

      <div>
        <label class="calc-label">Charge</label>
        <div class="calc-row">
          <input type="number" id="charge" step="any">
          <select id="coulomb" class="unit-select">
            <option value="1">C</option>
            <option value="1000" selected>mC</option>
            <option value="1000000">µC</option>
          </select>
        </div>
      </div>

      <div>
        <label class="calc-label">Voltage</label>
        <div class="calc-row">
          <input id="voltage" type="number" step="any">
          <div class="unit-box">V</div>
        </div>
      </div>

    </div>

    <button type="button" id="calculate">Calculate</button>

    <div class="result-title">RESULTS</div>

    <div class="result-grid">

      <div class="result-card blue">
        <div class="result-label">Capacitance</div>
        <div class="result-value"><span id="answer">-</span> F</div>
      </div>

      <div class="result-card green">
        <div class="result-label">Formula</div>
        <div class="result-value">C = Q / V</div>
      </div>

    </div>

    <div class="formula-box">
      Capacitance = Charge / Voltage<br>
      C = Q / V<br>
      Charge conversion follows original code:<br>
      C selected: Q ÷ 1<br>
      mC selected: Q ÷ 1000<br>
      µC selected: Q ÷ 1000000
    </div>

  </form>

</div>

<script>
document.getElementById("calculate").addEventListener("click", function(e){
  e.preventDefault();

  var charge = Number(document.getElementById("charge").value);
  var voltage = Number(document.getElementById("voltage").value);
  var coulomb = Number(document.getElementById("coulomb").value);

  if(!charge || !voltage){
    document.getElementById("answer").innerText = "Enter values";
    return;
  }

  charge = charge / coulomb;
  var capacitance = charge / voltage;

  document.getElementById("answer").innerText = capacitance;
});
</script>

</body>
</html>
