<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#inductor-energy-calc,
#inductor-energy-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#inductor-energy-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#inductor-energy-calc .calc-grid{
  display:grid;
  gap:15px;
}

#inductor-energy-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#inductor-energy-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#inductor-energy-calc input{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#inductor-energy-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#inductor-energy-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#inductor-energy-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#inductor-energy-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#inductor-energy-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#inductor-energy-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#inductor-energy-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#inductor-energy-calc .result-card:nth-child(1) .result-label,
#inductor-energy-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#inductor-energy-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#inductor-energy-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#inductor-energy-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #inductor-energy-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #inductor-energy-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
  }

  #inductor-energy-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #inductor-energy-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="inductor-energy-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Inductance</label>
      <div class="calc-row">
        <input id="L" type="number" placeholder="Enter inductance">
        <div class="unit-box">µH</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Current</label>
      <div class="calc-row">
        <input id="I" type="number" placeholder="Enter current">
        <div class="unit-box">A</div>
      </div>
    </div>

  </div>

  <button onclick="computeInductorEnergy()">Calculate</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Energy</div>
      <div class="result-value">
        <span id="En">-</span> µJ
      </div>
    </div>

  </div>

  <div class="formula">
    Energy = I² × L / 2<br>
    L is converted from µH to H, then result is converted to µJ.
  </div>

</div>

<script>
function computeInductorEnergy(){

  const MEGA = 1000000;
  const L =
    Number(document.getElementById("L").value) / MEGA;

  const I =
    Number(document.getElementById("I").value);

  const Precision = 3;

  const errorBox =
    document.getElementById("errorBox");

  if(!L || !I || L <= 0 || I <= 0){
    errorBox.style.display = "block";
    document.getElementById("En").innerText = "-";
    return;
  }

  errorBox.style.display = "none";

  /* Original formula preserved */
  let En = I * I * L / 2;
  En *= MEGA;

  document.getElementById("En").innerText =
    En.toFixed(Precision);
}
</script>

</body>
</html>
