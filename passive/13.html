<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#capacitor-energy-calc,*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f7fb;padding:10px}
#capacitor-energy-calc{width:100%;max-width:620px;margin:auto;padding-top:14px}
.calc-grid{display:grid;gap:12px}
.calc-label{display:block;font-size:13px;font-weight:700;color:#344054;margin-bottom:6px}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:center}
input,select,.unit-box{
  width:100%;height:43px;border:1px solid #cfd6df;border-radius:8px;
  padding:0 10px;font-size:14px;background:#fff;text-align:center;outline:none;
}
input:focus,select:focus{border-color:#ff6a00;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.unit-box{display:flex;align-items:center;justify-content:center;font-weight:900;color:#111827}
.unit-select{width:82px;min-width:82px;font-size:12px;font-weight:800}
button{
  width:100%;height:45px;margin-top:22px;border:0;border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);color:#fff;
  font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 7px 16px rgba(255,91,0,.22)
}
.result-title{margin-top:26px;margin-bottom:12px;font-size:13px;font-weight:900;color:#98a2b3;letter-spacing:.8px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-card{padding:13px;border-radius:8px}
.blue{background:#eef5ff;border:1px solid #bcd7ff}
.green{background:#ecfdf5;border:1px solid #a7f3d0}
.result-label{font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
.blue .result-label,.blue .result-value{color:#2563eb}
.green .result-label,.green .result-value{color:#059669}
.result-value{font-size:15px;font-weight:900}
.formula-box{margin-top:14px;padding:14px;border-radius:9px;border:1px solid #e5e7eb;background:#f9fafb;color:#4b5563;font-size:13px;font-weight:700;line-height:1.6}

@media(max-width:600px){
  body{padding:0}
  .calc-row{grid-template-columns:minmax(0,1fr) 72px;gap:7px}
  .unit-select,.unit-box{width:72px;min-width:72px;font-size:12px}
  .result-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div id="capacitor-energy-calc">
<form id="tool">

  <div class="calc-grid">

    <div>
      <label class="calc-label">VIN</label>
      <div class="calc-row">
        <input id="Vc" type="number" step="any">
        <div class="unit-box">V</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Capacitance</label>
      <div class="calc-row">
        <input id="C" type="number" step="any">
        <select id="Cunit" class="unit-select">
          <option value="1e-6" selected>µF</option>
          <option value="1e-9">nF</option>
          <option value="1e-12">pF</option>
          <option value="1e-3">mF</option>
          <option value="1">F</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Resistance (Series)</label>
      <div class="calc-row">
        <input id="R" type="number" step="any">
        <select id="Runit" class="unit-select">
          <option value="1" selected>Ω</option>
          <option value="1000">kΩ</option>
          <option value="1000000">MΩ</option>
        </select>
      </div>
    </div>

  </div>

  <button type="button" id="tool_submit">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">
    <div class="result-card blue">
      <div class="result-label">Energy</div>
      <div class="result-value"><span id="energyOut">-</span> J</div>
    </div>

    <div class="result-card green">
      <div class="result-label">Time Constant</div>
      <div class="result-value"><span id="timeOut">-</span> Sec</div>
    </div>
  </div>

  <div class="formula-box">
    Energy = 0.5 × C × V²<br>
    Time Constant = R × C
  </div>

</form>
</div>

<script>
document.getElementById("tool_submit").addEventListener("click", function(){
  var Precision = 3;

  var Vc = Number(document.getElementById("Vc").value);
  var C = Number(document.getElementById("C").value) * Number(document.getElementById("Cunit").value);
  var R = Number(document.getElementById("R").value) * Number(document.getElementById("Runit").value);

  var timeConstant = R * C;
  var energy = C * Vc * Vc * 0.5;

  document.getElementById("energyOut").innerText = energy.toPrecision(Precision);
  document.getElementById("timeOut").innerText = timeConstant.toPrecision(Precision);
});
</script>

</body>
</html>
