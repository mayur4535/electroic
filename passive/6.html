<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#spz-calc,
#spz-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  padding:10px;
}

#spz-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#spz-calc .calc-grid{
  display:grid;
  gap:12px;
}

#spz-calc .calc-label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#344054;
  margin-bottom:6px;
}

#spz-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#spz-calc .full-row{
  grid-template-columns:1fr;
}

#spz-calc input,
#spz-calc select{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 10px;
  font-size:14px;
  color:#111827;
  background:#fff;
  outline:none;
  text-align:center;
  text-align-last:center;
}

#spz-calc select{
  appearance:auto;
  -webkit-appearance:menulist;
}

#spz-calc input:focus,
#spz-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#spz-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  font-size:13px;
  font-weight:800;
  padding:0 3px;
}

#spz-calc button{
  width:100%;
  height:45px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#spz-calc .result-title{
  margin-top:26px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
  color:#98a2b3;
  letter-spacing:.8px;
}

#spz-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#spz-calc .result-card{
  min-height:64px;
  padding:13px;
  border-radius:8px;
}

#spz-calc .blue{background:#eef5ff;border:1px solid #bcd7ff;}
#spz-calc .green{background:#ecfdf5;border:1px solid #a7f3d0;}
#spz-calc .purple{background:#f5f3ff;border:1px solid #ddd6fe;}
#spz-calc .orange{background:#fff7ed;border:1px solid #fed7aa;}

#spz-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:8px;
}

#spz-calc .blue .result-label,
#spz-calc .blue input{color:#2563eb;}

#spz-calc .green .result-label,
#spz-calc .green input{color:#059669;}

#spz-calc .purple .result-label,
#spz-calc .purple input{color:#7c3aed;}

#spz-calc .orange .result-label,
#spz-calc .orange input{color:#ea580c;}

#spz-calc .result-card input{
  height:auto;
  border:0;
  background:transparent;
  padding:0;
  font-size:15px;
  font-weight:900;
  text-align:left;
  text-align-last:left;
}

#spz-calc .formula-box{
  margin-top:14px;
  padding:14px;
  border-radius:9px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  color:#4b5563;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}

@media(max-width:600px){
  body{padding:0;}

  #spz-calc{
    padding-top:12px;
  }

  #spz-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #spz-calc .full-row{
    grid-template-columns:1fr;
  }

  #spz-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:12px;
  }

  #spz-calc input,
  #spz-calc select{
    font-size:14px;
    padding:0 8px;
  }

  #spz-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #spz-calc .result-card{
    padding:12px 10px;
  }

  #spz-calc .result-card input{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="spz-calc">

<form action="" method="POST" name="CalcSPZ" onsubmit="spCalculate(); return false;">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Select Converter</label>
      <div class="calc-row full-row">
        <select name="SerPar" tabindex="1" onchange="spDoText()">
          <option value="0" selected>Series to Parallel</option>
          <option value="1">Parallel to Series</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Resistance</label>
      <div class="calc-row">
        <input type="number" name="Valu1" size="20" maxlength="10" tabindex="2">
        <select name="Mult1" tabindex="3" class="unit-select">
          <option value="1000">KΩ</option>
          <option value="1" selected>Ω</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Component Type</label>
      <div class="calc-row full-row">
        <select name="React" tabindex="4" onchange="spDoText()">
          <option value="1" selected>Reactance</option>
          <option value="2">Capacitance</option>
          <option value="4">Inductance</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Reactance / Capacitance / Inductance Value</label>
      <div class="calc-row">
        <input type="number" name="Valu2" maxlength="10" tabindex="5">
        <select name="Mult2" tabindex="6" class="unit-select">
          <option value="1000">KΩ</option>
          <option value="1" selected>Ω</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Frequency</label>
      <div class="calc-row">
        <input type="number" name="Valu3" size="20" maxlength="10" tabindex="7">
        <select name="Mult3" tabindex="8" class="unit-select">
          <option value="1000000" selected>MHz</option>
          <option value="1000">KHz</option>
          <option value="1">Hz</option>
        </select>
      </div>
    </div>

  </div>

  <button type="button" name="Button" tabindex="9" onclick="spCalculate();">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card blue">
      <div class="result-label">R Series</div>
      <input type="text" name="rSeries" readonly value="-">
    </div>

    <div class="result-card green">
      <div class="result-label">R Parallel</div>
      <input type="text" name="rParallel" readonly value="-">
    </div>

    <div class="result-card purple">
      <div class="result-label">X Series</div>
      <input type="text" name="xSeries" readonly value="-">
    </div>

    <div class="result-card orange">
      <div class="result-label">X Parallel</div>
      <input type="text" name="xParallel" readonly value="-">
    </div>

    <div class="result-card blue">
      <div class="result-label">Series Component</div>
      <input type="text" name="sComponent" readonly value="-">
    </div>

    <div class="result-card green">
      <div class="result-label">Parallel Component</div>
      <input type="text" name="pComponent" readonly value="-">
    </div>

    <div class="result-card purple">
      <div class="result-label">Frequency</div>
      <input type="text" name="frequency" readonly value="-">
    </div>

  </div>

  <div class="formula-box">
    Series to Parallel:<br>
    Rp = Rs × (1 + Xs² / Rs²)<br>
    Xp = Xs × (1 + Rs² / Xs²)<br><br>
    Parallel to Series:<br>
    Rs = (Rp × Xp²) / (Rp² + Xp²)<br>
    Xs = (Xp × Rp²) / (Rp² + Xp²)<br><br>
    Capacitance: Xc = -1 / (2πfC)<br>
    Inductance: XL = 2πfL
  </div>

</form>

</div>

<script>
function gSetRange(v, ch) {
   var pwr, sy;
   var sign = "";
   var sym = "GMK mľnp";
   var k = 0;
   if (! isFinite(v)) {
      return (v + " " + ch);
      }
   if (v == 0) {
      return (v + ".0 " + ch);
      }
   if (v < 0) {
      sign = "-";
      v = -v;
      }
   if (v < 1e-12) {
      v = v * 1e12; 
      return sign + v.toExponential(6) + " p" + ch;
      }
   if (v > 1e12) {
      v = v * 1e-12;
      return sign + v.toExponential(6) + " G" + ch;
      }
   else {
      do {
         pwr = Math.pow(10, 9 - (3 * k));
         if (Math.abs(v) >= pwr) {
            v = v / pwr;
            sy = sym[k];
            k = 8;
            }
         ++k;
         } while (k < 8);
      v = v.toFixed(6);
      k = v.length;
      while ((v[k-1] == 0) && (v.length - k < 5)) {
         k--
         }
      v = v.substring(0, k);
      if (sy == " ") {
         sy = "";
         }
      return (sign + v + " " + sy + ch);
      }
   }

function gSetMultipliers(selOpts, ch, allowed, myDefault) {
   var sy, myOpt, txt, val, def;
   var sym = "GMK mľnp";
   var pow = 1e9;
   var key = 0x80;
   var k = 0;
   selOpts.length = 0;
   do {
      if (allowed & key) {
         sy = sym[k];
         myOpt = new Option(sy + ch, pow, (myDefault & key), (myDefault & key));
         selOpts[selOpts.length] = myOpt;
         }
      pow = pow/1000;
      key >>>= 1;
      ++k;
      } while (k < 8);
   }

function gGetPopupSelected(theControl) {
   return theControl.selectedIndex;
   }

function gSetPopupSelected(theControl, theSelected) {
    theControl.selectedIndex = theSelected;
   }

function spzInit() {
   gSetMultipliers(document.CalcSPZ.Mult1.options, "\u03a9 series", 0x30, 0x10);
   gSetMultipliers(document.CalcSPZ.Mult2.options, "\u03a9 series", 0x30, 0x10);
   gSetMultipliers(document.CalcSPZ.Mult3.options, "Hz", 0x70, 0x40);
   }

function spzHelp() {
   var w = window.open ("Help_SPZ.html", "help", "width = 400, height=350, status=yes, resizable=yes");
   }

function spDoText() {
   var theSelected = 0x10;
   var unit = Number(document.CalcSPZ.React.value);
   var sp = Number(document.CalcSPZ.SerPar.value);
   var opt1 = document.CalcSPZ.Mult1.options;
   var opt2 = document.CalcSPZ.Mult2.options;
      if (opt1[0].selected == true) {
         theSelected = 0x20;
         }
   var sORp = "";
   if (sp == 1) {
      sORp = " ";
      }
   gSetMultipliers (opt1, "\u03a9" + sORp, 0x30, theSelected);
   switch (unit) {
      case 1:
      gSetMultipliers (opt2, "\u03a9" + sORp, 0x30, 0x10);
      break;
      case 2:
      gSetMultipliers (opt2, "F" + sORp, 0x1F, 0x04);
      break;
      case 4:
      gSetMultipliers (opt2, "H" + sORp, 0x1C, 0x08);
      break;
   }
}

function display(rs, xs, sComp, f, rp, xp, pComp) {
   var m;
   var comp = "H";
   if ((xs + xp) < 0) {
      comp = "F";
      }
   m = gSetRange(rs, "\u03a9");
   document.CalcSPZ.rSeries.value = m;
   m = gSetRange(xs, "\u03a9");
   document.CalcSPZ.xSeries.value = m;
   m = gSetRange(rp, "\u03a9");
   document.CalcSPZ.rParallel.value = m;
   m = gSetRange(xp, "\u03a9");
   document.CalcSPZ.xParallel.value = m;
   if (f > 0) {
      m = gSetRange(sComp, comp);
      document.CalcSPZ.sComponent.value = m;
      m = gSetRange(pComp, comp);
      document.CalcSPZ.pComponent.value = m;
      m = gSetRange(f, "Hz");
      document.CalcSPZ.frequency.value = m;
      }
   else {
      m = "No frequency specified"
      document.CalcSPZ.sComponent.value = m;
      document.CalcSPZ.pComponent.value = m;
      document.CalcSPZ.frequency.value  = m;
      }
   }

function psCalc(unit, rp, valu, f) {
   var xp, rs, xs, pComp, sComp, denom;
   var pi2 = 2 * Math.PI;
   switch (unit) {
      case 1:
         xp = valu;
         if (f != 0) {
            if (xp >= 0) {
               pComp = xp/(pi2 * f);
               }
            else {
               pComp = -1/(pi2 * f * xp);
               }
            }
         break;
      case 2:
         pComp = valu;
         xp = -1/(pi2 * f * valu);
         break;
      case 4:
         pComp = valu;
         xp = (pi2 * f * valu);
         break;
      }
   denom = (rp * rp) + (xp * xp);
   rs = (rp * xp * xp)/denom;
   xs = (xp * rp * rp)/denom;
   if (f != 0) {
      if (xp >= 0) {
         sComp = xs/(pi2 * f);
         }
      else {
         sComp = -1/(pi2 * f * xs);
         }
      }
   display(rs, xs, sComp, f, rp, xp, pComp);
  }

function spCalc(unit, rs, valu, f) {
   var xs, rp, xp, sComp, pComp;
   var pi2 = 2 * Math.PI;
   switch (unit) {
      case 1:
         xs = valu;
         if (f != 0) {
            if (xs >= 0) {
               sComp = xs/(pi2 * f);
               }
            else {
               sComp = -1/(pi2 * f * xs);
               }
            }
         break;
      case 2:
         sComp = valu;
         xs = -1/(pi2 * f * valu);
         break;
      case 4:
         sComp = valu;
         xs = (pi2 * f * valu);
         break;
      }
   rp = rs * (1 + (xs * xs)/(rs * rs));
   xp = xs * (1 + (rs * rs)/(xs * xs));
   if (f != 0) {
      if (xs >= 0) {
         pComp = xp/(pi2 * f);
         }
      else {
         pComp = -1/(pi2 * f * xp);
         }
      }
   display(rs, xs, sComp, f, rp, xp, pComp);
  }

function spCalculate() {
   var sp = Number(document.CalcSPZ.SerPar.value);
   var unit = Number(document.CalcSPZ.React.value);
   var mult1 = Number(document.CalcSPZ.Mult1.value);
   var mult2 = Number(document.CalcSPZ.Mult2.value);
   var mult3 = Number(document.CalcSPZ.Mult3.value);
   var valu1 = Number(document.CalcSPZ.Valu1.value);
   var valu2 = Number(document.CalcSPZ.Valu2.value);
   var valu3 = Number(document.CalcSPZ.Valu3.value);
     if ((unit != 1) && (valu3 == 0)) {
      ;
      }
   else {
      switch(unit + (8 * sp)) {
         case 1:
         case 2:
         case 4:
            spCalc(unit, mult1 * valu1, mult2 * valu2, mult3 * valu3);
            break;
         case 9:
         case 10:
         case 12:
            psCalc(unit, mult1 * valu1, mult2 * valu2, mult3 * valu3);
            break;
         }
      }
   }

document.addEventListener("DOMContentLoaded", function(){
  spzInit();
  spDoText();
});
</script>

</body>
</html>
