<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#interdigital-cap-calc,
#interdigital-cap-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:12px;
}

#interdigital-cap-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  background:#fff;
  padding:20px;
  border:1px solid #e5e7eb;
  border-radius:10px;
}

#interdigital-cap-calc .calc-grid{
  display:grid;
  gap:15px;
}

#interdigital-cap-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#interdigital-cap-calc .calc-row{
  width:100%;
  display:flex;
  gap:8px;
  align-items:center;
}

#interdigital-cap-calc input{
  flex:1;
  min-width:0;
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#interdigital-cap-calc .unit-box{
  flex:0 0 82px;
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#interdigital-cap-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#interdigital-cap-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#interdigital-cap-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#interdigital-cap-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#interdigital-cap-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
  color:#2563eb;
}

#interdigital-cap-calc .result-value{
  font-size:16px;
  font-weight:900;
  color:#059669;
  word-break:break-word;
}

#interdigital-cap-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  body{padding:10px}

  #interdigital-cap-calc{
    padding:16px;
  }

  #interdigital-cap-calc .calc-row{
    gap:7px;
  }

  #interdigital-cap-calc .unit-box{
    flex:0 0 72px;
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }

  #interdigital-cap-calc input{
    font-size:15px;
    padding:0 10px;
  }
}
</style>
</head>

<body>

<div id="interdigital-cap-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Dielectric</label>
      <div class="calc-row">
        <input type="number" id="Er">
        <div class="unit-box">εr</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Number Finger</label>
      <div class="calc-row">
        <input type="number" id="n">
        <div class="unit-box">No.</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Length Finger</label>
      <div class="calc-row">
        <input type="number" id="len">
        <div class="unit-box">cm</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Width Base Finger</label>
      <div class="calc-row">
        <input type="number" id="W">
        <div class="unit-box">cm</div>
      </div>
    </div>

  </div>

  <button onclick="calc()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-card">
    <div class="result-label">Capacitance Interdigital</div>
    <div class="result-value"><span id="capacitance">-</span> pF/cm</div>
  </div>

  <div class="formula">
    C = ((Er + 1) / W) × Length × (((n − 3) × 0.089) + 0.10)
  </div>

</div>

<script>
function calc(){
  Er = Number(document.getElementById("Er").value);
  n = Number(document.getElementById("n").value);
  len = Number(document.getElementById("len").value);
  W = Number(document.getElementById("W").value);

  if(!Er || !n || !len || !W){
    document.getElementById("capacitance").innerText = "Enter values";
    return;
  }

  c1 = ((Er + 1) / W);
  c = (c1 * len * (((n - 3) * 0.089) + 0.10));

  document.getElementById("capacitance").innerText = c.toFixed(3);
}
</script>

</body>
</html>
