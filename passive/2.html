<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#inductor-saturation-calc,
#inductor-saturation-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:10px;
}

#inductor-saturation-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
  border-radius:0;
}

#inductor-saturation-calc .calc-grid{
  display:grid;
  gap:15px;
}

#inductor-saturation-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#inductor-saturation-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#inductor-saturation-calc input{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#inductor-saturation-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#inductor-saturation-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#inductor-saturation-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#inductor-saturation-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#inductor-saturation-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#inductor-saturation-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#inductor-saturation-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#inductor-saturation-calc .result-card:nth-child(1) .result-label,
#inductor-saturation-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#inductor-saturation-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#inductor-saturation-calc .result-card:nth-child(2) .result-label,
#inductor-saturation-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#inductor-saturation-calc .result-card:nth-child(3){
  background:#f5f3ff;
  border:1px solid #ddd6fe;
}

#inductor-saturation-calc .result-card:nth-child(3) .result-label,
#inductor-saturation-calc .result-card:nth-child(3) .result-value{
  color:#7c3aed;
}

#inductor-saturation-calc .result-card:nth-child(4){
  background:#fff7ed;
  border:1px solid #fed7aa;
}

#inductor-saturation-calc .result-card:nth-child(4) .result-label,
#inductor-saturation-calc .result-card:nth-child(4) .result-value{
  color:#ea580c;
}

#inductor-saturation-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#inductor-saturation-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#inductor-saturation-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #inductor-saturation-calc{
    padding-top:12px;
  }

  #inductor-saturation-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #inductor-saturation-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }

  #inductor-saturation-calc input{
    font-size:15px;
    padding:0 10px;
  }

  #inductor-saturation-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #inductor-saturation-calc .result-card{
    padding:12px 10px;
  }

  #inductor-saturation-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="inductor-saturation-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Voltage Across Inductor</label>
      <div class="calc-row">
        <input type="number" id="V">
        <div class="unit-box">V</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Inductance</label>
      <div class="calc-row">
        <input type="number" id="L">
        <div class="unit-box">µH</div>
      </div>
    </div>

    <div>
      <label class="calc-label">I<sub>SAT</sub> Saturation Current</label>
      <div class="calc-row">
        <input type="number" id="Isat">
        <div class="unit-box">A</div>
      </div>
    </div>

  </div>

  <button onclick="computeInductor()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">T On Max</div>
      <div class="result-value"><span id="Tonmax">-</span> µsec</div>
    </div>

    <div class="result-card">
      <div class="result-label">Frequency Min</div>
      <div class="result-value"><span id="Fmin">-</span> KHz</div>
    </div>

    <div class="result-card">
      <div class="result-label">Power Max</div>
      <div class="result-value"><span id="Pmax">-</span> W</div>
    </div>

    <div class="result-card">
      <div class="result-label">Energy Saturation</div>
      <div class="result-value"><span id="Esat">-</span> µJ</div>
    </div>

  </div>

  <div class="formula">
    Tonmax = Isat × L / V<br>
    Fmin = 1 / (2 × Tonmax)<br>
    Pmax = V × Isat / √6<br>
    Esat = Isat² × L / 2
  </div>

</div>

<script>
function computeInductor(){
  const MEGA = 1000000;
  const KILO = 1000;

  let V = Number(document.getElementById("V").value);
  let L = Number(document.getElementById("L").value) / MEGA;
  let Isat = Number(document.getElementById("Isat").value);
  let Precision = 3;

  let outputs = ["Tonmax","Fmin","Pmax","Esat"];

  if(!V || !L || !Isat){
    outputs.forEach(id => document.getElementById(id).innerText = "Enter values");
    return;
  }

  let Tonmax = Isat * L / V;
  let Fmin = 1 / (2 * Tonmax);
  let Pmax = V * Isat / Math.sqrt(6);
  let Esat = Isat * Isat * L / 2;

  Tonmax *= MEGA;
  Fmin /= KILO;
  Esat *= MEGA;

  document.getElementById("Tonmax").innerText = Tonmax.toFixed(Precision);
  document.getElementById("Fmin").innerText = Fmin.toFixed(Precision);
  document.getElementById("Pmax").innerText = Pmax.toFixed(Precision);
  document.getElementById("Esat").innerText = Esat.toFixed(Precision);
}
</script>

</body>
</html>
