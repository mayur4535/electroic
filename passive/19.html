<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#ohms-law-calc,
#ohms-law-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#ohms-law-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#ohms-law-calc .calc-grid{
  display:grid;
  gap:15px;
}

#ohms-law-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#ohms-law-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
}

#ohms-law-calc input,
#ohms-law-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#ohms-law-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#ohms-law-calc .unit-box{
  width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
}

#ohms-law-calc input:focus,
#ohms-law-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#ohms-law-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#ohms-law-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#ohms-law-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #ohms-law-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #ohms-law-calc .unit-box{
    width:72px;
  }
}
</style>
</head>

<body>

<div id="ohms-law-calc">

  <div class="result-title" style="margin-top:0;margin-bottom:18px;">
    ENTER ANY TWO VALUES
  </div>

  <div class="calc-grid">

    <div>
      <label class="calc-label">Voltage</label>
      <div class="calc-row">
        <input id="vo" type="number" placeholder="Enter voltage">
        <div class="unit-box">V</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Current</label>
      <div class="calc-row">
        <input id="cu" type="number" placeholder="Enter current">
        <select id="cu_unit">
          <option value="1">A</option>
          <option value="0.001">mA</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Resistance</label>
      <div class="calc-row">
        <input id="re" type="number" placeholder="Enter resistance">
        <select id="re_unit">
          <option value="1">Ω</option>
          <option value="1000">kΩ</option>
          <option value="1000000">MΩ</option>
          <option value="1000000000">GΩ</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Power</label>
      <div class="calc-row">
        <input id="po" type="number" placeholder="Enter power">
        <div class="unit-box">W</div>
      </div>
    </div>

  </div>

  <button onclick="calculateOhmsLaw()">Calculate</button>

  <div id="errorBox">
    Enter any two valid values.
  </div>

  <div class="formula">
    V = I × R<br>
    P = V × I<br>
    R = V / I<br>
    I = V / R
  </div>

</div>

<script>
function getRawVal(id){
  const val = document.getElementById(id).value;
  return val === "" ? null : parseFloat(val);
}

function setVal(id,val){
  if(isFinite(val)){
    document.getElementById(id).value = parseFloat(val).toFixed(2);
  }
}

function calculateOhmsLaw(){

  let V = getRawVal("vo");

  let I_raw = getRawVal("cu");
  let R_raw = getRawVal("re");

  let P = getRawVal("po");

  let currentUnit = parseFloat(document.getElementById("cu_unit").value);
  let resistanceUnit = parseFloat(document.getElementById("re_unit").value);

  let I = I_raw !== null && !isNaN(I_raw) ? I_raw * currentUnit : null;
  let R = R_raw !== null && !isNaN(R_raw) ? R_raw * resistanceUnit : null;

  const errorBox = document.getElementById("errorBox");

  let count = [V,I,R,P].filter(v => v !== null && !isNaN(v)).length;

  if(count < 2){
    errorBox.style.display = "block";
    return;
  }

  errorBox.style.display = "none";

  if(V !== null && I !== null){
    R = V / I;
    P = V * I;
  }
  else if(V !== null && R !== null){
    I = V / R;
    P = V * I;
  }
  else if(V !== null && P !== null){
    I = P / V;
    R = V / I;
  }
  else if(I !== null && R !== null){
    V = I * R;
    P = V * I;
  }
  else if(I !== null && P !== null){
    V = P / I;
    R = V / I;
  }
  else if(R !== null && P !== null){
    I = Math.sqrt(P / R);
    V = I * R;
  }

  setVal("vo",V);

  document.getElementById("cu").value =
    isFinite(I) ? (I / currentUnit).toFixed(2) : "";

  document.getElementById("re").value =
    isFinite(R) ? (R / resistanceUnit).toFixed(2) : "";

  setVal("po",P);
}
</script>

</body>
</html>
