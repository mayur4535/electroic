<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#reactance-calc,
#reactance-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#reactance-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#reactance-calc .calc-grid{
  display:grid;
  gap:15px;
}

#reactance-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#reactance-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
}

#reactance-calc input,
#reactance-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#reactance-calc select{
  text-align:center;
  font-weight:700;
  padding:0 6px;
}

#reactance-calc .unit-box{
  width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#reactance-calc input:focus,
#reactance-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#reactance-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#reactance-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#reactance-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#reactance-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#reactance-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#reactance-calc .result-card:nth-child(1) .result-label,
#reactance-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#reactance-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#reactance-calc .result-card:nth-child(2) .result-label,
#reactance-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#reactance-calc .result-card:nth-child(3){
  background:#f5f3ff;
  border:1px solid #ddd6fe;
}

#reactance-calc .result-card:nth-child(3) .result-label,
#reactance-calc .result-card:nth-child(3) .result-value{
  color:#7c3aed;
}

#reactance-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#reactance-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#reactance-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #reactance-calc{
    padding-top:12px;
  }

  #reactance-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #reactance-calc .unit-box{
    width:72px;
    font-size:15px;
  }

  #reactance-calc input,
  #reactance-calc select{
    font-size:15px;
    padding:0 10px;
  }

  #reactance-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #reactance-calc .result-card{
    padding:12px 10px;
  }

  #reactance-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="reactance-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Select Mode</label>

      <div class="calc-row">
        <select id="ind-unit">
          <option value="1">L Inductance (nH)</option>
          <option value="2">R Reactance</option>
        </select>

        <div class="unit-box">MODE</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Inductance / Reactance</label>

      <div class="calc-row">
        <input type="number" id="ind" placeholder="Enter value">

        <div class="unit-box">VAL</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Frequency</label>

      <div class="calc-row">
        <input type="number" id="fr" placeholder="Enter frequency">

        <select id="fr-unit">
          <option value="1">GHz</option>
          <option value="0.001">MHz</option>
        </select>
      </div>
    </div>

  </div>

  <button id="calculate">Calculate</button>

  <div id="errorBox">Please enter valid values.</div>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Inductance</div>
      <div class="result-value">
        <span id="ans1">-</span> nH
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Reactance</div>
      <div class="result-value">
        <span id="ans2">-</span> Ω
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Admittance</div>
      <div class="result-value">
        <span id="ans3">-</span> m-m
      </div>
    </div>

  </div>

  <div class="formula">
    Reactance = 2πfL<br>
    Inductance = X / (2πf)<br>
    Admittance = 1000 / Reactance
  </div>

</div>

<script>
document.getElementById("calculate").addEventListener("click", function(){

  let ind = Number(document.getElementById("ind").value);
  let fr = Number(document.getElementById("fr").value);
  let frUnit = Number(document.getElementById("fr-unit").value);
  let mode = document.getElementById("ind-unit").value;

  let errorBox = document.getElementById("errorBox");

  if(!ind || !fr){
    errorBox.style.display = "block";

    document.getElementById("ans1").innerText = "-";
    document.getElementById("ans2").innerText = "-";
    document.getElementById("ans3").innerText = "-";

    return;
  }

  errorBox.style.display = "none";

  fr *= frUnit;

  let inductance;
  let reactance;
  let admittance;

  /* Original formula kept same from uploaded code */

  if(mode == "1"){

    inductance = ind;

    reactance = 2 * Math.PI * fr * inductance;

    admittance = 1000 / reactance;

  }else{

    reactance = ind;

    inductance = reactance / (2 * Math.PI * fr);

    admittance = 1000 / reactance;
  }

  document.getElementById("ans1").innerText =
    parseFloat(inductance).toFixed(6);

  document.getElementById("ans2").innerText =
    parseFloat(reactance).toFixed(6);

  document.getElementById("ans3").innerText =
    parseFloat(admittance).toFixed(3);
});
</script>

</body>
</html>
