<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#crystal-calc,
#crystal-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f8fb;
  padding:10px;
}

#crystal-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
  border-radius:0;
}

#crystal-calc .calc-grid{
  display:grid;
  gap:15px;
}

#crystal-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#crystal-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#crystal-calc input{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  color:#111827;
  background:#fff;
  outline:none;
}

#crystal-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#111827;
}

#crystal-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#crystal-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#crystal-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
  letter-spacing:.5px;
}

#crystal-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#crystal-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#crystal-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}
#crystal-calc .result-card:nth-child(1) .result-label,
#crystal-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#crystal-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}
#crystal-calc .result-card:nth-child(2) .result-label,
#crystal-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#crystal-calc .result-card:nth-child(3){
  background:#f5f3ff;
  border:1px solid #ddd6fe;
}
#crystal-calc .result-card:nth-child(3) .result-label,
#crystal-calc .result-card:nth-child(3) .result-value{
  color:#7c3aed;
}

#crystal-calc .result-card:nth-child(4){
  background:#fff7ed;
  border:1px solid #fed7aa;
}
#crystal-calc .result-card:nth-child(4) .result-label,
#crystal-calc .result-card:nth-child(4) .result-value{
  color:#ea580c;
}

#crystal-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#crystal-calc .result-value{
  font-size:16px;
  font-weight:900;
  word-break:break-word;
}

#crystal-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #crystal-calc{
    padding-top:12px;
  }

  #crystal-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #crystal-calc input{
    font-size:15px;
    padding:0 10px;
  }

  #crystal-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:15px;
  }

  #crystal-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #crystal-calc .result-card{
    padding:12px 10px;
  }

  #crystal-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="crystal-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Resistance Series</label>
      <div class="calc-row">
        <input type="number" id="Rs">
        <div class="unit-box">Ω</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Capacitance Series</label>
      <div class="calc-row">
        <input type="number" id="Cs">
        <div class="unit-box">fF</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Capacitance Parallel</label>
      <div class="calc-row">
        <input type="number" id="Cp">
        <div class="unit-box">pF</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Inductance Series</label>
      <div class="calc-row">
        <input type="number" id="Ls">
        <div class="unit-box">mH</div>
      </div>
    </div>

  </div>

  <button onclick="calc()">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Frequency Series</div>
      <div class="result-value"><span id="Fs">-</span> Hz</div>
    </div>

    <div class="result-card">
      <div class="result-label">Frequency Parallel</div>
      <div class="result-value"><span id="Fp">-</span> Hz</div>
    </div>

    <div class="result-card">
      <div class="result-label">Q-Factor Crystal</div>
      <div class="result-value"><span id="Q">-</span></div>
    </div>

    <div class="result-card">
      <div class="result-label">Pulling Factor Crystal</div>
      <div class="result-value"><span id="pulling_factor">-</span></div>
    </div>

  </div>

  <div class="formula">
    Fs = 1 / (2π√(Ls × Cs))<br>
    Fp = 1 / (2π√(Ls × ((Cs × Cp) / (Cs + Cp))))<br>
    Q = 1 / (2π × Fs × Rs × Cs)<br>
    Pulling Factor = Cp / Cs
  </div>

</div>

<script>
function calc(){
  let Rs = Number(document.getElementById("Rs").value);
  let Cs = Number(document.getElementById("Cs").value);
  let Cp = Number(document.getElementById("Cp").value);
  let Ls = Number(document.getElementById("Ls").value);

  let outputs = ["Fs","Fp","Q","pulling_factor"];

  if(!Rs || !Cs || !Cp || !Ls){
    outputs.forEach(id => document.getElementById(id).innerText = "Enter values");
    return;
  }

  Cs = Cs * Math.pow(10,-15);
  Cp = Cp * Math.pow(10,-12);
  Ls = Ls * Math.pow(10,-3);

  let var1 = Math.pow((Ls * Cs),0.5);
  let var2 = Ls * ((Cs * Cp) / (Cs + Cp));
  let c1 = 1 / (2 * Math.PI * var1);
  let c2 = 1 / (2 * Math.PI * Math.pow(var2,0.5));
  let c3 = 1 / (2 * Math.PI * c1 * Rs * Cs);
  let c4 = Cp / Cs;

  document.getElementById("Fs").innerText = c1.toFixed(3);
  document.getElementById("Fp").innerText = c2.toFixed(3);
  document.getElementById("Q").innerText = c3.toFixed(3);
  document.getElementById("pulling_factor").innerText = c4.toFixed(3);
}
</script>

</body>
</html>
