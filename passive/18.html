<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#led-resistor-calc,
#led-resistor-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f6f8fb;
  padding:10px;
}

#led-resistor-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
}

#led-resistor-calc .calc-grid{
  display:grid;
  gap:15px;
}

#led-resistor-calc .calc-label{
  display:block;
  font-size:15px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:7px;
}

#led-resistor-calc .calc-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
}

#led-resistor-calc input,
#led-resistor-calc select{
  width:100%;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

#led-resistor-calc select{
  text-align:center;
  font-weight:700;
}

#led-resistor-calc .unit-box{
  width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
}

#led-resistor-calc input:focus,
#led-resistor-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#customVoltageBox{
  display:none;
}

#led-resistor-calc button{
  width:100%;
  height:45px;
  margin-top:24px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#led-resistor-calc .result-title{
  margin-top:30px;
  margin-bottom:14px;
  font-size:14px;
  font-weight:800;
  color:#a7afbd;
}

#led-resistor-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

#led-resistor-calc .result-card{
  min-height:64px;
  padding:14px;
  border-radius:9px;
}

#led-resistor-calc .result-card:nth-child(1){
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#led-resistor-calc .result-card:nth-child(2){
  background:#ecfdf5;
  border:1px solid #bbf7d0;
}

#led-resistor-calc .result-card:nth-child(3){
  background:#f5f3ff;
  border:1px solid #ddd6fe;
}

/* FIXED RESULT FONT COLORS */

#led-resistor-calc .result-card:nth-child(1) .result-label,
#led-resistor-calc .result-card:nth-child(1) .result-value{
  color:#2563eb;
}

#led-resistor-calc .result-card:nth-child(2) .result-label,
#led-resistor-calc .result-card:nth-child(2) .result-value{
  color:#059669;
}

#led-resistor-calc .result-card:nth-child(3) .result-label,
#led-resistor-calc .result-card:nth-child(3) .result-value{
  color:#7c3aed;
}

#led-resistor-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

#led-resistor-calc .result-value{
  font-size:16px;
  font-weight:900;
}

#led-resistor-calc .formula{
  margin-top:18px;
  padding:14px;
  border-radius:9px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  font-size:14px;
  line-height:1.6;
  color:#667085;
  font-weight:700;
}

#errorBox{
  display:none;
  margin-top:12px;
  color:#dc2626;
  font-size:14px;
  font-weight:800;
}

@media(max-width:600px){

  body{
    padding:0;
  }

  #led-resistor-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
  }

  #led-resistor-calc .unit-box{
    width:72px;
  }

  #led-resistor-calc .result-grid{
    grid-template-columns:1fr 1fr;
  }

  #led-resistor-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="led-resistor-calc">

  <div class="calc-grid">

    <div>
      <label class="calc-label">VIN</label>

      <div class="calc-row">
        <input id="sv" type="number" placeholder="Supply voltage">
        <div class="unit-box">V</div>
      </div>
    </div>

    <div>
      <label class="calc-label">LED Voltage</label>

      <div class="calc-row">

        <select id="fv" onchange="toggleCustomVoltage()">

          <option value="2">2 Red</option>
          <option value="2.1">2.1 Green</option>
          <option value="3.6">3.6 Blue</option>
          <option value="3.6">3.6 White</option>
          <option value="2.1">2.1 Yellow</option>
          <option value="2.2">2.2 Orange</option>
          <option value="2.1">2.1 Amber</option>
          <option value="1.7">1.7 Infrared</option>
          <option value="2">2 Other</option>

          <option value="custom">Custom</option>

        </select>

        <div class="unit-box">V</div>

      </div>
    </div>

    <div id="customVoltageBox">

      <label class="calc-label">Custom LED Voltage</label>

      <div class="calc-row">
        <input id="customVoltage" type="number" placeholder="Custom voltage">
        <div class="unit-box">V</div>
      </div>

    </div>

    <div>
      <label class="calc-label">LED Current</label>

      <div class="calc-row">
        <input id="fc" type="number" placeholder="LED current">
        <div class="unit-box">mA</div>
      </div>
    </div>

    <div>
      <label class="calc-label">Number of LED</label>

      <div class="calc-row">
        <input id="led" type="number" placeholder="LED quantity">
        <div class="unit-box">PCS</div>
      </div>
    </div>

  </div>

  <button onclick="calculateLedResistor()">Calculate</button>

  <div id="errorBox"></div>

  <div class="result-title">
    RESULTS
  </div>

  <div class="result-grid">

    <div class="result-card">
      <div class="result-label">Resistor</div>
      <div class="result-value">
        <span id="a1">-</span> Ω
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Wattage</div>
      <div class="result-value">
        <span id="a2">-</span> W
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Power</div>
      <div class="result-value">
        <span id="a3">-</span> W
      </div>
    </div>

  </div>

  <div class="formula">

    Total LED Voltage = LED Voltage × Number of LED<br>

    Resistor = (VIN − Total LED Voltage) / Current<br>

    Power = Voltage × Current

  </div>

</div>

<script>

function toggleCustomVoltage(){

  const box =
    document.getElementById("customVoltageBox");

  box.style.display =
    document.getElementById("fv").value === "custom"
    ? "block"
    : "none";
}

function calculateLedResistor(){

  const vin =
    parseFloat(document.getElementById("sv").value);

  const fvSelect =
    document.getElementById("fv").value;

  const customV =
    parseFloat(document.getElementById("customVoltage").value);

  const ledVoltage =
    fvSelect === "custom"
    ? customV
    : parseFloat(fvSelect);

  const currentmA =
    parseFloat(document.getElementById("fc").value);

  const ledCount =
    parseFloat(document.getElementById("led").value);

  const errorBox =
    document.getElementById("errorBox");

  document.getElementById("a1").innerText = "-";
  document.getElementById("a2").innerText = "-";
  document.getElementById("a3").innerText = "-";

  if(
    Number.isNaN(vin) ||
    Number.isNaN(ledVoltage) ||
    Number.isNaN(currentmA) ||
    Number.isNaN(ledCount) ||
    vin <= 0 ||
    ledVoltage <= 0 ||
    currentmA <= 0 ||
    ledCount <= 0
  ){

    errorBox.innerText =
      "Please enter all valid positive values.";

    errorBox.style.display = "block";

    return;
  }

  const totalLedVoltage =
    ledVoltage * ledCount;

  const resistorVoltage =
    vin - totalLedVoltage;

  if(resistorVoltage <= 0){

    errorBox.innerText =
      "VIN must be higher than total LED voltage.";

    errorBox.style.display = "block";

    document.getElementById("a1").innerText = "NA";
    document.getElementById("a2").innerText = "NA";
    document.getElementById("a3").innerText = "NA";

    return;
  }

  errorBox.style.display = "none";

  const currentA =
    currentmA / 1000;

  const resistor =
    resistorVoltage / currentA;

  const power =
    resistorVoltage * currentA;

  let wattage;

  if(power <= 0.125){
    wattage = "0.125";
  }else if(power <= 0.25){
    wattage = "0.25";
  }else if(power <= 0.5){
    wattage = "0.5";
  }else if(power <= 1){
    wattage = "1";
  }else if(power <= 2){
    wattage = "2";
  }else if(power <= 3){
    wattage = "3";
  }else{
    wattage = ">3";
  }

  document.getElementById("a1").innerText =
    Math.round(resistor);

  document.getElementById("a3").innerText =
    power.toFixed(4);

  document.getElementById("a2").innerText =
    wattage;
}

</script>

</body>
</html>
