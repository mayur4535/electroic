<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#capacitive-reactance-calc,
#capacitive-reactance-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  padding:10px;
}

#capacitive-reactance-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#capacitive-reactance-calc .calc-grid{
  display:grid;
  gap:12px;
}

#capacitive-reactance-calc .calc-label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#344054;
  margin-bottom:6px;
}

#capacitive-reactance-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#capacitive-reactance-calc input,
#capacitive-reactance-calc select{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 10px;
  font-size:14px;
  color:#111827;
  background:#fff;
  outline:none;
  text-align:center;
  text-align-last:center;
}

#capacitive-reactance-calc input:focus,
#capacitive-reactance-calc select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#capacitive-reactance-calc .unit-select{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  font-size:12px;
  font-weight:800;
  padding:0 3px;
}

#capacitive-reactance-calc button{
  width:100%;
  height:45px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#capacitive-reactance-calc .result-title{
  margin-top:26px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
  color:#98a2b3;
  letter-spacing:.8px;
}

#capacitive-reactance-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#capacitive-reactance-calc .result-card{
  min-height:64px;
  padding:13px;
  border-radius:8px;
}

#capacitive-reactance-calc .blue{
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#capacitive-reactance-calc .green{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
}

#capacitive-reactance-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:8px;
}

#capacitive-reactance-calc .blue .result-label,
#capacitive-reactance-calc .blue .result-value{
  color:#2563eb;
}

#capacitive-reactance-calc .green .result-label,
#capacitive-reactance-calc .green .result-value{
  color:#059669;
}

#capacitive-reactance-calc .result-value{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

#capacitive-reactance-calc .formula-box{
  margin-top:14px;
  padding:14px;
  border-radius:9px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  color:#4b5563;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #capacitive-reactance-calc{
    padding-top:12px;
  }

  #capacitive-reactance-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #capacitive-reactance-calc .unit-select{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:11px;
  }

  #capacitive-reactance-calc input,
  #capacitive-reactance-calc select{
    font-size:14px;
    padding:0 8px;
  }

  #capacitive-reactance-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #capacitive-reactance-calc .result-card{
    padding:12px 10px;
  }

  #capacitive-reactance-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="capacitive-reactance-calc">

<form id="tool-form">

  <div class="calc-grid">

    <div>
      <label class="calc-label">Capacitance</label>
      <div class="calc-row">
        <input type="number" id="capacitance" step="any">
        <select id="farad" class="unit-select">
          <option value="1" selected>F</option>
          <option value="0.000001">µF</option>
          <option value="0.000000001">nF</option>
          <option value="0.000000000001">pF</option>
        </select>
      </div>
    </div>

    <div>
      <label class="calc-label">Frequency</label>
      <div class="calc-row">
        <input type="number" id="frequency" step="any">
        <select id="hertz" class="unit-select">
          <option value="1" selected>Hz</option>
          <option value="1000">kHz</option>
          <option value="1000000">MHz</option>
          <option value="1000000000">GHz</option>
        </select>
      </div>
    </div>

  </div>

  <button type="button" id="calculate">Calculate</button>

  <div class="result-title">RESULTS</div>

  <div class="result-grid">

    <div class="result-card blue">
      <div class="result-label">Capacitive Reactance</div>
      <div class="result-value"><span id="answer">-</span> Ω</div>
    </div>

    <div class="result-card green">
      <div class="result-label">Formula</div>
      <div class="result-value">Xc = 1 / 2πfC</div>
    </div>

  </div>

  <div class="formula-box">
    Xc = 1 / (2 × π × f × C)<br>
    C is converted to farads using selected unit.<br>
    f is converted to hertz using selected unit.
  </div>

</form>

</div>

<script>
document.getElementById("calculate").addEventListener("click", function(e){
  e.preventDefault();

  var c = Number(document.getElementById("capacitance").value);
  var f = Number(document.getElementById("frequency").value);

  c = c * Number(document.getElementById("farad").value);
  f = f * Number(document.getElementById("hertz").value);

  var result = 1 / (2 * Math.PI * f * c);

  document.getElementById("answer").innerText = result.toFixed(4);
});
</script>

</body>
</html>
