<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
#resistor-noise-calc,
#resistor-noise-calc *{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  padding:10px;
}

#resistor-noise-calc{
  width:100%;
  max-width:620px;
  margin:auto;
  padding-top:14px;
  background:transparent;
  border:none;
}

#resistor-noise-calc .calc-grid{
  display:grid;
  gap:12px;
}

#resistor-noise-calc .calc-label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#344054;
  margin-bottom:6px;
}

#resistor-noise-calc .calc-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 82px;
  gap:8px;
  align-items:center;
}

#resistor-noise-calc input{
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:0 12px;
  font-size:14px;
  color:#111827;
  background:#fff;
  outline:none;
  text-align:center;
}

#resistor-noise-calc input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.12);
}

#resistor-noise-calc .unit-box{
  width:82px;
  min-width:82px;
  max-width:82px;
  height:43px;
  border:1px solid #cfd6df;
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  color:#111827;
}

#resistor-noise-calc button{
  width:100%;
  height:45px;
  margin-top:22px;
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,#ff7a18,#ff3d00);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(255,91,0,.22);
}

#resistor-noise-calc .result-title{
  margin-top:26px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
  color:#98a2b3;
  letter-spacing:.8px;
}

#resistor-noise-calc .result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#resistor-noise-calc .result-card{
  min-height:64px;
  padding:13px;
  border-radius:8px;
}

#resistor-noise-calc .blue{
  background:#eef5ff;
  border:1px solid #bcd7ff;
}

#resistor-noise-calc .green{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
}

#resistor-noise-calc .result-label{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:8px;
}

#resistor-noise-calc .blue .result-label,
#resistor-noise-calc .blue .result-value{
  color:#2563eb;
}

#resistor-noise-calc .green .result-label,
#resistor-noise-calc .green .result-value{
  color:#059669;
}

#resistor-noise-calc .result-value{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

#resistor-noise-calc .formula-box{
  margin-top:14px;
  padding:14px;
  border-radius:9px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  color:#4b5563;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}

@media(max-width:600px){
  body{
    padding:0;
  }

  #resistor-noise-calc{
    padding-top:12px;
  }

  #resistor-noise-calc .calc-row{
    grid-template-columns:minmax(0,1fr) 72px;
    gap:7px;
  }

  #resistor-noise-calc .unit-box{
    width:72px;
    min-width:72px;
    max-width:72px;
    font-size:12px;
  }

  #resistor-noise-calc input{
    font-size:14px;
    padding:0 10px;
  }

  #resistor-noise-calc .result-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  #resistor-noise-calc .result-card{
    padding:12px 10px;
  }

  #resistor-noise-calc .result-value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="resistor-noise-calc">

  <form name="ParamForm">

    <div class="calc-grid">

      <div>
        <label class="calc-label">Temperature</label>
        <div class="calc-row">
          <input name="T" type="number" step="any">
          <div class="unit-box">°C</div>
        </div>
      </div>

      <div>
        <label class="calc-label">Resistance</label>
        <div class="calc-row">
          <input name="R" type="number" step="any">
          <div class="unit-box">Ω</div>
        </div>
      </div>

      <div>
        <label class="calc-label">Bandwidth (F₂ − F₁)</label>
        <div class="calc-row">
          <input name="dF" type="number" step="any">
          <div class="unit-box">Hz</div>
        </div>
      </div>

    </div>

    <button type="button" name="B1" onclick="Compute(document.ParamForm);">Calculate</button>

    <div class="result-title">RESULTS</div>

    <div class="result-grid">

      <div class="result-card blue">
        <div class="result-label">Vn RMS</div>
        <div class="result-value"><span id="Vnout">-</span> µV</div>
      </div>

      <div class="result-card green">
        <div class="result-label">Noise Level</div>
        <div class="result-value"><span id="Lvout">-</span> dBv</div>
      </div>

    </div>

    <input name="Vn" type="hidden">
    <input name="Lv" type="hidden">

    <div class="formula-box">
      Vn = √(4 × Kb × R × T × ΔF)<br>
      Vn(µV) = Vn × 1,000,000<br>
      Lv = 20 × log₁₀(Vn)<br>
      Kb = 1.3806505 × 10⁻²³
    </div>

  </form>

</div>

<script>
function Log10(x){
return Math.log(x) / Math.log(10);
}

function Compute(form) {
	with(Math) {
		var T= Number(form.T.value)+273;
		var R= Number(form.R.value);
		var dF= Number(form.dF.value);
		var Kb= 1.3806505E-23;
		var Precision= 6;
		var MEG= 1000000;
		
		var Lv;
		
		
		Vn= sqrt(4*Kb*R*T*dF);
		Vnu= Vn*MEG;
		Lv= 20*Log10(Vn);

		
		form.Vn.value= Vnu.toPrecision(Precision);		
		form.Lv.value= Lv.toPrecision(Precision);

    document.getElementById("Vnout").innerText = form.Vn.value;
    document.getElementById("Lvout").innerText = form.Lv.value;
	}
}
</script>

</body>
</html>
